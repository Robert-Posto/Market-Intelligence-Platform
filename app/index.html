const cmBanda = (cifre, chipuri, eticheta = "Pe bănci · clic = filtru") => `<div class="cm-banda">
  <div class="cm-cifre">${cifre.map(([n, t, titlu]) =>
    `<div${titlu ? ` title="${esc(titlu)}"` : ""}><b>${n}</b><span>${t}</span></div>`).join("")}</div>
  ${chipuri ? `<div class="cm-chipuri"><span class="cm-et">${eticheta}</span>${chipuri}</div>` : ""}</div>`;
/* chip-ul băncii alese în filtru rămâne aprins */
function cmMarcheaza(id){
  const s = document.getElementById(id), v = s ? s.value : "";
  document.querySelectorAll(".cm-chip[data-b]").forEach(c => c.classList.toggle("activ", !!v && c.dataset.b === v));
}
/* tabelul fără filtrare pe ascuns: alege banca din select (încă un clic: toate) */
function cmComutaBanca(id, slug){
  const s = document.getElementById(id);
  if(s) s.value = s.value === slug ? "" : slug;
}

/* 2.4: reclamele de pe Bing. Filtrele lucrează pe rândurile deja desenate (fără cerere nouă). */
const bingLimita = 50;
const bingAfisari = t => { const x = String(t || "").match(/([\d.,]+)\s*([KM]?)/i);
  return x ? parseFloat(x[1].replace(",", ".")) * ({K: 1e3, M: 1e6}[x[2].toUpperCase()] || 1) : NaN; };
function filtreazaBing(){
  const b = document.getElementById("bg-banca").value;
  const toate = document.getElementById("bg-toate").checked;
  const t = fara_diacritice(document.getElementById("bg-cauta").value.trim());
  let n = 0;
  document.querySelectorAll("#bg-tabel tbody tr").forEach(r => {
    const da = (toate || r.dataset.ro === "1") && (!b || r.dataset.banca === b)
      && (!t || (r.dataset.cauta || "").includes(t));
    r.style.display = da ? "" : "none";
    n += da;
  });
  document.getElementById("bg-n").textContent = `${n} ${n === 1 ? "reclamă" : "reclame"}`;
  document.getElementById("bg-gol").style.display = n ? "none" : "";
  cmMarcheaza("bg-banca");
}
function bancaBing(slug){ cmComutaBanca("bg-banca", slug); filtreazaBing(); }
function reclameBing(d, m){
  const info = `<span class="pill amb" title="Microsoft Ad Library. Datele stau într-un fișier local, nu în bază; test, până la avizul juridic"
    >Microsoft Ad Library · ${esc(d.fotografie || "—")} · test</span>`;
  const rec = d.reclame || [];
  if(!rec.length) return {info, corp: '<p class="note">Nicio reclamă în fotografie (fișierul output/reclame/microsoft_*.json lipsește sau e gol).</p>'};
  const ro = r => r.pondere_ro !== null && r.pondere_ro >= 50;
  const pe = {};
  rec.forEach(r => { const x = pe[r.banca] = pe[r.banca] || {ro: 0, alt: 0}; ro(r) ? x.ro++ : x.alt++; });
  const slugs = Object.keys(pe).sort((a, b) => (b === "libra") - (a === "libra") || pe[b].ro - pe[a].ro
    || (m.nume[a] || a).localeCompare(m.nume[b] || b, "ro"));
  const nRo = rec.filter(ro).length;
  // Libra rămâne reperul și când nu are nicio reclamă pe Bing
  const chipuri = (pe.libra ? "" : cmChip("libra", m, "0", "nicio reclamă pe Bing"))
    + slugs.map(b => cmChip(b, m, String(pe[b].ro), `${pe[b].ro} țintite pe România${pe[b].alt
        ? ` + ${pe[b].alt} ale grupului, în alte țări` : ""} · clic: filtrează tabelul (încă un clic: toate)`,
      `bancaBing('${esc(b)}')`)).join("");
  const banda = cmBanda([
    [num(nRo, 0), "țintite pe România", "reclame cu cel puțin 50% din afișări în România"],
    [num(rec.length, 0), "găsite în total"],
    [num(d.banci_verificate || 0, 0), "bănci verificate"],
  ], chipuri);
  const oprit = d.oprit ? `<div class="callout warn" style="margin-bottom:12px"><b>Extragerea s-a oprit înainte de final</b>
    (limita de cereri a Microsoft: HTTP 429). Lipsesc bănci din listă; ce se completează apare la reîncărcarea paginii.</div>` : "";
  const tab = tabel(rec, [
    {cap: "Bancă", html: true, s: r => m.nume[r.banca] || r.banca, val: r => etichetaBanca(r.banca, m)},
    {cap: "Reclama", html: true, s: r => r.titlu || "", val: r => `<b>${esc(r.titlu || "—")}</b>
      <div class="gri" style="font-size:11.5px;margin-top:2px;max-width:60ch">${esc(r.text || "")}</div>${
      r.advertiser ? `<div class="gri" style="font-size:11px;margin-top:2px" title="advertiserul${r.platitor ? "; plătit de " + esc(r.platitor) : ""}">${esc(r.advertiser)}</div>` : ""}`},
    {cap: "Perioada", cls: "mono", td: () => ({attr: 'style="white-space:nowrap"'}), s: r => r.start || "", val: r => `${r.start || "?"} → ${r.sfarsit || "?"}`},
    {cap: "Afișări", cls: "num", s: r => bingAfisari(r.afisari), val: r => r.afisari || "—"},
    {cap: "% România", cls: "num", html: true, s: r => r.pondere_ro, val: r => r.pondere_ro === null ? "—"
      : `<span class="${ro(r) ? "" : "gri"}">${num(r.pondere_ro, 1)}%</span>`},
    {cap: "Sursa", html: true, td: () => ({attr: 'style="white-space:nowrap"'}), val: r => r.link_biblioteca
      ? `<a class="sursa" href="${esc(r.link_biblioteca)}" target="_blank" rel="noopener noreferrer">↗ Ad Library</a>` : "—"},
  ], {sort: true, implicit: [4, "desc"], rand: r => ({
    attr: `data-banca="${esc(r.banca)}" data-ro="${ro(r) ? 1 : 0}"`,
    cauta: fara_diacritice([r.titlu, r.text, r.advertiser, m.nume[r.banca] || r.banca].join(" "))})});
  const filtre = `
    <label class="f">Bancă<select id="bg-banca" onchange="filtreazaBing()"><option value="">Toate băncile</option>${
      slugs.map(b => `<option value="${esc(b)}">${esc(m.nume[b] || b)}</option>`).join("")}</select></label>
    <label class="f">Caută<input class="cauta" id="bg-cauta" type="search" placeholder="Caută în titlu sau text…" oninput="filtreazaBing()"></label>
    <label class="bifa"><input type="checkbox" id="bg-toate" onchange="filtreazaBing()" title="reclamele grupului cu sub 50% din afișări în România">și reclamele grupului din alte țări</label>
    <span class="gri" id="bg-n" style="font-size:12px;margin-left:auto;align-self:center"></span>`;
  return {info, filtre, banda, corp: `${oprit}
    <div id="bg-tabel">${tab}</div>
    <p class="note" id="bg-gol" style="display:none">Nicio reclamă nu se potrivește filtrelor.</p>
    ${despre(`Datele vin din API-ul public al Microsoft Advertising Ad Library, fără cont, cu User-Agent-ul proiectului
      (cu contact) și cu robots.txt verificat. Aduce: textul reclamei, perioada, intervalul de afișări, ponderea pe țări,
      cine a plătit. <b>Nu</b> aduce cheltuieli, clicuri sau cuvinte-cheie.<br>
      Reclamele grupurilor (ING N.V., Raiffeisen Bank International) apar și ele, cu ponderea României: implicit se văd
      doar cele cu cel puțin 50% din afișări în România. Libra nu face reclamă pe Bing.<br>
      Datele stau într-un fișier local (<span class="mono">output/reclame/microsoft_*.json</span>), nu în bază:
      tabelul de reclame vine cu migrarea 019, după avizul juridic. Pagina citește cea mai recentă fotografie la fiecare încărcare.`)}`};
}

/* 2.4: reclamele Google (Ads Transparency Center). Sunt 16.765 în fotografia din 30.09, prea
   multe pentru un tabel întreg: filtrul, sortarea și paginarea le face serverul, iar aici se
   redesenează doar rezultatul, ca filtrele Bing de mai sus să nu se piardă. */
const GG_PLATFORMA = {SEARCH: "Search", YOUTUBE: "YouTube", MAPS: "Maps", PLAY: "Play", SHOPPING: "Shopping",
  sub_1000: "sub 1.000 peste tot", fara_date: "fără date de platformă"};
const GG_FORMAT = {TEXT: "text", IMAGE: "imagine", VIDEO: "video"};
const GG_COLOANE = ["banca", "advertiser", "format", "platforma", "prima", "ultima", "afisari"];
const GG = {ordine: "ultima", sens: "desc", offset: 0, nr: 0, t: null};
const ggPlat = p => String(p || "").split("+").map(x => GG_PLATFORMA[x] || x).join(" + ");
const ggNr = v => v >= 1e6 ? `${num(v / 1e6, 1)} mil.` : num(v, 0);
/* linkul public al reclamei, refăcut din coduri (ca în galeria colegului); se deschide doar la clic */
const ggLink = r => `https://adstransparency.google.com/advertiser/${encodeURIComponent(r.advertiser_id)}/creative/${encodeURIComponent(r.creative_id)}?region=RO`;

async function filtreazaGoogle(pastreazaPagina){
  if(!pastreazaPagina) GG.offset = 0;
  const v = id => document.getElementById(id);
  const p = new URLSearchParams({banca: v("gg-banca").value, format: v("gg-format").value,
    platforma: v("gg-platforma").value, perioada: v("gg-perioada").value, q: v("gg-cauta").value.trim(),
    doar_ro: v("gg-ro").checked ? "1" : "", filiale: v("gg-filiale").checked ? "1" : "",
    ordine: GG.ordine, sens: GG.sens, offset: String(GG.offset)});
  const nr = ++GG.nr, gazda = v("gg-rezultat");
  cmMarcheaza("gg-banca");
  gazda.style.opacity = ".45";
  try{
    const [d, m] = await Promise.all([ia("/api/reclame_google?" + p), meta()]);
    if(nr === GG.nr) gazda.innerHTML = ggRezultat(d, m);      // un filtru mai nou câștigă
  }catch(e){
    if(nr === GG.nr) gazda.innerHTML = `<p class="note" style="color:var(--warn)">Eroare: ${esc(e.message)}</p>`;
  }
  if(nr === GG.nr) gazda.style.opacity = "";
}
function sorteazaGoogle(th){
  const col = GG_COLOANE[[...th.parentNode.children].indexOf(th)];
  if(!col) return;
  GG.sens = col === GG.ordine && GG.sens === "desc" ? "asc" : "desc";
  GG.ordine = col;
  filtreazaGoogle();
}
function paginaGoogle(offset){ GG.offset = offset; filtreazaGoogle(true); }
function bancaGoogle(slug){ cmComutaBanca("gg-banca", slug); filtreazaGoogle(); }

function ggRezultat(d, m){
  const f = d.filtrat, lim = d.limit, off = d.offset, n = f.n;
  const z = new Date(d.ultima_zi + "T00:00:00Z"); z.setUTCDate(z.getUTCDate() - 6);
  const prag7 = z.toISOString().slice(0, 10);
  const activ = GG_COLOANE.indexOf(d.ordine);
  const lista = (o, et) => Object.entries(o).sort((a, b) => b[1] - a[1])
    .map(([k, x]) => `${esc(et[k] || k || "—")} <b>${num(x, 0)}</b>`).join(" · ");
  const rezumat = `<p class="note" style="margin:0 0 10px;max-width:none"><b>${num(n, 0)}</b> ${n === 1 ? "reclamă" : "reclame"}
    de la ${f.banci} ${f.banci === 1 ? "bancă" : "bănci"}${n ? ` · format: ${lista(f.pe_format, GG_FORMAT)}
    <br>suprafața principală: ${lista(f.pe_platforma, GG_PLATFORMA)}` : ""}</p>`;
  if(!n) return rezumat + '<p class="note">Nicio reclamă nu se potrivește filtrelor.</p>';
  const k0 = () => 0;      // sortarea o face serverul, pe tot filtrul; coloana doar arată săgeata
  const mic = t => `<div class="gri" style="font-size:11px;margin-top:2px">${t}</div>`;
  const tab = tabel(d.randuri, [
    {cap: "Bancă", html: true, s: k0, td: () => ({attr: 'style="white-space:nowrap"'}),
      val: r => etichetaBanca(r.banca, m, {fisa: true}) + (r.filiala
      ? ' <span class="pill" title="filială a grupului, în afara comparației între bănci">filială</span>' : "")},
    {cap: "Advertiser", html: true, s: k0, val: r => esc(r.advertiser || "—")
      + (r.platitor ? mic(`plătit de ${esc(r.platitor)}`) : "")},
    {cap: "Format", html: true, s: k0, val: r => esc(GG_FORMAT[r.format] || r.format || "—")
      + (r.tema ? `<div class="gri" style="font-size:11px;margin-top:2px" title="tema pusă automat de Google; poate diferi de pagina ATC">${esc(r.tema)}</div>` : "")},
    {cap: "Suprafață principală", titlu: "platforma cu cea mai mare treaptă de afișări; treci cu mouse-ul pentru toate cinci",
      html: true, s: k0, td: r => (r.platforme ? {attr: `title="${esc(r.platforme)}"`} : {}),
      val: r => r.platforma === "fara_date" || r.platforma === "sub_1000"
        ? `<span class="gri">${esc(ggPlat(r.platforma))}</span>` : esc(ggPlat(r.platforma))},
    {cap: "Prima afișare", cls: "mono", s: k0, td: () => ({attr: 'style="white-space:nowrap"'}), val: r => r.prima || "—"},
    {cap: "Ultima afișare", cls: "mono", html: true, s: k0, td: () => ({attr: 'style="white-space:nowrap"'}),
      val: r => esc(r.ultima || "—") + (r.ultima >= prag7
        ? ' <span class="pill ok" title="afișată în ultimele 7 zile din date">activă</span>' : "")},
    {cap: "Afișări", cls: "num", html: true, s: k0, td: () => ({attr: 'style="white-space:nowrap"'}),
      titlu: `intervalul publicat de Google, numărat până la ${d.afisari_pana_la || "—"}`,
      val: r => r.af_deschis ? "peste 10 mil." : r.af_jos !== null ? `${ggNr(r.af_jos)}–${ggNr(r.af_sus)}`
        : `<span class="gri" title="Google publică afișările cu 90 de zile întârziere">din ${esc(r.af_din || "—")}</span>`},
    {cap: "Sursa", html: true, td: () => ({attr: 'style="white-space:nowrap"'}), val: r =>
      `<a class="sursa" href="${esc(ggLink(r))}" target="_blank" rel="noopener noreferrer" title="${esc(r.creative_id)}">↗ ATC</a>`},
  ], {sort: true, implicit: activ >= 0 ? [activ, d.sens] : undefined,
      rand: r => (r.banca === "libra" ? {cls: "libra"} : {})})
    .replaceAll('onclick="sorteaza(this)"', 'onclick="sorteazaGoogle(this)"');
  const pag = n > lim ? `<div class="pagini"><span>${num(off + 1, 0)}–${num(Math.min(off + lim, n), 0)} din ${num(n, 0)}</span>
    ${off > 0 ? `<button onclick="paginaGoogle(0)">« prima</button><button onclick="paginaGoogle(${off - lim})">‹ înapoi</button>` : ""}
    ${off + lim < n ? `<button onclick="paginaGoogle(${off + lim})">înainte ›</button>
      <button onclick="paginaGoogle(${Math.floor((n - 1) / lim) * lim})">ultima »</button>` : ""}</div>` : "";
  return rezumat + tab + pag;
}

function reclameGoogle(d, m){
  const info = `<span class="pill amb" title="Google Ads Transparency Center. Datele stau într-un fișier local, nu în bază; test, până la avizul juridic"
    >Ads Transparency Center · ${esc(d.fotografie || "—")} · test</span>`;
  if(!d.fotografie) return {info, corp: '<p class="note">Nicio fotografie Google (lipsește output/reclame/google_*/ cu atc_ro_*.csv și google_advertiseri.csv).</p>'};
  const banci = d.banci || [], fil = (d.filiale || []).reduce((s, b) => s + b.n, 0);
  const lasate = d.lasate_deoparte || {};
  const mil = v => num(v / 1e6, 1);
  const afis = b => b.af_deschis ? `≥ ${mil(b.af_jos)} mil.` : b.af_sus >= 1e6 ? `${mil(b.af_jos)}–${mil(b.af_sus)} mil.`
    : `${ggNr(b.af_jos)}–${ggNr(b.af_sus)}`;
  // Libra prima, ca reper; restul în ordinea serverului (după numărul de reclame)
  const ordonate = banci.slice().sort((a, b) => (b.banca === "libra") - (a.banca === "libra"));
  const chipuri = (banci.some(b => b.banca === "libra") ? "" : cmChip("libra", m, "0", "nicio reclamă în set"))
    + ordonate.map(b => cmChip(b.banca, m, num(b.n, 0), `${num(b.active7, 0)} active în 7 zile · ${num(b.noi30, 0)} noi în 30 · ${
        afis(b)} afișări · clic: filtrează tabelul (încă un clic: toate)`, `bancaGoogle('${esc(b.banca)}')`)).join("");
  const banda = cmBanda([
    [num(d.total, 0), "reclame ale băncilor", "afișate în România în ultimul an"],
    [`${banci.length}<small> din 30</small>`, "bănci găsite"],
    [esc(d.ultima_zi || "—"), "ultima zi din date", `afișări numărate până la ${d.afisari_pana_la || "—"}`],
  ], chipuri);
  const peBanci = `<details class="despre"><summary>Pe bănci: active, noi, afișări</summary>${tabel(banci, [
    {cap: "Bancă", html: true, s: b => m.nume[b.banca] || b.banca, val: b => etichetaBanca(b.banca, m, {tag: true})},
    {cap: "Reclame", cls: "num", s: b => b.n, val: b => num(b.n, 0)},
    {cap: "Active în 7 zile", cls: "num", s: b => b.active7, val: b => num(b.active7, 0)},
    {cap: "Noi în 30 de zile", cls: "num", s: b => b.noi30, val: b => num(b.noi30, 0)},
    {cap: "Afișări (ordin de mărime)", cls: "num", s: b => b.af_jos, val: b => afis(b)},
  ], {sort: true, libra: b => b.banca, implicit: [1, "desc"],
      rand: b => ({clic: `bancaGoogle('${esc(b.banca)}')`})})}</details>`;
  const opt = (v, t) => `<option value="${esc(v)}">${esc(t)}</option>`;
  const platforme = [...Object.keys(GG_PLATFORMA).filter(k => d.platforme.includes(k)),
                     ...d.platforme.filter(k => !GG_PLATFORMA[k])];
  const filtre = `
    <label class="f">Bancă<select id="gg-banca" onchange="filtreazaGoogle()">${opt("", "Toate băncile")}${
      banci.map(b => b.banca).sort((a, b) => (m.nume[a] || a).localeCompare(m.nume[b] || b, "ro"))
        .map(b => opt(b, m.nume[b] || b)).join("")}</select></label>
    <label class="f">Format<select id="gg-format" onchange="filtreazaGoogle()">${opt("", "Toate")}${
      d.formate.map(x => opt(x, GG_FORMAT[x] || x)).join("")}</select></label>
    <label class="f">Suprafață principală<select id="gg-platforma" onchange="filtreazaGoogle()">${opt("", "Toate")}${
      platforme.map(x => opt(x, GG_PLATFORMA[x] || x)).join("")}</select></label>
    <label class="f">Perioada activă<select id="gg-perioada" onchange="filtreazaGoogle()">${
      [["", "tot anul din set"], ["activ7", "active în ultimele 7 zile"], ["activ30", "active în ultimele 30 de zile"],
       ["activ90", "active în ultimele 90 de zile"], ["noi30", "pornite în ultimele 30 de zile"]].map(([v, t]) => opt(v, t)).join("")}</select></label>
    <label class="f">Caută<input class="cauta" id="gg-cauta" type="search" placeholder="advertiser, agenție, temă, cod CR…"
      oninput="clearTimeout(GG.t);GG.t=setTimeout(filtreazaGoogle,250)"></label>
    <label class="bifa" title="reclamele cu o singură țară în afară de total: deducție, neconfirmată de Google"><input type="checkbox" id="gg-ro" onchange="filtreazaGoogle()">doar RO (livrate numai în România)</label>
    ${fil ? `<label class="bifa" title="${esc((d.filiale || []).map(b => (m.nume[b.banca] || b.banca) + ": " + b.n).join(" · "))}"><input type="checkbox" id="gg-filiale" onchange="filtreazaGoogle()">+ filialele (${num(fil, 0)})</label>`
      : '<input type="checkbox" id="gg-filiale" hidden>'}`;
  return {info, filtre, banda, corp: `
    <div id="gg-rezultat">${ggRezultat(d, m)}</div>
    ${peBanci}
    ${despre(`<b>Sursa:</b> setul public oficial Google Ads Transparency Center din BigQuery
      (<span class="mono">bigquery-public-data.google_ads_transparency_center.creative_stats</span>), descărcat de
      Nicolae Cherascu pe 29–30.09.2026: toate reclamele livrate în România de advertiserii băncilor. Banca vine din lista de
      advertiseri verificată de mână (<span class="mono">google_advertiseri.csv</span>). Aplicația citește doar fișierul local
      <span class="mono">${esc(d.fisier || "")}</span>; nu face nicio cerere spre Google.<br>
      <b>Ce conține:</b> advertiserul și, uneori, cine a plătit (agenția), formatul, tema pusă de Google, prima și ultima
      afișare în România, intervalul de afișări, afișările pe fiecare platformă (Search, YouTube, Maps, Play, Shopping).<br>
      <b>Ce nu conține:</b> textul, imaginea sau videoclipul reclamei, pagina spre care duce, campania, cuvintele-cheie,
      bugetul și cheltuielile, clicurile, numărul exact de afișări. Doar din aceste date nu se poate spune <b>despre ce</b> e o reclamă.<br>
      <b>Cum se citește:</b> o „reclamă” e o variantă de creație, nu o campanie (pe Search sunt multe variante de text), deci
      numărul nu arată presiunea publicitară: BT are 61% dintre reclame, dar la afișări e sub Revolut, ING, Raiffeisen și BCR.
      Afișările sunt trepte (0–1.000, 1.000–2.000, …, peste 10 milioane), publicate cu 90 de zile întârziere (numărate până la
      ${esc(d.afisari_pana_la || "—")}); „din &lt;dată&gt;” înseamnă că Google nu le-a publicat încă. Suma pe bancă e un ordin de mărime,
      „≥” când măcar o reclamă e în treapta deschisă. Fiecare reclamă cu date apare pe toate cele cinci platforme: se arată cea cu
      treapta cea mai mare; sub 1.000 peste tot sau fără date de platformă înseamnă că nu se poate spune.<br>
      <b>Limite:</b> Google păstrează doar ultimul an (o reclamă iese din set la un an după ultima afișare) și avertizează că setul
      poate fi incomplet. Găsite: ${banci.length} bănci din 30. BRD publică prin agenția Sense8, cu „plătit de” gol la toate cele
      ${num(lasate.agentie_fara_platitor || 0, 0)} de reclame ale contului, deci nu se poate separa și lipsește; Intesa publică prin
      WPP Media Romania, plătit de Intesa. Grupurile din alte țări (RBI, în germană, și altele) și potrivirile false de nume
      (GARANTI PREST, „Revolut” cu reclame Autovit) sunt lăsate deoparte (${num(lasate.exclus || 0, 0)} în fișier). Filialele (BCR Social
      Finance, BCR Leasing, BCR Pensii, BRD Asset Management) se văd doar la cerere. „Doar în România” e o deducție din numărul de
      țări, neconfirmată de Google; tema Google e aproximativă.<br>

/* 2.4: campaniile de pe site-urile băncilor (migrarea 019, colectorul ingest/campanii.py).
   Sunt 742 în rularea din 30.09.2026: vin toate deodată, iar filtrele se combină aici,
   fără cereri noi. Implicit: doar cele active și doar cele organizate de bancă; filialele,
   schema de card și partenerii se păstrează în bază, dar nu intră în comparație. */
const CP = {date: null, com: null, comOffset: 0, t: null, cache: {}};
const CP_STARE = {activa: ["activă", "ok"], incheiata: ["încheiată", ""], de_verificat: ["de verificat", "amb"]};
const CP_ORD_STARE = {activa: 0, de_verificat: 1, incheiata: 2};
const CP_TIP = {campanie: "campanie", program: "program permanent", oferta_curenta: "ofertă fără termen"};
const CP_CATEG = {conturi_carduri: "conturi și carduri", credite: "credite", depozite: "depozite"};
const CP_ORG = {grup: ["filială", "organizată de o filială a grupului"], schema_card: ["schema de card", "organizată de Visa sau Mastercard"],
                partener: ["partener", "organizată de un partener al băncii"]};
const CP_ROL = {regulament: "regulament", act_aditional: "act adițional", landing: "document"};
const CP_PE_PAGINA = 50;
const cpZi = d => d ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : "?";

/* Pe 30.09.2026, ~215 titluri erau textul linkului de pe pagina-listă („aici” de 65 de ori
   la ING, „Vezi regulamentul, Deschide in tab nou” de 57 de ori la BCR): nu spun despre ce
   e campania. Acolo se arată și numele documentului din adresă, marcat ca atare. */
const CP_TITLU_GOL = /^(aici|vezi( regulament(ul)?)?|detalii [iî]n regulament|regulament(ul)?( oficial)?( al)?( campaniei| campanie| promo[tț]iei)?|promo[tț]ie|campanii|saltbank|brd|vista bank)$/i;
const cpTitluGol = t => { const x = String(t || "").replace(/\s*,\s*deschide in tab nou\s*$/i, "").trim();
                          return !x || CP_TITLU_GOL.test(x) || /^pdf\s/i.test(x); };
function cpNumeDinUrl(u){
  try{
    const seg = new URL(u).pathname.split("/").filter(Boolean);
    return decodeURIComponent(seg[seg.length - 1] || "").replace(/(\.(pdf|html?|coredownload))+$/i, "")
      .replace(/[-_]+/g, " ").trim();
  }catch(e){ return ""; }
}
const cpDocPrincipal = r => (r.documente || []).find(d => d.rol === "regulament") || null;

function cpCampanie(r){
  const gol = cpTitluGol(r.titlu), dinUrl = gol ? cpNumeDinUrl((cpDocPrincipal(r) || r).url) : "";
  const titlu = gol && dinUrl
    ? `<b title="titlul din adresa documentului; eticheta linkului era „${esc(r.titlu || "")}”">${esc(dinUrl)}</b>
       <span class="gri" style="font-size:11px">(din adresă)</span>`
    : `<b>${esc(r.titlu || "—")}</b>`;
  const tip = r.tip_oferta && r.tip_oferta !== "campanie" ? ` <span class="pill">${esc(CP_TIP[r.tip_oferta])}</span>` : "";
  const ben = r.beneficiu || "", scurt = ben.length > 160 ? ben.slice(0, 159) + "…" : ben;
  return titlu + tip + (ben ? `<div class="gri" style="font-size:11.5px;margin-top:2px;max-width:70ch"
    title="citat din document: ${esc(ben)}">${esc(scurt)}</div>` : "");
}

function cpPerioada(r){
  if(!r.fereastra_start && !r.fereastra_sfarsit) return '<span class="gri">fără perioadă</span>';
  const din = {eticheta_link: "din eticheta linkului", url: "din adresă"}[r.sursa_ferestrei];
  return `${cpZi(r.fereastra_start)} – ${cpZi(r.fereastra_sfarsit)}`
    + (din ? `<div class="gri" style="font-size:11px">${din}</div>` : "")
    + (r.act_aditional ? ' <span class="pill amb" title="există un act adițional: sfârșitul poate fi altul">act adițional</span>' : "");
}

function cpStare(r){
  const [t, cls] = CP_STARE[r.stare] || [r.stare, ""];
  const intre = r.stare === "activa" && r.incheiata_azi
    ? ' <span class="pill" title="activă la data rulării; sfârșitul a trecut între timp">încheiată între timp</span>' : "";
  return `<span class="pill ${cls}">${esc(t)}</span>${intre}`
    + (r.motiv_verificare ? `<div class="${r.stare === "de_verificat" ? "" : "gri"}" style="font-size:11px;margin-top:3px;max-width:30ch">${esc(r.motiv_verificare)}</div>` : "");
}

/* ↗ duce la sursa oficială, pe site-ul băncii; 📄 deschide copia din Bronze (exact
   versiunea din care s-au citit câmpurile) în vizualizatorul propriu, fără cerere spre
   bancă, cu citatul perioadei căutat în document. */
function cpDocumente(r){
  const lk = (href, t, titlu, tinta = "_blank") => `<a class="sursa" href="${esc(href)}" target="${tinta}"
    rel="noopener noreferrer" title="${esc(titlu)}">${t}</a>`;
  const q = r.sursa_ferestrei === "document" ? r.fereastra_citat || "" : "";
  const docs = (r.documente || []).filter(d => !(d.url === r.url && d.format !== "pdf"));
  const legaturi = docs.map(d => {
    const et = CP_ROL[d.rol] || d.rol;
    if(d.format === "pdf" && d.in_bronze)
      return lk(`/pdf.html?u=${encodeURIComponent(d.url)}&p=1&q=${encodeURIComponent(d.rol === "regulament" ? q : "")}`,
        `📄 ${esc(et)}`, `în vizualizatorul aplicației, din Bronze${d.fara_text ? " (PDF scanat, fără strat de text)" : ""} — ${d.url}`);
    return lk(d.url, `↗ ${esc(et)}`, d.format ? `pe site-ul băncii: ${d.url}`
      : `documentul nu s-a putut aduce la colectare; se deschide pe site-ul băncii: ${d.url}`);
  });
  const primele = legaturi.slice(0, 2).join("<br>"), rest = legaturi.slice(2);
  return lk(r.url, "↗ sursa", `sursa oficială, pe site-ul băncii: ${r.url}`)
    + (primele ? "<br>" + primele : "")
    + (rest.length ? `<details><summary class="gri" style="cursor:pointer;font-size:11.5px">+${rest.length} documente</summary>${rest.join("<br>")}</details>` : "");
}

function cpFiltrate(){
  const v = id => document.getElementById(id);
  const f = {banca: v("cp-banca").value, stare: v("cp-stare").value, tip: v("cp-tip").value,
             segment: v("cp-segment").value, cat: v("cp-categ").value,
             q: fara_diacritice(v("cp-cauta").value.trim()), filiale: v("cp-filiale").checked};
  const potriveste = (val, ales, gol) => !ales || (ales === gol ? !val : val === ales);
  return CP.date.randuri.filter(r => (f.filiale || r.in_comparatie)
    && (!f.banca || r.banca === f.banca) && (!f.stare || r.stare === f.stare)
    && potriveste(r.tip_oferta, f.tip, "nedecis") && potriveste(r.segment, f.segment, "nemarcat")
    && potriveste(r.categorie_produs, f.cat, "nemarcata") && (!f.q || r._cauta.includes(f.q)));
}

function cpRezultat(lista, m){
  const n = s => lista.filter(r => r.stare === s).length;
  const banci = new Set(lista.map(r => r.banca)).size;
  const rezumat = `<p class="note" style="margin:0 0 10px;max-width:none"><b>${num(lista.length, 0)}</b>
    ${lista.length === 1 ? "campanie" : "campanii"} la ${banci} ${banci === 1 ? "bancă" : "bănci"}${lista.length
    ? ` · ${n("activa")} active · ${n("de_verificat")} de verificat · ${n("incheiata")} încheiate` : ""}</p>`;
  if(!lista.length) return rezumat + '<p class="note">Nicio campanie nu se potrivește filtrelor.</p>';
  /* cele mai noi întâi, fără perioadă la coadă; sortarea inițială din tabel() ar pune golurile sus la „desc” */
  const inceput = r => r.fereastra_start || r.fereastra_sfarsit || "";
  lista = lista.slice().sort((a, b) => !inceput(a) - !inceput(b) || inceput(b).localeCompare(inceput(a)));
  return rezumat + tabel(lista, [
    {cap: "Bancă", html: true, s: r => m.nume[r.banca] || r.banca, td: () => ({attr: 'style="white-space:nowrap"'}),
      val: r => etichetaBanca(r.banca, m, {fisa: true, tag: true}) + (CP_ORG[r.organizator]
        ? `<div><span class="pill" title="${esc(CP_ORG[r.organizator][1] + (r.organizator_citat ? ": " + r.organizator_citat : ""))}">${esc(CP_ORG[r.organizator][0])}</span></div>` : "")},
    {cap: "Campanie", html: true, s: r => r.titlu || "", val: cpCampanie},
    {cap: "Perioadă", cls: "mono", html: true, s: r => r.fereastra_start || r.fereastra_sfarsit || "",
      titlu: "treci cu mouse-ul: textul din care s-a citit perioada",
      td: r => ({attr: `style="white-space:nowrap"${r.fereastra_citat ? ` title="${esc("„" + r.fereastra_citat + "”")}"` : ""}`}),
      val: cpPerioada},
    {cap: "Segment", s: r => r.segment || "", val: r => r.segment || "—"},
    {cap: "Categorie", s: r => r.categorie_produs || "", val: r => CP_CATEG[r.categorie_produs] || r.categorie_produs || "—"},
    {cap: "Stare", html: true, s: r => CP_ORD_STARE[r.stare], val: cpStare},
    {cap: "Documente", html: true, td: () => ({attr: 'style="white-space:nowrap"'}), val: cpDocumente},
  ], {sort: true, libra: r => r.banca});
}

  com.forEach(r => { r._cauta = fara_diacritice(`${r.titlu || ""} ${m.nume[r.banca] || r.banca}`); });
  const pe = {};
  com.forEach(r => { pe[r.banca] = (pe[r.banca] || 0) + 1; });
  const banci = Object.keys(pe).sort((a, b) => (b === "libra") - (a === "libra") || (m.nume[a] || a).localeCompare(m.nume[b] || b, "ro"));
  const nCamp = com.filter(r => r.e_campanie).length;
  const rulare = String(CP.date && CP.date.rulare.comunicate || "").slice(0, 10);
  const info = `<span class="pill ok" title="colectorul ingest/campanii.py, în bază (migrarea 019)">rularea din ${esc(cpZi(rulare))}</span>`;
  const banda = cmBanda([
    [num(com.length, 0), "comunicate de presă"],
    [num(banci.length, 0), "bănci"],
    [num(nCamp, 0), "marcate „campanie”", "regex pe titlu, fără LLM; poate fi o potrivire falsă"],
  ], banci.map(b => cmChip(b, m, String(pe[b]), `${pe[b]} comunicate · clic: filtrează lista (încă un clic: toate)`,
    `bancaComunicate('${esc(b)}')`)).join(""));
  const filtre = `
    <label class="f">Bancă<select id="cm-banca" onchange="filtreazaComunicate()"><option value="">Toate băncile</option>${
      banci.map(b => `<option value="${esc(b)}">${esc(m.nume[b] || b)} (${pe[b]})</option>`).join("")}</select></label>
    <label class="f">Caută<input class="cauta" id="cm-cauta" type="search" placeholder="Caută în titlu…"
      oninput="clearTimeout(CP.t);CP.t=setTimeout(filtreazaComunicate,200)"></label>
    <label class="bifa"><input type="checkbox" id="cm-camp" onchange="filtreazaComunicate()">doar cele marcate „campanie”</label>`;
  return {info, filtre, banda, corp: `
    <div id="cm-rezultat">${cmRezultat(m, com)}</div>
    ${despre(`Titlul, data și adresa, din newsroom-ul fiecărei bănci (sitemap sau pagina-listă), la rularea din
      ${esc(cpZi(rulare))}. Data vine din adresă, din listă sau din pagină,
      niciodată din <span class="mono">lastmod</span>; unde lista nu o publică (Garanti, ING, Libra, ProCredit), lipsește.
      La unele bănci titlul e refăcut din adresă (BCR, Garanti: fără diacritice).<br>
      Marcajul „campanie” e un regex pe titlu (fără LLM), cu cuvântul potrivit la hover: „premii” prinde și premiile
      primite de bancă, „gratuit” și știrile retrospective. E un semnal de citit, nu o clasificare.
      Blocate ca la campanii: Banca Transilvania, CEC, UniCredit, Intesa, Banorient, Cetelem, BRCI.`)}`};
}

/* 2.4: conturile oficiale pe rețelele sociale, un tabel bancă × rețea (înainte, 30 de carduri) */
function reteleSociale(rs, m){
  const pe = {};
  rs.forEach(r => { (pe[r.slug] = pe[r.slug] || {})[r.retea] = r; });
  const lipsa = r => !r || r.url === "NEGASIT";
  const banci = Object.keys(m.rand)
    .sort((a, b) => (b === "libra") - (a === "libra") || (m.nume[a] || a).localeCompare(m.nume[b] || b, "ro"));
  const ordine = ["facebook", "instagram", "linkedin", "tiktok"].map(k => RETELE.find(x => x.k === k));
  const cont = (b, x) => { const r = (pe[b] || {})[x.k]; return lipsa(r) ? null : r; };
  const are = b => ordine.filter(x => cont(b, x)).length;
  const titlu = r => [r.sursa === "site banca" ? "link de pe site-ul băncii" : "găsit prin căutare web", r.nota]
                     .filter(Boolean).join(" · ");
  const celula = (b, x) => {
    const r = cont(b, x);
    if(!r) return '<span class="gri">—</span>';
    const pill = r.nivel === "grup" ? '<span class="pill" title="contul grupului internațional, nu al sucursalei din România">International</span>' : "";
    return `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(contSocial(r.url, x.k))} ↗</a>${pill}`;
  };
  const cauta = b => fara_diacritice([b, m.nume[b] || "", ...ordine.map(x => {
    const r = cont(b, x); return r ? contSocial(r.url, x.k) : ""; })].join(" "));
  const tab = tabel(banci, [
    {cap: "Bancă", html: true, s: b => m.nume[b] || b, val: b => etichetaBanca(b, m, {fisa: true, tag: true})},
    ...ordine.map(x => ({capHtml: `<span class="rs-ic ${x.k}">${SIGLA_RETEA[x.k]}</span>${esc(x.nume)}`, html: true,
      s: b => { const r = cont(b, x); return r ? contSocial(r.url, x.k).toLowerCase() : ""; },
      td: b => { const r = cont(b, x); return {cls: "rs-c", attr: r ? `title="${esc(titlu(r))}"` : ""}; },
      val: b => celula(b, x)})),
    {cap: "Conturi", cls: "num", s: are, td: () => ({attr: 'style="white-space:nowrap"'}), val: b => `${are(b)} din ${ordine.length}`},
  ], {sort: true, libra: b => b, rand: b => ({cauta: cauta(b)})});
  const gasite = rs.filter(r => !lipsa(r));
  const banda = cmBanda([
    [num(gasite.length, 0), "conturi găsite"],
    [`${banci.filter(are).length}<small> din ${banci.length}</small>`, "bănci cu cel puțin un cont"],
    [num(gasite.filter(r => r.nivel === "grup").length, 0), "ale grupului internațional"],
  ], "");
  const filtre = `
    <label class="f">Caută<input class="cauta" type="search" placeholder="Caută bancă sau cont…" oninput="cautaCarduri(this)"></label>
    <span class="gri" id="rs-n" style="font-size:12px;align-self:center"></span>
    <span class="rs-leg" style="margin:0 0 0 auto;align-self:center">
      <span><span class="pill">International</span> contul grupului; sucursala din România nu are unul propriu</span>
      <span>hover pe celulă: de unde vine linkul</span></span>`;
  return {info: '<span class="gri" style="font-size:12px">lista din 28.09.2026, verificată de mână</span>', filtre, banda, corp: `
    <div id="rs-tabel">${tab}</div>
    <p class="note" id="rs-gol" style="display:none">Nicio bancă și niciun cont nu se potrivesc căutării.</p>
    ${despre(`Lista e făcută o dată, pe 28.09.2026, nu de pipeline, și verificată apoi de mână, cont cu cont,
      în browser. Întâi s-au citit linkurile din subsolul
      site-ului fiecărei bănci, prin stiva HTTP a proiectului (robots.txt respectat, User-Agent propriu).
      Unde site-ul ne refuză (403 la Banca Transilvania, CEC, UniCredit, Intesa; robots.txt la Banorient)
      sau nu pune linkul, contul vine din căutare web, fără să ocolim blocarea.<br>
      O rețea care lipsește din tabel („—”) nu a apărut nici pe site, nici în căutare. Conturile cu nume asemănător ale
      altor entități (tbi din Bulgaria, Garanti din Turcia, Intesa din Slovenia) nu intră.<br>
      Datele stau în <span class="mono">date/retele_sociale.csv</span>, nu în bază: un tabel nou ar cere migrarea 019.`)}`};
}

/* 2.4: canalele YouTube ale băncilor (YouTube Data API v3, fișierul output/youtube/youtube_<data>.json).
   Regula politicii YouTube (Developer Policies III.E.2.a): datele API NU se agregă între canalele unor
   proprietari diferiți. De-aia aici nu există niciun total, medie, clasament sau grafic între bănci:
   se alege O bancă și se văd doar cifrele canalului ei, cum le dă YouTube. Băncile stau în ordine
   alfabetică, cu Libra prima, niciodată după cifre; chips-urile n-au numere. Sortarea din tabel
   lucrează doar în interiorul canalului ales. */
const YT = {d: null, m: null, banca: null};
// linkul de pe site există, dar nu se extrage: pagini aduse după blocaj, respectiv canalul grupului
const YT_BLOCATE = ["banca-transilvania", "intesa", "unicredit", "cetelem"];
const YT_GRUP = ["pko", "revolut", "bnpparibas"];
const YT_ETICHETA = `<span class="pill" title="cifre luate din YouTube Data API, nemodificate (YouTube Developer Policies III.E.4.h)">Date YouTube</span>`;
const ytDurata = s => { if(s === null || s === undefined) return "—";
  const h = Math.floor(s / 3600), mi = Math.floor(s % 3600 / 60), se = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(mi).padStart(2, "0")}:${se}` : `${mi}:${se}`; };
const ytNumar = (n, tot) => tot ? `${n} din ${tot} ${tot === 1 ? "videoclip" : "videoclipuri"} ale canalului` : "";
const ytZi = x => cpZi(String(x || "").slice(0, 10));
/* eticheta „nou” (ingest/youtube_api.py): videoclipul nu era în extragerea anterioară (metoda „id-uri”)
   sau, fără fișierul anterior, e publicat după ziua rulării anterioare (metoda „data”). Doar pe canalul ales. */
const ytNouTitlu = (d, metoda) => metoda === "data"
  ? `publicat după ${ytZi(d.nou_fata_de)}, ziua extragerii anterioare (fișierul ei nu mai e, sau canalul lipsea din el: doar după dată)`
  : `nu era în extragerea din ${ytZi(d.nou_fata_de)}`;
const ytOrdine = (d, m) => Object.keys(d.banci)
  .sort((a, b) => (b === "libra") - (a === "libra") || cmScurt(a, m).localeCompare(cmScurt(b, m), "ro"));

/* fișa canalului ales și chips-urile de alegere: se redesenează la schimbarea băncii */
function ytBanda(){
  const {d, m, banca} = YT, c = d.banci[banca].canal;
  const chipuri = ytOrdine(d, m).map(b => `<button class="cm-chip${b === "libra" ? " ref" : ""}${b === banca ? " activ" : ""}"
    data-b="${esc(b)}" title="${esc((m.nume[b] || b) + " — clic: canalul ei")}" onclick="bancaYoutube('${esc(b)}')">${esc(cmScurt(b, m))}</button>`).join("");
  const cifre = [
    [c.abonati_ascunsi ? "ascunși" : num(c.abonati, 0), "abonați", c.abonati_ascunsi
      ? "canalul nu-și arată public numărul de abonați" : "YouTube rotunjește public numărul de abonați"],
    [num(c.vizualizari, 0), "vizualizări, tot canalul", "de la crearea canalului, nu doar ultimele 12 luni"],
    [num(c.videoclipuri, 0), "videoclipuri publice pe canal"],
    [ytZi(c.creat_la), "canal creat la"],
  ];
  const b = d.banci[banca], noi = (b.videoclipuri || []).filter(v => v.nou).length;
  if(d.nou_fata_de) cifre.push([num(noi, 0), `noi față de ${ytZi(d.nou_fata_de)}`,
    `videoclipurile canalului marcate „nou”: ${ytNouTitlu(d, b.metoda_nou)}`]);
  return `<div class="yt-canal">
      <a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer" title="canalul pe YouTube"><b>${esc(c.titlu || banca)}</b> ↗</a>
      <span class="gri mono" style="font-size:11.5px">${esc(c.custom_url || c.id || "")}</span>${YT_ETICHETA}</div>
    <div class="cm-cifre">${cifre.map(([n, t, titlu]) => `<div${titlu ? ` title="${esc(titlu)}"` : ""}><b>${n}</b><span>${t}</span></div>`).join("")}</div>
    ${d.nou_fata_de ? "" : `<div class="yt-nou">prima extragere — eticheta «nou» apare de la următoarea rulare</div>`}
    <div class="cm-chipuri"><span class="cm-et">Canalul băncii · câte unul, fără comparații</span>${chipuri}</div>`;
}

/* tabelul videoclipurilor canalului ales (doar al lui) */
function ytTabel(){
  const {d, m, banca} = YT, b = d.banci[banca], vs = b.videoclipuri || [];
  const dovada = /^https?:/.test(b.dovada || "")
    ? `<a href="${esc(b.dovada)}" target="_blank" rel="noopener noreferrer">o pagină a băncii ↗</a>` : esc(b.dovada || "site-ul băncii");
  const cap = `<p class="note" style="margin:0 0 10px;max-width:none">${etichetaBanca(banca, m)}
    Videoclipurile publicate pe canal din ${ytZi(d.de_la)} până la ${ytZi(d.data_extragerii)}, cu cifrele de la extragere ${YT_ETICHETA}
    · linkul canalului e pe ${dovada}</p>`;
  if(!vs.length) return cap + `<p class="note">Canalul n-a publicat niciun videoclip în ultimele ${d.luni || 12} luni.</p>`;
  return cap + tabel(vs, [
    {cap: "Data", cls: "mono", td: () => ({attr: 'style="white-space:nowrap"'}), s: v => v.publicat_la || "", val: v => ytZi(v.publicat_la)},
    {cap: "Titlu", html: true, s: v => v.titlu || "", val: v => `<a href="${esc(v.link)}" target="_blank" rel="noopener noreferrer"
      title="deschide pe YouTube">${esc(v.titlu || v.id)} ↗</a>${v.nou
      ? `<span class="eticheta-best" title="${esc(ytNouTitlu(d, b.metoda_nou))}">nou</span>` : ""}`},
    {cap: "Durata", cls: "num", s: v => v.durata_sec, val: v => ytDurata(v.durata_sec), titlu: "≤ 1:00 = scurt (Shorts, aproximativ)"},
    {cap: "Vizualizări", cls: "num", s: v => v.vizualizari, val: v => num(v.vizualizari, 0)},
    {cap: "Like-uri", cls: "num", s: v => v.likeuri, val: v => num(v.likeuri, 0), titlu: "lipsește când canalul ascunde like-urile"},
    {cap: "Comentarii", cls: "num", s: v => v.comentarii, val: v => num(v.comentarii, 0), titlu: "lipsește când comentariile sunt închise"},
  ], {sort: true, implicit: [0, "desc"], rand: v => ({
    attr: `data-zi="${esc(String(v.publicat_la || "").slice(0, 10))}" data-sec="${esc(v.durata_sec ?? "")}" data-nou="${v.nou ? 1 : 0}"`,
    cauta: fara_diacritice(v.titlu || "")})});
}

/* filtrele lucrează pe rândurile canalului ales, fără cerere nouă */
function filtreazaYoutube(){
  const v = id => document.getElementById(id);
  if(!v("yt-tabel")) return;
  const t = fara_diacritice(v("yt-cauta").value.trim());
  const zile = Number(v("yt-perioada").value), durata = v("yt-durata").value, doarNoi = v("yt-noi").checked;
  let prag = "";
  if(zile){ const z = new Date(YT.d.data_extragerii + "T00:00:00Z"); z.setUTCDate(z.getUTCDate() - zile); prag = z.toISOString().slice(0, 10); }
  const randuri = document.querySelectorAll("#yt-tabel tbody tr");
  let n = 0;
  randuri.forEach(r => {
    const sec = r.dataset.sec === "" ? NaN : Number(r.dataset.sec);
    const da = (!t || (r.dataset.cauta || "").includes(t)) && (!prag || r.dataset.zi >= prag)
      && (!durata || (durata === "scurt" ? sec <= 60 : sec > 60)) && (!doarNoi || r.dataset.nou === "1");
    r.style.display = da ? "" : "none";
    n += da;
  });
  const tot = (YT.d.banci[YT.banca].videoclipuri || []).length;
  v("yt-n").textContent = ytNumar(n, tot);
  v("yt-gol").style.display = tot && !n ? "" : "none";
}
function bancaYoutube(slug){
  if(!YT.d || !YT.d.banci[slug]) return;
  YT.banca = slug;
  const s = document.getElementById("yt-banca");
  if(s) s.value = slug;
  document.getElementById("yt-banda").innerHTML = ytBanda();
  document.getElementById("yt-tabel").innerHTML = ytTabel();
  filtreazaYoutube();
  // banca rămâne în adresă (link de trimis), fără o nouă randare a paginii
  history.replaceState(null, "", `#/campanii?s=youtube&b=${encodeURIComponent(slug)}`);
}

function canaleYoutube(d, m, stare){
  const ret = d.data_extragerii ? `extras pe ${ytZi(d.data_extragerii)} · se șterge pe ${ytZi(d.sterge_la)} (politica YouTube, 30 de zile)` : "";
  const info = `${YT_ETICHETA}${ret ? `<span class="gri" style="font-size:12px" title="YouTube Developer Policies III.E.4.d: datele din API se șterg sau se reîmprospătează cel târziu la 30 de zile">${esc(ret)}</span>` : ""}`;
  const fara = Object.keys(m.rand).filter(b => !d.banci[b] && !YT_BLOCATE.includes(b) && !YT_GRUP.includes(b))
    .sort((a, b) => cmScurt(a, m).localeCompare(cmScurt(b, m), "ro"));
  const nume = l => l.map(b => esc(cmScurt(b, m))).join(", ");
  const ds = despre(`Sursa: <b>YouTube Data API v3</b>, cu o cheie API (fără cont de utilizator, doar date publice), prin
      <span class="mono">ingest/youtube_api.py</span>. Pe fiecare canal: datele canalului și videoclipurile publicate în ultimele
      ${d.luni || 12} luni, cu vizualizările, like-urile și comentariile de la data extragerii. Pagina citește fișierul local
      <span class="mono">output/youtube/youtube_&lt;data&gt;.json</span>; nu face nicio cerere spre YouTube și nu scrie în bază.<br>
      <b>Canalele</b> vin doar din linkurile de pe site-urile băncilor (paginile din Bronze), nu din căutare pe YouTube:
      lista e în <span class="mono">date/youtube_canale.csv</span>, cu pagina pe care s-a găsit linkul.
      <b>Excluse:</b> ${nume(YT_BLOCATE)}: linkul există, dar dovada vine din pagini aduse după blocajul site-ului, deci nu se
      extrage; ${nume(YT_GRUP)}: canalul e al grupului internațional, nu al băncii din România.
      <b>Fără canal</b> (niciun link pe paginile din Bronze): ${nume(fara) || "—"}.<br>
      <b>Fără agregare</b> (YouTube Developer Policies III.E.2.a): datele din API nu se adună și nu se compară între canalele unor
      proprietari diferiți. De aceea pagina nu arată totaluri, medii, clasamente sau grafice între bănci: alegi o bancă și vezi
      doar canalul ei; băncile stau în ordine alfabetică, nu după cifre.<br>
      <b>Retenția</b> (III.E.4.d): datele se șterg sau se reîmprospătează cel târziu la 30 de zile. Fișierul din
      ${ytZi(d.data_extragerii)} se șterge pe ${ytZi(d.sterge_la)}; din ziua aceea serverul nu-l mai servește, chiar dacă e încă pe disc.<br>
      <b>„Date YouTube”</b> (III.E.4.h): tot ce vine din API e marcat ca atare și arătat așa cum îl dă YouTube (abonații sunt
      rotunjiți chiar de YouTube; „ascunși” = canalul nu-i arată). „Scurte ≤ 60 s” e o aproximare după durată: API-ul nu spune
      ce e Short.<br>
      <b>„Nou”</b>: la fiecare rulare, videoclipul care nu era în extragerea anterioară (cel mai recent fișier dinaintea zilei,
      încă în cele 30 de zile). Dacă fișierul acela nu mai există, „nou” = publicat după ziua rulării anterioare, păstrată
      local în <span class="mono">output/youtube/extrageri.txt</span> (doar data, nimic de la YouTube). ${d.nou_fata_de
        ? `Acum: față de ${ytZi(d.nou_fata_de)}.` : "Fișierul de acum e prima extragere, deci nimic nu e încă „nou”."}`);
  const nb = Object.keys(d.banci).length;
  if(!nb) return {info, corp: `<div class="callout warn" style="margin-bottom:12px"><b>Nu se arată date YouTube.</b>
    ${esc(d.motiv || "niciun canal în fișier")}.</div>${ds}`};
  YT.d = d; YT.m = m;
  const ordine = ytOrdine(d, m);
  YT.banca = d.banci[stare.b] ? stare.b : ordine[0];
  const tot = (d.banci[YT.banca].videoclipuri || []).length;
  const filtre = `
    <label class="f">Bancă<select id="yt-banca" onchange="bancaYoutube(this.value)">${
      ordine.map(b => `<option value="${esc(b)}"${b === YT.banca ? " selected" : ""}>${esc(m.nume[b] || b)}</option>`).join("")}</select></label>
    <label class="f">Caută<input class="cauta" id="yt-cauta" type="search" placeholder="Caută în titlu…" oninput="filtreazaYoutube()"></label>
    <label class="f">Perioada<select id="yt-perioada" onchange="filtreazaYoutube()">
      <option value="30">ultimele 30 de zile</option><option value="90">ultimele 90 de zile</option>
      <option value="" selected>ultimele ${d.luni || 12} luni</option></select></label>
    <label class="f">Durata<select id="yt-durata" onchange="filtreazaYoutube()">
      <option value="">toate</option><option value="scurt">scurte (Shorts, ≤ 60 s)</option><option value="lung">lungi (&gt; 60 s)</option></select></label>
    <label class="bifa" title="${esc(d.nou_fata_de ? `doar videoclipurile marcate „nou” față de extragerea din ${ytZi(d.nou_fata_de)}`

    <span class="gri" id="yt-n" style="font-size:12px;margin-left:auto;align-self:center">${ytNumar(tot, tot)}</span>`;
  return {info, filtre, banda: `<div class="cm-banda" id="yt-banda">${ytBanda()}</div>`, corp: `
    <div id="yt-tabel">${ytTabel()}</div>
    <p class="note" id="yt-gol" style="display:none">Niciun videoclip al canalului nu se potrivește filtrelor.</p>
    ${ds}`};
}

/* 2.4: toate sursele posibile și ce cere fiecare: pliat la coada fiecărei secțiuni */
function cmSurse(camp, com, yt){
  const zi = x => cpZi(String(x || "").slice(0, 10));
  const nCamp = camp.randuri.length, nBanciCamp = new Set(camp.randuri.map(r => r.banca)).size;
  const nBanciCom = new Set(com.map(r => r.banca)).size;
  return `<details class="despre"><summary>Toate sursele pentru campanii și reclame, și ce cere fiecare</summary>
    <p class="note" style="margin:0 0 8px">Campaniile de pe site-uri și comunicatele sunt colectate. Conturile sociale sunt
      punctul de plecare pentru reclame. Conform secțiunii 1 din arhitectură, reclamele se iau doar prin API-uri oficiale, nu cu scraper propriu.</p>

R.campanii = async (stare) => {
  const s = CM_SECTIUNI.some(([k]) => k === stare.s) ? stare.s : "site";
  GG.nr++; Object.assign(GG, {ordine: "ultima", sens: "desc", offset: 0});
  CP.comOffset = 0;
  const [m, rs, bing, google, camp, com, yt] = await Promise.all([meta(), cmia("/api/retele"), cmia("/api/reclame_bing"),
    cmia("/api/reclame_google"), cmia("/api/campanii"), cmia("/api/comunicate"),
    // un server pornit înainte de ruta nouă răspunde 404: secțiunea spune asta, restul paginii merge
    cmia("/api/youtube").catch(() => ({banci: {}, motiv: "serverul nu are încă ruta /api/youtube (trebuie repornit)"}))]);
  CP.date = camp; CP.com = com;
  // câte are fiecare secțiune, pe comutator

    site: camp.randuri.filter(r => r.in_comparatie && r.stare === "activa").length,

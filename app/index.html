<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Intelligence Platform · Libra Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#eef1f4; --surface:#fff; --ink:#1b2430; --muted:#5b6b7a; --line:#c7d0d9;
    --warn:#a8720f; --warn-tint:#faedd2; --ok:#2f7a4f; --ok-tint:#dcf0e3;
    --accent:#1d6f6f; --accent-tint:#dcefee;
    /* bara laterală: bleumarin Libra, cu accentul roșu al mărcii */
    --nav:#111e33; --nav-ink:#c3cedd; --nav-slab:#7b8ca3; --nav-line:#27364f;
    --marca:#e23b45;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#12161c; --surface:#1a2029; --ink:#e8ecf0; --muted:#9aa7b4; --line:#2c3540;
          --warn:#e0ac52; --warn-tint:#3a2e15; --ok:#6fcf97; --ok-tint:#1c3323;
          --accent:#59c2c2; --accent-tint:#1c3535;}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:flex}

  /* ---- navigație ---- */
  /* ---- bara laterală ----
     Bleumarin închis cu accent roșu, ca identitatea Libra. Antetul e un titlu
     serif cu un cuvânt în roșu italic, apoi subtitlul în capitale spațiate —
     nu mai e o listă de pagini pe fundal alb cu o bordură. */
  nav{width:262px;flex:none;background:var(--nav);color:var(--nav-ink);
      padding:0 0 18px;overflow:auto;height:100%}
  nav .marca{padding:20px 20px 17px;border-bottom:1px solid var(--nav-line);margin-bottom:6px}
  nav .marca .t{font-family:"Source Serif 4",Georgia,serif;font-size:22px;line-height:1.15;
                font-weight:600;color:#fff;display:block;letter-spacing:-.01em}
  nav .marca .t i{color:var(--marca);font-style:italic}
  nav .marca .s{display:block;margin-top:8px;font-family:"IBM Plex Mono",monospace;
                font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
                color:var(--nav-slab)}
  nav h3{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
         letter-spacing:.1em;color:var(--nav-slab);font-weight:500;margin:17px 0 5px;
         padding:0 20px}
  nav a{display:flex;align-items:center;gap:8px;padding:8px 20px;color:var(--nav-ink);
        text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
  nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  nav a.activ{border-left-color:var(--marca);background:rgba(255,255,255,.09);
              color:#fff;font-weight:600}
  nav a .pdf{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;
             color:var(--nav-slab)}
  nav a.activ .pdf{color:var(--marca)}
  nav a .gol{margin-left:auto;font-size:10px;color:#e0a44a;font-family:"IBM Plex Mono",monospace}
  nav .picior{margin:18px 20px 0;padding-top:14px;border-top:1px solid var(--nav-line);
              font-family:"IBM Plex Mono",monospace;font-size:9.5px;line-height:1.7;
              color:var(--nav-slab)}

  /* ---- conținut ---- */
  main{flex:1;min-width:0;overflow:auto;height:100%;padding:26px 30px 60px}
  .cap{margin-bottom:20px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-size:26px;margin:0 0 5px}
  .lede{color:var(--muted);font-size:13.5px;max-width:78ch;margin:0}
  section{background:var(--surface);border:1px solid var(--line);border-radius:13px;
          padding:18px 20px;margin-bottom:18px}
  h2{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:0 0 12px}
  h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
     font-family:"IBM Plex Mono",monospace;font-weight:500;margin:18px 0 8px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;
     letter-spacing:.03em;color:var(--muted);font-weight:500;position:sticky;top:0;
     background:var(--surface);z-index:1}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;
                font-family:"IBM Plex Mono",monospace}
  .mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
  .wrap{overflow:auto;max-height:70vh}

  .filtre{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
  select,input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);
               border-radius:7px;background:var(--bg);color:var(--ink);min-width:140px}
  button{font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;
         border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  button.primar{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
  .tile{border:1px solid var(--line);border-radius:10px;padding:13px}
  .tile .n{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500}
  .tile .l{color:var(--muted);font-size:11.5px;margin-top:2px}

  /* celulă de comparație: valoarea, la ce se aplică, câte variante mai sunt */
  .celula{cursor:pointer;border-radius:6px;display:block;padding:4px 6px;text-align:right;
          position:relative;min-width:104px}
  .celula:hover{background:var(--accent-tint);outline:1px solid var(--accent)}
  .celula.gol{color:var(--muted);cursor:default;text-align:center}
  .celula.gol:hover{background:none;outline:none}
  .v-pref{display:block;color:var(--muted);font-size:9.5px;line-height:1.2}
  .v-gratis{color:var(--ok);opacity:.85}
  .v-num{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500;white-space:nowrap}
  .v-ctx{display:block;color:var(--muted);font-size:10px;line-height:1.3;margin-top:1px;
         font-weight:400;max-width:15ch;margin-left:auto;overflow-wrap:anywhere}
  .v-n{position:absolute;left:5px;top:4px;color:var(--muted);font-size:9.5px;
       font-family:"IBM Plex Mono",monospace;border:1px solid var(--line);
       border-radius:999px;padding:0 4px;line-height:1.45}
  .best{background:var(--ok-tint)}
  .best .v-num{font-weight:600;color:var(--ok)}
  .cap-nume{display:block;font-size:12px}
  .cap-desc{display:block;font-weight:400;font-size:10px;color:var(--muted);
            line-height:1.35;margin-top:2px;max-width:17ch;white-space:normal}
  .cap-slug{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;
            color:var(--muted);opacity:.65;margin-top:3px;font-weight:400}

  /* ---- Versus: carduri fixe sus, apoi caracteristici grupate ---- */
  .vs{overflow-x:auto}
  .vs-bara{display:grid;grid-template-columns:var(--vsc);
           background:var(--bg);border-bottom:1px solid var(--line);align-items:stretch}
  .vs-cap0{padding:12px 10px;display:flex;align-items:flex-end;font-size:11.5px;
           color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
  .vs-card{border-left:1px solid var(--line);padding:12px 11px 11px;position:relative;
           display:flex;flex-direction:column;gap:2px}
  .vs-card.ref{background:var(--accent-tint)}
  .vs-tag{position:absolute;right:9px;top:9px;font-size:9px;text-transform:uppercase;
          letter-spacing:.04em;color:var(--accent);border:1px solid var(--accent);
          border-radius:999px;padding:1px 6px}
  .vs-logo{height:30px;display:flex;align-items:center;margin-bottom:5px}
  .vs-logo img{max-height:30px;max-width:104px;object-fit:contain}
  .vs-init{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;
           color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
  .vs-nume{font-size:13.5px;font-weight:600;line-height:1.25}
  .vs-slug{font-size:10px;color:var(--muted)}
  .vs-cifre{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .vs-cifre b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;display:block}
  .vs-cifre span{display:block;font-size:9.5px;color:var(--muted);line-height:1.3}

  .vs-sec{margin-top:16px}
  .vs-sec-cap{display:grid;grid-template-columns:var(--vsc);align-items:end;
              background:var(--surface);border-radius:8px 8px 0 0;border:1px solid var(--line);
              border-bottom:none}
  .vs-sec-cap .t{font-family:"Source Serif 4",Georgia,serif;font-size:15px;padding:9px 10px}
  .vs-sec-cap .t span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
                      color:var(--muted);margin-top:2px}
  .vs-sec-cap .c{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
                 padding:9px 8px;text-align:right;border-left:1px solid var(--line)}
  .vs-sec-cap .c.ref{color:var(--accent);font-weight:600}
  .vs-rand{display:grid;grid-template-columns:var(--vsc);border:1px solid var(--line);
           border-top:none;align-items:center}
  .vs-rand.alt{background:var(--surface)}
  .vs-rand:last-child{border-radius:0 0 8px 8px}
  .vs-lab{padding:9px 10px;min-width:0}
  .vs-lab b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
  .vs-lab span{display:block;font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:2px}
  .vs-lab em{display:block;font-size:9.5px;color:var(--warn);font-style:normal;margin-top:3px}
  .vs-cel{padding:7px 8px;border-left:1px solid var(--line);text-align:right;min-width:0}
  .vs-cel .celula{min-width:0;padding:2px 3px}
  .vs-cel.gol{color:var(--muted);text-align:center;font-size:12px}
  .vs-cel.best{background:var(--ok-tint)}
  .vs-bun{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.04em;
          color:var(--ok);margin-top:2px}
  @media (max-width:760px){ .vs-cifre{display:none} }
  /* revamp: secțiuni pliabile, capul secțiunii fix la derulare, fără derulare orizontală */
  .vs{overflow:visible}
  details.vs-sec > summary{list-style:none;cursor:pointer;position:sticky;top:var(--sub-bara,40px);z-index:4}
  details.vs-sec > summary::-webkit-details-marker{display:none}
  details.vs-sec > summary .t::before{content:"▾ ";color:var(--muted);font-size:11px}
  details.vs-sec:not([open]) > summary .t::before{content:"▸ "}
  details.vs-sec:not([open]) > summary .vs-sec-cap{border-bottom:1px solid var(--line);border-radius:8px}
  .vs-cel.pierde{background:var(--warn-tint)}
  .vs-alege{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative}
  details.vs-lista > summary{list-style:none}
  details.vs-lista > summary::-webkit-details-marker{display:none}
  summary.buton{display:inline-block;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;
                border:1px solid var(--line);background:var(--surface)}
  .vs-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;background:var(--surface);
          border:1px solid var(--line);border-radius:11px;padding:12px;width:340px;
          box-shadow:0 8px 28px rgba(16,24,32,.18)}
  .vs-opt{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}

  .cl-banca{display:flex;align-items:center;gap:8px;min-width:0}
  .cl-banca img{max-height:18px;max-width:54px;object-fit:contain;flex:none}
  .cl-banca .nm{font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;hyphens:auto}
  /* 2.3 Aplicații: multe coloane fac numele băncii să se rupă pe 2-3 rânduri */
  .apl-tabel table.t td:first-child .cl-banca{min-width:190px}

  /* Avertisment care nu se poate sări cu privirea. Folosit acolo unde o cifră
     corect calculată poate fi înțeleasă greșit — media textelor de review, de
     exemplu, care e cu 2,6 stele sub media reală a aplicației. */
  .callout{border:1px solid var(--ok);border-left-width:4px;border-radius:9px;
           padding:11px 14px;font-size:12.5px;line-height:1.6;background:var(--ok-tint)}
  .callout.warn{border-color:var(--warn);background:var(--warn-tint)}
  .callout b{color:var(--ink)}

  /* ---- Sentiment: review-uri filtrabile ---- */
  .rec{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
  .rec-cap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .rec-stele{font-size:13px;letter-spacing:1px}
  .rec-stele.bun{color:var(--ok)} .rec-stele.rau{color:var(--warn)}
  .rec-txt{font-size:12.5px;line-height:1.6}
  .rec-cap .nm, table.t .pill{white-space:nowrap}
  .rec-meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}

  .sus{color:var(--warn);font-weight:600}
  .jos{color:var(--ok);font-weight:600}

  /* sertar: valorile grupate pe serviciul dat de bancă */
  .grup-serv{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
  .grup-serv > .cap{background:var(--surface-2,var(--surface));padding:8px 11px;
                    border-bottom:1px solid var(--line);display:flex;gap:8px;
                    align-items:baseline;justify-content:space-between}
  .grup-serv > .cap b{font-size:12.5px;font-weight:600}
  .obs{display:flex;gap:10px;align-items:baseline;padding:8px 11px;font-size:12px;
       border-top:1px solid var(--line)}
  .obs:first-of-type{border-top:none}
  .obs .val{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
            min-width:88px;text-align:right;flex:none}
  .obs .det{flex:1;min-width:0}
  .obs .cit{color:var(--muted);font-size:11px;line-height:1.5;margin-top:3px;
            border-left:2px solid var(--line);padding-left:7px}
  .obs .cit mark{background:var(--warn-tint);color:var(--ink);font-weight:600;
                 padding:0 2px;border-radius:2px}
  /* Când citatul nu adaugă nimic peste cifră, se arată unde e în document,
     nu se repetă cifra sub ea ca și cum ar fi o dovadă. */
  .obs .cit.fara{border-left-style:dotted;font-style:italic;opacity:.9}
  .obs .val .x{font-family:"IBM Plex Mono",monospace;font-size:10px;
               color:var(--muted);margin-left:4px;font-weight:400}
  /* Ce trebuie să facă omul cu rândul — scris lângă rând, nu într-un tooltip */
  .obs .ce-faci{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px;
                font-style:italic}
  /* Seria de valori a aceluiași serviciu: cele din coadă marcate */
  .serie{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 11px;
         background:var(--bg);border-bottom:1px solid var(--line);font-size:11px}
  .serie .et{color:var(--muted)}
  .serie .v{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 6px;
            border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .serie .v.aici{border-color:var(--warn);background:var(--warn-tint);
                 color:var(--warn);font-weight:600}
  .obs .meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .obs.amb{background:var(--warn-tint)}
  a.sursa{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent);
          text-decoration:none;border-bottom:1px dotted var(--accent)}
  a.sursa:hover{background:var(--accent-tint)}
  /* Pagina băncii nu e documentul: culoare diferită și linie punctată mai
     slabă, ca să nu fie citită ca dovadă directă. */
  a.sursa.pagina{color:var(--muted);border-bottom-style:dashed;border-bottom-color:var(--line)}
  a.sursa.pagina:hover{color:var(--accent);background:var(--accent-tint)}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;
        font-family:"IBM Plex Mono",monospace;border:1px solid var(--line)}
  .pill.amb{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
  .pill.ok{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
  .pill.mock{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
  .note{color:var(--muted);font-size:12px;line-height:1.55;max-width:80ch}
  .gol-stare{border:1px dashed var(--line);border-radius:11px;padding:22px;text-align:center;
             color:var(--muted);font-size:13px}
  .gol-stare b{color:var(--ink);display:block;margin-bottom:5px;font-size:14px}

  /* sertar cu dovezile din spatele unei celule */
  #sertar{position:fixed;inset:0;background:rgba(10,14,18,.45);display:none;z-index:50}
  #sertar.deschis{display:block}
  #sertar .panou{position:absolute;right:0;top:0;bottom:0;width:min(640px,94vw);
                 background:var(--surface);border-left:1px solid var(--line);
                 padding:20px 22px;overflow:auto}
  #sertar h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:0 0 3px}
  #sertar .x{position:absolute;right:16px;top:14px}

  /* ================= revamp 25.09: tipare comune =================
     Aceeași rețetă pe fiecare pagină: rezumat sus, filtre fixe, un tabel
     compact (sortabil, Libra fixată), detaliile pliate. */

  /* bara de filtre rămâne sus la derulare (derulează <main>, nu documentul) */
  .bara-fixa{position:sticky;top:-26px;z-index:8;background:var(--bg);
             margin:-6px -30px 14px;padding:12px 30px 10px;border-bottom:1px solid var(--line)}
  .bara-fixa .filtre{margin:0}
  .taburi{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
          background:var(--surface)}
  .taburi button{border:0;border-radius:0;border-right:1px solid var(--line);background:none;
                 padding:7px 13px;font-size:12.5px}
  .taburi button:last-child{border-right:0}
  .taburi button.activ{background:var(--accent);color:#fff;font-weight:600}
  .taburi button .n{font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.75;margin-left:4px}
  input.cauta{min-width:230px;background:var(--surface)}
  label.bifa{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);cursor:pointer}
  label.bifa input{min-width:0;margin:0}

  /* „Despre date": explicațiile lungi, pliate implicit */
  details.despre{margin-top:10px;font-size:12px}
  details.despre > summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none;
                           display:inline-flex;align-items:center;gap:5px;user-select:none}
  details.despre > summary::-webkit-details-marker{display:none}
  details.despre > summary::before{content:"ⓘ";font-size:13px}
  details.despre[open] > summary{margin-bottom:6px}
  details.despre .note{margin:0 0 6px}

  /* secțiune pliabilă (Rulări, detalii tehnice, grupe) */
  details.pliat > summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px}
  details.pliat > summary::-webkit-details-marker{display:none}
  details.pliat > summary::before{content:"▸";color:var(--muted);font-size:12px;width:10px}
  details.pliat[open] > summary::before{content:"▾"}
  details.pliat > summary h2{margin:0}

  /* tabel sortabil; rândul Libra fixat și evidențiat */
  table.t th.sort{cursor:pointer;user-select:none}
  table.t th.sort:hover{color:var(--ink)}
  table.t th.sort::after{content:" ↕";opacity:.35}
  table.t th.sort.asc::after{content:" ↑";opacity:1;color:var(--accent)}
  table.t th.sort.desc::after{content:" ↓";opacity:1;color:var(--accent)}
  table.t tbody tr:hover td{background:var(--accent-tint)}
  table.t tr.libra td{background:var(--accent-tint)}
  table.t tr.libra td:first-child{box-shadow:inset 4px 0 var(--accent)}
  table.t tr.clic{cursor:pointer}
  table.t tr.ales td{background:var(--warn-tint)}
  .wrap.lung{max-height:none;overflow:visible}
  .tag-libra{font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;
             letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);
             border-radius:999px;padding:0 5px;margin-left:6px;vertical-align:middle}
  .sub{display:block;color:var(--muted);font-size:10.5px;line-height:1.35;font-weight:400}
  .gri{color:var(--muted)}
  a.fisa{color:inherit;text-decoration:none}
  a.fisa:hover .nm{text-decoration:underline}

  /* matrice bancă × serviciu: celula = câte prețuri, intervalul, gratuite */
  td.mc{cursor:pointer;text-align:right;white-space:nowrap}

<script>

const ia = async u => { const r = await fetch(u); const d = await r.json();

/* ---------------- helpers ---------------- */
/* Tabelul comun. Opțiuni:
     sort: true          antet clicabil = sortare (coloana are `s: r => valoare`)
     libra: r => slug    rândul Libra se evidențiază și rămâne primul la sortare
     rand: r => {cls, clic}  clasă și acțiune pe rând
     lung: true          fără derulare internă (tabelul își ia înălțimea)
     implicit: [i, "desc"]  sortarea de la încărcare */
function tabel(randuri, coloane, opt = {}){
  if(!randuri || !randuri.length) return '<p class="note">Nimic de afișat.</p>';
  const th = coloane.map((c, i) => {
    const sortabil = opt.sort && c.s;
    const cls = [c.cls || "", sortabil ? "sort" : "",
                 opt.implicit && opt.implicit[0] === i ? opt.implicit[1] : ""].join(" ");
    return `<th class="${cls}"${c.titlu ? ` title="${esc(c.titlu)}"` : ""}`
      + (sortabil ? ` onclick="sorteaza(this)"` : "") + `>` + (c.capHtml || esc(c.cap)) + "</th>";
  }).join("");
  let lista = randuri.slice();
  if(opt.implicit && coloane[opt.implicit[0]] && coloane[opt.implicit[0]].s){
    const c = coloane[opt.implicit[0]], sens = opt.implicit[1] === "asc" ? 1 : -1;
    lista.sort((a, b) => compara(c.s(a), c.s(b)) * sens);
  }
  if(opt.libra) lista.sort((a, b) => (opt.libra(b) === "libra") - (opt.libra(a) === "libra"));
  const tr = lista.map(r => {
    const e = opt.rand ? (opt.rand(r) || {}) : {};
    const libra = opt.libra && opt.libra(r) === "libra";
    const cls = [libra ? "libra fix" : "", e.cls || "", e.clic ? "clic" : ""].join(" ").trim();
    return `<tr${cls ? ` class="${cls}"` : ""}${e.clic ? ` onclick="${e.clic}"` : ""}`
      + (e.cauta !== undefined ? ` data-cauta="${esc(String(e.cauta).toLowerCase())}"` : "") + ">"
      + coloane.map(c => {
        const v = c.val ? c.val(r) : r[c.k];
        const s = c.s ? c.s(r) : null;
        const ds = s === null || s === undefined || (typeof s === "number" && isNaN(s)) ? "" : ` data-s="${esc(s)}"`;
        const x = c.td ? (c.td(r) || {}) : {};      // clasă și atribute pe celulă (clic, titlu)
        return `<td class="${[c.cls || "", x.cls || ""].join(" ").trim()}"${ds}${x.attr ? " " + x.attr : ""}>`
          + `${c.html ? (v ?? "") : esc(v ?? "—")}</td>`;
      }).join("") + "</tr>";
  }).join("");
  return `<div class="wrap${opt.lung ? " lung" : ""}"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}

/* numerele ca numere, textul alfabetic în română; golurile la coadă */
function compara(a, b){
  const gol = x => x === null || x === undefined || x === "";
  if(gol(a) && gol(b)) return 0;
  if(gol(a)) return 1;
  if(gol(b)) return -1;
  const na = Number(a), nb = Number(b);
  if(!isNaN(na) && !isNaN(nb)) return na - nb;
  return String(a).localeCompare(String(b), "ro");
}

/* Sortare la clic pe antet: primul clic descrescător (cifrele mari sus),
   al doilea crescător. Rândul Libra rămâne primul. Golurile rămân jos. */
function sorteaza(th){
  const tabelEl = th.closest("table"), i = [...th.parentNode.children].indexOf(th);
  const sens = th.classList.contains("desc") ? "asc" : "desc";
  tabelEl.querySelectorAll("th").forEach(x => x.classList.remove("asc", "desc"));
  th.classList.add(sens);
  const tb = tabelEl.tBodies[0];
  const rows = [...tb.rows];
  const val = r => { const c = r.cells[i]; return c && c.dataset.s !== undefined ? c.dataset.s : ""; };
  rows.sort((a, b) => {
    const fa = a.classList.contains("fix"), fb = b.classList.contains("fix");
    if(fa !== fb) return fa ? -1 : 1;
    const va = val(a), vb = val(b);
    if(va === "" || vb === "") return compara(va, vb);
    return compara(va, vb) * (sens === "asc" ? 1 : -1);
  });
  rows.forEach(r => tb.appendChild(r));
}

/* căutare pe rândurile unui tabel, fără cerere nouă */
function cautaInTabel(inp, id){

}

function bareStele(dist, latime = 140){

  return `<span class="stele-bar" style="width:${latime}px" title="${esc(titlu)}">${d.map((x, i) =>
    `<span style="width:${100 * x / tot}%;background:${culori[i]}"></span>`).join("")}</span>`;
}

/* paginare: butoane de pagină care schimbă doar `offset` din starea paginii */
function paginare(total, offset, limit, pagina, stare){
  const n = Math.ceil(total / limit);
  if(n <= 1) return "";
  const cur = Math.floor(offset / limit);
  const mergiLa = k => `mergi('${pagina}',${esc(JSON.stringify({...stare, offset: String(k * limit)}))})`;
  const idx = [...new Set([0, cur - 2, cur - 1, cur, cur + 1, cur + 2, n - 1])].filter(k => k >= 0 && k < n).sort((a, b) => a - b);
  let prev = -1, html = "";
  for(const k of idx){
    if(k - prev > 1) html += "<span>…</span>";
    html += `<button class="${k === cur ? "activ" : ""}" onclick="${mergiLa(k)}">${k + 1}</button>`;
    prev = k;
  }
  return `<div class="pagini"><span>${num(offset + 1, 0)}–${num(Math.min(offset + limit, total), 0)} din ${num(total, 0)}</span>
    ${cur > 0 ? `<button onclick="${mergiLa(cur - 1)}">‹ înapoi</button>` : ""}${html}
    ${cur < n - 1 ? `<button onclick="${mergiLa(cur + 1)}">înainte ›</button>` : ""}</div>`;
}

/* vârsta unei date: verde sub 7 zile, fără culoare până la 30, portocaliu peste */
function varsta(t){
  if(!t) return '<span class="pill">fără dată</span>';
  const z = Math.floor((Date.now() - new Date(t)) / 86400000);
  if(z <= 0) return '<span class="pill ok">azi</span>';
  const txt = `acum ${z} ${z === 1 ? "zi" : "zile"}`;
  return z < 7 ? `<span class="pill ok">${txt}</span>` : z > 30 ? `<span class="pill amb">${txt}</span>` : `<span class="pill">${txt}</span>`;
}

const etNume = c => (ETICHETE[c] || [String(c).replace(/_/g, " ")])[0];
const etDesc = c => (ETICHETE[c] || [null, ""])[1] || "";

function unitTxt(u){ return UNITATE_TXT[u] !== undefined ? UNITATE_TXT[u] : (u ? " " + u : ""); }

/* Frecvențele din date sunt text liber în română („lunar", „pe operațiune",
   dar și termene de depozit: „5 ani"). Nu le traducem într-un „/lună" care ar
   putea minți la termene — le arătăm cum sunt, după separator. */
function contextScurt(c, maxLen = 26){
  const p = [];
  if(c.frecventa) p.push(c.frecventa);
  if(c.serviciu){
    const s = c.serviciu.length > maxLen ? c.serviciu.slice(0, maxLen - 1) + "…" : c.serviciu;
    p.push(s);
  }
  if(c.conditie) p.push(c.conditie.length > maxLen ? c.conditie.slice(0, maxLen - 1) + "…" : c.conditie);
  return p.join(" · ");
}

/* Cifra afișată e mediana valorilor din bancă, nu minimul: la minim, 80% din
   celule arătau „0 lei", fiindcă fiecare bancă are cel puțin o variantă
   gratuită. Mediana e cât costă de obicei și se poate compara. */
function valoareCelula(c, sens, unitate){
  if(!c) return null;
  const v = c.valoare !== undefined && c.valoare !== null
    ? c.valoare : (sens === "mare_bun" ? c.maxim : c.minim);
  const multe = c.n > 1 && c.minim !== c.maxim;
  const ctx = contextScurt(c);
  const extr = sens === "mare_bun"
    ? `cea mai mare: ${num(c.maxim)}${unitTxt(unitate || c.unitate)}`
    : `cea mai mică: ${num(c.minim)}${unitTxt(unitate || c.unitate)}`;
  return (multe ? `<span class="v-pref">de obicei</span>` : "")
       + `<span class="v-num">${num(v)}${unitTxt(unitate || c.unitate)}</span>`
       + (ctx ? `<span class="v-ctx">${esc(ctx)}</span>` : "")
       + (c.gratuite ? `<span class="v-ctx v-gratis">${c.gratuite} ${c.gratuite === 1 ? "variantă gratuită" : "variante gratuite"}</span>` : "")
       + (c.n > 1 ? `<span class="v-n" title="${c.n} valori sub această etichetă; afișată e mediana. ${extr}">+${c.n - 1}</span>` : "");
}

/* ---------------- sertar cu dovezi ----------------
   Grupat pe `serviciu` — numele dat de bancă, nu conceptul canonic. Un tabel
   plat de 40 de rânduri nu răspundea la „7,5 lei pentru ce?"; grupat pe
   serviciu, se vede că aceeași etichetă acoperă mai multe prețuri (pachete,
   praguri, monede) și care e care. */
/* Citatul cu cifra evidențiată în el.
   Evidențierea în PDF depinde de vizualizator (vezi `linkSursa`), deci dovada
   trebuie să fie lizibilă AICI, fără să deschizi documentul. Se marchează
   exact numărul observației, nu o potrivire aproximativă: dacă nu se
   regăsește în citat, citatul rămâne neatins. */
function citatEvidentiat(r){
  const t = r.citat.length > 260 ? r.citat.slice(0, 259) + "…" : r.citat;
  // sertarul trimite `valoare`, coada de verificare trimite `valoare_num`
  const bruta = r.valoare !== undefined && r.valoare !== null ? r.valoare : r.valoare_num;
  if(bruta === null || bruta === undefined) return esc(t);
  // se caută atât „20" cât și „20,00" / „20.00", fără să se lege de zecimale
  const v = Number(bruta);
  const forme = [...new Set([String(v), v.toFixed(2), v.toFixed(2).replace(".", ",")])];
  for(const f of forme){
    const i = t.indexOf(f);
    // marginile trebuie să nu fie cifre, ca „20" să nu se marcheze în „2024"
    if(i < 0) continue;
    const inainte = i > 0 ? t[i-1] : " ", dupa = t[i+f.length] || " ";
    if(/[0-9]/.test(inainte) || /[0-9.,]/.test(dupa)) continue;
    return esc(t.slice(0, i)) + "<mark>" + esc(f) + "</mark>" + esc(t.slice(i + f.length));
  }
  return esc(t);
}

/* Citatul merită arătat doar dacă spune ceva în plus față de cifră.
   Măsurat: la 2.378 de rânduri din PDF, `citat` e literalmente valoarea
   („0 lei"), deci sub cifră apărea aceeași cifră, ca și cum ar fi o dovadă.
   Nu e. Acolo se arată secțiunea din document, care chiar localizează. */
function citatUtil(r){
  const c = (r.citat || "").trim();
  if(!c) return null;
  const doarCifra = /^[0-9][0-9.,\s]*(lei|euro|eur|usd|ron|%)?$/i.test(c);
  return doarCifra ? null : c;
}

/* Trei nivele de dovadă, arătate diferit — fiindcă nu sunt același lucru și nu
   trebuie să pară:

     ↗ document   linkul duce la cifra însăși (PDF-ul exact sau pagina web)
     ⌂ pagină     pagina de pe care banca publică documentul. Afirmația „se
                  publică aici" e verificabilă, dar NU e documentul
     (fără link)  rămâne numele fișierului și pagina din PDF

   De ce nu toate au link direct: pachetul sursă reține calea locală a PDF-ului,
   nu URL-ul de descărcare, iar PDF-urile nu sunt incluse. Din 40 de URL-uri de
   PDF descoperite, 9 s-au potrivit exact. Un link greșit ar trimite la alt
   document decât cifra, adică opusul unei dovezi. */
function linkSursa(r){
  const pg = r.pagina ? ` p.${r.pagina}` : "";
  const scurta = s => { const t = String(s || "").replace(/^https?:\/\/(www\.)?/, "");
                        return t.length > 44 ? t.slice(0, 43) + "…" : t; };
  if(r.link){
    /* La PDF se deschide vizualizatorul PROPRIU, nu fișierul brut.
       Motivul e măsurat, nu preferință: parametrii de deschidere ai Adobe
       (`#page=`, `search=`) sunt implementați de plugin-ul clasic Acrobat, care
       nu mai există în Chrome. Extensia Adobe pentru Chrome încarcă PDF-ul în
       pagina ei și pierde fragmentul, deci nu sare nici la pagină. Chrome cu
       vizualizatorul propriu sare la pagină dar ignoră `search=`. Singurul mod
       în care ruta la locul exact merge la toată lumea e să randăm noi
       documentul. Originalul rămâne la un clic, în capul vizualizatorului.

       La paginile web nu e nevoie: `#:~:text=` (Text Fragments) e suportat de
       Chrome, Edge, Safari 16.1+ și Firefox 131+. */
    if(r.tip_sursa === "document"){
      const u = `/pdf.html?u=${encodeURIComponent(r.link)}`
              + `&p=${r.pagina || 1}&q=${encodeURIComponent(r.citat || "")}`;
      return `<a class="sursa" href="${esc(u)}" target="_blank" rel="noopener"
                title="Deschide documentul la pagina ${r.pagina || 1}, cu citatul evidențiat. Randat de aplicație, deci merge indiferent ce cititor de PDF ai instalat."
                >↗ ${esc(scurta(r.fisier || r.sursa))}${pg} ⤷</a>`;
    }
    return `<a class="sursa" href="${esc(r.link)}${esc(r.ancora || "")}" target="_blank" rel="noopener"
              title="Deschide pagina la fraza exactă și o evidențiază — ${esc(r.link)}"
              >↗ ${esc(scurta(r.sursa))}${r.ancora ? " ⤷" : ""}</a>`;
  }
  const fisier = `<span class="pill" title="Numele documentului din care vine cifra. URL-ul de descărcare nu e înregistrat în pachetul sursă, iar PDF-ul nu e inclus — fișierul și pagina rămân verificabile manual.">${esc(scurta(r.fisier || r.sursa))}${pg}</span>`;
  if(r.link_pagina){
    return fisier + ` <a class="sursa pagina" href="${esc(r.link_pagina)}" target="_blank" rel="noopener"
      title="NU e documentul exact. E pagina de pe care banca publică lista de tarife — de aici se poate descărca versiunea curentă. Aleasă automat: ${esc(r.pagina_documente_motiv || "")}"
      >⌂ pagina băncii</a>`;
  }
  return fisier;
}

/* `scenariu` = categoria (depozite / credite / conturi_carduri). Obligatoriu la
   dobânzi: `nominala` e și dobândă de depozit și dobândă de credit, iar fără
   filtru sertarul deschis din celula de depozit ar arăta și credite. */
/* ---------------- sertarul, refăcut pe 25.09 ----------------
   Era câte un card mare pe fiecare valoare, toate deschise: BCR · Administrare
   cont = 316 valori în 38 de grupe, ~31.000 px de derulat. Acum:
     - rezumat sus (interval, câte variante, câte gratuite), fix la derulare
     - căutare în valori, ascunderea variantelor „retrase din ofertă"
     - grupele pliate, ordonate de la cea mai ieftină
     - o valoare = un rând; citatul și detaliile la clic pe rând
   Dovada nu dispare: fiecare rând are linkul, citatul e la un clic. */
const SERTAR = {date: [], unitate: "", camp: "", cauta: "", ascundeRetrase: true, ordine: "pret"};
const RE_RETRAS = /retras[ăae]? din ofert|nu mai (sunt|este) disponibil/i;

async function deschideSertar(banca, camp, unitate, scenariu, extra = {}){
  const s = document.getElementById("sertar");
  s.classList.add("deschis");
  const m = await meta();
  document.getElementById("sertar-t").textContent = `${m.nume[banca] || banca} · ${etNume(camp)}`;
  document.getElementById("sertar-s").innerHTML = '<p class="note">se încarcă…</p>';
  document.getElementById("sertar-c").innerHTML = "";
  try{
    const d = await ia(`/api/celula?banca=${encodeURIComponent(banca)}&camp=${encodeURIComponent(camp)}`
      + `&unitate=${encodeURIComponent(unitate || "")}&scenariu=${encodeURIComponent(scenariu || "")}`
      + `&termen=${encodeURIComponent(extra.termen || "")}&produs=${encodeURIComponent(extra.produs || "")}`);
    Object.assign(SERTAR, {date: d, unitate, camp, cauta: ""});
    randeazaSertar(true);
  }catch(e){ document.getElementById("sertar-s").textContent = "Eroare: " + e.message; }
}

function randeazaSertar(capNou){
  const {date, camp} = SERTAR;
  const retrase = date.filter(r => RE_RETRAS.test([r.serviciu, r.conditie, r.detaliu, r.sectiune].join(" ")));
  const t = SERTAR.cauta.trim().toLowerCase();
  const vizibile = date.filter(r => !(SERTAR.ascundeRetrase && retrase.includes(r)))
    .filter(r => !t || [r.serviciu, r.conditie, r.frecventa, r.detaliu, r.citat, r.sectiune,
                        r.valoare === null ? r.valoare_text : num(r.valoare)]
                        .join(" ").toLowerCase().includes(t));
  const u = r => unitTxt(r.unitate || SERTAR.unitate);

  if(capNou){
    const vals = date.filter(r => !r.ambiguu && r.valoare !== null).map(r => r.valoare);
    const nServ = new Set(date.map(r => r.serviciu || "")).size;
    const gratuite = date.filter(r => !r.ambiguu && r.valoare === 0).length;
    const amb = date.filter(r => r.ambiguu).length;
    const cuLink = date.filter(r => r.link).length;
    document.getElementById("sertar-s").innerHTML = `
      ${etDesc(camp) ? `<div class="note" style="margin:2px 0 0">${esc(etDesc(camp))}</div>` : ""}
      <div class="s-rez">
        ${vals.length ? `<div><b>${num(Math.min(...vals))} – ${num(Math.max(...vals))}${u(date[0])}</b> <span>de la cel mai mic la cel mai mare</span></div>` : ""}
        <div><b>${nServ}</b> <span>${nServ === 1 ? "variantă" : "variante"} de serviciu</span></div>
        <div><b>${date.length}</b> <span>valori</span></div>
        ${gratuite ? `<div><b style="color:var(--ok)">${gratuite}</b> <span>gratuite</span></div>` : ""}
        ${amb ? `<div><b style="color:var(--warn)">${amb}</b> <span>de verificat (nu intră în comparații)</span></div>` : ""}
        <div><b>${cuLink}</b> <span>cu link la sursă</span></div>
      </div>
      <div class="s-bara">
        <input class="cauta" id="s-cauta" placeholder="Caută: pachet, sumă, condiție…"
               oninput="SERTAR.cauta=this.value;randeazaSertar()">
        ${retrase.length ? `<label class="bifa"><input type="checkbox" ${SERTAR.ascundeRetrase ? "checked" : ""}
            onchange="SERTAR.ascundeRetrase=this.checked;randeazaSertar()">
            ascunde ${retrase.length} ieșite din ofertă</label>` : ""}
        <select onchange="SERTAR.ordine=this.value;randeazaSertar()" style="min-width:0" title="ordinea grupelor">
          <option value="pret" ${SERTAR.ordine === "pret" ? "selected" : ""}>cel mai ieftin întâi</option>
          <option value="nume" ${SERTAR.ordine === "nume" ? "selected" : ""}>după nume</option>
          <option value="multe" ${SERTAR.ordine === "multe" ? "selected" : ""}>cele mai multe valori</option>
        </select>
        <button onclick="const d=[...document.querySelectorAll('#sertar-c details.g')],o=!d.every(x=>x.open);d.forEach(x=>x.open=o)">Deschide / închide tot</button>
      </div>`;
  }

  const grupuri = new Map();
  vizibile.forEach(r => {
    const k = r.serviciu || "(fără nume de serviciu în sursă)";
    if(!grupuri.has(k)) grupuri.set(k, []);
    grupuri.get(k).push(r);
  });
  const minG = rs => { const v = rs.filter(r => r.valoare !== null && !r.ambiguu).map(r => r.valoare);
                       return v.length ? Math.min(...v) : Infinity; };
  const lista = [...grupuri].sort((a, b) =>
    SERTAR.ordine === "nume" ? a[0].localeCompare(b[0], "ro")
    : SERTAR.ordine === "multe" ? b[1].length - a[1].length
    : (minG(a[1]) - minG(b[1])) || a[0].localeCompare(b[0], "ro"));
  // puține grupe, sau o căutare activă: deschise; altfel pliate, cu intervalul la vedere
  const deschise = lista.length <= 3 || !!t;
  document.getElementById("sertar-c").innerHTML = lista.length ? lista.map(([serv, rs]) => {
    rs.sort((a, b) => (a.ambiguu - b.ambiguu) || compara(a.valoare, b.valoare));
    const v = rs.filter(r => r.valoare !== null && !r.ambiguu).map(r => r.valoare);
    const interval = !v.length ? "—" : Math.min(...v) === Math.max(...v)
      ? `${num(v[0])}${u(rs[0])}` : `${num(Math.min(...v))} – ${num(Math.max(...v))}${u(rs[0])}`;
    const sec = rs.find(r => r.sectiune);
    return `<details class="g" ${deschise ? "open" : ""}>
      <summary><span class="gn">${esc(serv)}${sec ? `<span class="sub">${esc(sec.sectiune)}</span>` : ""}</span>
        <span class="gi">${interval}</span>
        <span class="gc">${rs.length} ${rs.length === 1 ? "valoare" : "valori"}</span></summary>
      ${rs.map(randSertar).join("")}
    </details>`;
  }).join("") : '<p class="note">Nicio valoare pentru căutarea curentă.</p>';
}

/* O valoare pe un rând: cifra · la ce se aplică · sursa. Citatul și
   pastilele tehnice apar la clic pe rând (dovada rămâne la un clic). */
function randSertar(r){
  const val = r.valoare !== null && r.valoare !== undefined
    ? `${num(r.valoare)}${unitTxt(r.unitate)}` : esc(r.valoare_text || "—");
  const ctx = [r.frecventa ? `<b>${esc(r.frecventa)}</b>` : "", esc(r.conditie || ""), esc(r.detaliu || "")]
    .filter(Boolean).join(" · ");
  const scen = (r.cod_scenariu || "").split("|").filter(Boolean);
  const cit = citatUtil(r);
  return `<div class="r" onclick="if(!event.target.closest('a'))this.classList.toggle('des')">
    <div class="rv" ${r.ambiguu ? 'style="color:var(--warn)"' : ""}>${val}${r.nr_aparitii > 1
      ? `<span class="mono gri" style="font-size:10px" title="aceeași valoare, în ${r.nr_aparitii} coloane ale tabelului"> ×${r.nr_aparitii}</span>` : ""}</div>
    <div class="rc">${ctx || '<span class="gri">fără condiții în sursă</span>'}
      ${r.ambiguu ? `<span class="pill amb" title="${esc(MOTIVE[r.motiv_ambiguu] || "")}">de verificat</span>` : ""}
      <span class="ind">${cit ? "❝ citat" : "detalii"} ▾</span></div>
    <div class="rs">${linkSursa(r)}</div>
    <div class="rx">
      ${cit ? `<div class="cit">${citatEvidentiat(r)}</div>`
            : `<div class="cit" style="border-left-style:dotted;font-style:italic">${r.sectiune
                ? "În document, la secțiunea <b>" + esc(r.sectiune) + "</b>." : "Documentul nu dă niciun text în jurul cifrei."}</div>`}
      <div class="meta">
        <span class="pill" title="cu ce variantă de colectare a fost extrasă">${esc(r.metoda_extractie || "?")}</span>
        ${scen.map(x => `<span class="pill">${esc(x)}</span>`).join("")}
        ${r.ambiguu ? `<span class="pill amb">${esc(r.motiv_ambiguu || "ambiguu")}</span>` : ""}
        ${r.confidence < 0.7 ? `<span class="pill amb">încredere ${num(r.confidence)}</span>` : ""}
      </div>
    </div>
  </div>`;
}

    <div><div class="e">Dobânzi</div><div class="n">${num(r.dobanzi, 0)}</div><div class="l">valori curente</div></div>
    <div><div class="e">Aplicația</div><div class="n">${r.rating ? num(r.rating) + " ★" : "—"}</div>
      <div class="l">${r.note ? num(r.note, 0) + " note în App Store" : "neidentificată în App Store"}</div></div>
    <div><div class="e">Rețea proprie</div><div class="n">${l ? num(l.sucursale + l.atm, 0) : "—"}</div>

R.produse = async (stare) => {
  const grup = stare.grup || "cont_curent", seg = stare.segment || "toate";
  const [d, m] = await Promise.all([
    ia(`/api/matrice?grup=${grup}&segment=${seg}&unitate=lei`), meta(),
  ]);
  /* Matrice bancă × serviciu: o privire în loc de 5 clasamente una sub alta.
     Celula nu arată o singură cifră (un comision are pachete, praguri, monede —
     o cifră ar induce în eroare), ci câte prețuri avem, între ce valori și câte
     sunt gratuite. Clic pe celulă = toate prețurile, cu citat și link. */
  const pe = {};
  d.celule.forEach(c => { (pe[c.banca] = pe[c.banca] || {})[c.camp] = c; });
  const banci = Object.keys(pe);
  const total = b => d.campuri.reduce((s, cp) => s + ((pe[b][cp] || {}).n || 0), 0);
  const coloane = [
    {cap: "Bancă", html: true, s: b => m.nume[b] || b,
     val: b => etichetaBanca(b, m, {fisa: true, tag: true})},
    ...d.campuri.map(cp => ({
      capHtml: `${esc(etNume(cp))}<span class="cap-d">${esc(etDesc(cp))}</span>`,
      html: true, s: b => (pe[b][cp] || {}).n,
      td: b => pe[b][cp]
        ? {cls: "mc", attr: `onclick="deschideSertar('${esc(b)}','${esc(cp)}','lei','')"
             title="${esc((m.nume[b] || b) + " · " + etNume(cp))}: toate prețurile, cu citat și link"`}
        : {cls: "gol"},
      val: b => {
        const c = pe[b][cp];
        if(!c) return "—";
        const interval = c.minim === c.maxim ? `${num(c.minim)} lei` : `${num(c.minim)}–${num(c.maxim)} lei`;
        return `<b>${num(c.n, 0)}</b> <span class="gri" style="font-size:11px">${c.n === 1 ? "preț" : "prețuri"}</span>
          <span class="sub">${interval}</span>
          ${c.gratuite ? `<span class="g">${c.gratuite} ${c.gratuite === 1 ? "gratuit" : "gratuite"}</span>` : ""}`;
      },
    })),
    {cap: "Total", cls: "num", s: total, val: b => num(total(b), 0)},
  ];
  const html = tabel(banci, coloane, {sort: true, lung: true, libra: b => b, implicit: [coloane.length - 1, "desc"],
    rand: b => ({cauta: `${m.nume[b] || ""} ${b}`})});

  return `
  <div class="bara-fixa"><div class="filtre">
    <div class="taburi">
      ${[["cont_curent","Cont curent"],["carduri","Carduri"],["transferuri","Transferuri și plăți"]]
        .map(([v,t]) => `<button class="${v === grup ? "activ" : ""}" onclick="mergi('produse',{grup:'${v}',segment:'${seg}'})">${t}</button>`).join("")}
    </div>
    <label class="f">Pentru cine e prețul
      <select onchange="mergi('produse',{grup:'${grup}',segment:this.value})">
        ${[["toate","Oricine (tot ce avem)"],["pf","Doar persoane fizice"],
           ["pj","Doar firme"],["pfa","Doar PFA"]]
          .map(([v,t]) => `<option value="${v}" ${v === seg ? "selected" : ""}>${t}</option>`).join("")}
      </select></label>
    <label class="f">Caută bancă
      <input class="cauta" placeholder="ex. BCR, ING…" oninput="cautaInTabel(this,'t-produse')"></label>
  </div></div>
  <section>
    <p class="note" style="margin:0 0 10px">${banci.length} bănci · în fiecare celulă: <b>câte prețuri</b> avem,
      între ce valori și câte sunt gratuite. <b>Clic pe celulă</b> pentru toate prețurile, cu citatul și
      linkul către document. Clic pe antet sortează; Libra rămâne prima.</p>
    <div id="t-produse">${banci.length ? html : '<p class="note">Fără date pentru selecția curentă.</p>'}</div>
    ${despre(`
      <b>De ce nu o singură cifră pe celulă.</b> Un comision are prea multe variante (pachete,
      praguri de sumă, monede) ca o cifră să însemne ceva. Comparația cap la cap, cu cifra tipică,
      e în <a href="#/versus">Versus Libra</a>.<br>
      <b>Pentru cine e prețul.</b> Doar o parte din documente spun „persoane fizice" sau „firme";
      restul sunt prețuri reale, din tabele care nu notează asta. De aceea filtrul e implicit pe
      <b>oricine</b>. Ce scrie efectiv în date:
      ${d.segmente.map(s => `<span class="pill">${esc(s.seg)}: ${num(s.n,0)}</span>`).join(" ")}<br>
      ${d.excluse_ambigue ? `<b>${num(d.excluse_ambigue, 0)}</b> valori ambigue nu intră în tabel. ` : ""}
      ${d.excluse_implauzibile ? `<b>${num(d.excluse_implauzibile, 0)}</b> valori peste ${num(d.prag_plauzibil, 0)} lei nu intră — sunt limite sau praguri extrase greșit ca preț. ` : ""}
      Toate sunt în <a href="#/coada">Coada de verificare</a>.`)}
  </section>`;
};

R.rate = async (stare) => {
  const cat = stare.categorie || "depozite";
  const termen = stare.termen || "", produs = stare.produs || "";
  const [d, indici, m] = await Promise.all([
    ia(`/api/rate?categorie=${cat}&termen=${encodeURIComponent(termen)}&produs=${encodeURIComponent(produs)}`),
    ia("/api/indici"), meta(),
  ]);
  const mare = d.sens === "mare_bun";
  const pe = {};
  d.celule.forEach(c => { (pe[c.banca] = pe[c.banca] || {})[c.camp] = c; });
  const banci = Object.keys(pe);
  const campuri = d.campuri.filter(cp => banci.some(b => pe[b][cp]));

  /* Cea mai bună valoare pe coloană: doar un câștigător UNIC cu cel puțin
     MIN_VALORI valori colectate. Altfel „cel mai bun" ar fi banca despre care
     știm cel mai puțin. */
  const best = {};
  campuri.forEach(cp => {
    const cel = banci.map(b => pe[b][cp]).filter(Boolean);
    if(!cel.length) return;
    const ext = mare ? Math.max(...cel.map(c => c.valoare)) : Math.min(...cel.map(c => c.valoare));
    const egali = cel.filter(c => c.valoare === ext);
    if(egali.length === 1 && egali[0].n >= MIN_VALORI) best[cp] = egali[0].banca;
  });
  const termenTxt = c => c.luni ? (c.luni % 12 === 0 && c.luni >= 12 ? `${c.luni / 12} ${c.luni === 12 ? "an" : "ani"}` : `${c.luni} luni`)
                               : (c.frecventa || "");
  const coloane = [
    {cap: "Bancă", html: true, s: b => m.nume[b] || b, val: b => etichetaBanca(b, m, {fisa: true, tag: true})},
    ...campuri.map(cp => ({
      capHtml: `${esc(etNume(cp))}<span class="cap-d">${esc(etDesc(cp))}</span>`,
      html: true, cls: "", s: b => (pe[b][cp] || {}).valoare,
      td: b => pe[b][cp]
        ? {cls: "mc" + (best[cp] === b ? " best" : ""),
           attr: `onclick="deschideSertar('${esc(b)}','${esc(cp)}','procent','${esc(cat)}',${esc(JSON.stringify({termen, produs}))})"
                  title="toate cele ${pe[b][cp].n} valori, cu citat și link"`}
        : {cls: "gol"},
      val: b => {
        const c = pe[b][cp];
        if(!c) return "—";
        const ctx = [termenTxt(c), c.serviciu ? (c.serviciu.length > 34 ? c.serviciu.slice(0, 33) + "…" : c.serviciu) : ""]
          .filter(Boolean).join(" · ");
        return `<b>${num(c.valoare)}%</b>${best[cp] === b ? ' <span class="pill ok" style="font-size:9px">cea mai bună</span>' : ""}
          ${ctx ? `<span class="sub" style="white-space:normal;max-width:24ch;margin-left:auto">${esc(ctx)}</span>` : ""}
          <span class="sub">${c.n > 1 ? `${num(c.minim)}–${num(c.maxim)}% · ${c.n} valori` : "1 valoare"}</span>`;
      },
    })),
  ];
  const cp0 = campuri[0];
  const html = banci.length
    ? tabel(banci, coloane, {sort: true, lung: true, libra: b => b,
        implicit: cp0 ? [1, mare ? "desc" : "asc"] : null, rand: b => ({cauta: `${m.nume[b] || ""} ${b}`})})
    : `<div class="gol-stare"><b>Nicio valoare pentru filtrul curent</b>
         ${termen ? "Termenul ales nu apare în sursele colectate. " : ""}Încearcă „toate".</div>`;

  // Indicii BNR sunt pe pagina 2.6; aici doar reperul pentru credite și depozite.
  const ultimaZi = indici.filter(x => x.indice === "robor").map(x => String(x.valabil_din).slice(0, 10)).sort().pop();
  const r3 = indici.find(x => x.indice === "robor" && x.scadenta === "3M" && String(x.valabil_din).slice(0, 10) === ultimaZi);
  const azi = new Date().toISOString().slice(0, 10);
  const ircc = indici.filter(x => x.indice === "ircc" && String(x.valabil_din).slice(0, 10) <= azi
                                 && (!x.valabil_pana || String(x.valabil_pana).slice(0, 10) >= azi))[0];

  return `
  <div class="bara-fixa"><div class="filtre">
    <div class="taburi">
      ${[["depozite","Depozite"],["credite","Credite"],["conturi_carduri","Conturi & carduri"]]
        .map(([v,t]) => `<button class="${v === cat ? "activ" : ""}" onclick="mergi('rate',{categorie:'${v}'})">${t}</button>`).join("")}
    </div>
    ${cat === "depozite" ? `<label class="f">Termen
      <select onchange="mergi('rate',{categorie:'${cat}',termen:this.value})">
        <option value="">toate termenele</option>
        ${d.termene.map(t => `<option value="${t.cheie}" ${t.cheie === termen ? "selected" : ""} ${t.n ? "" : "disabled"}>${esc(t.eticheta)} (${t.n})</option>`).join("")}
      </select></label>` : ""}
    ${cat === "credite" ? `<label class="f">Produs
      <select onchange="mergi('rate',{categorie:'${cat}',produs:this.value})">
        <option value="">toate produsele</option>
        ${d.produse.map(t => `<option value="${t.cheie}" ${t.cheie === produs ? "selected" : ""} ${t.n ? "" : "disabled"}>${esc(t.eticheta)} (${t.n})</option>`).join("")}
      </select></label>` : ""}
    <label class="f">Caută bancă
      <input class="cauta" placeholder="ex. ING, Salt…" oninput="cautaInTabel(this,'t-rate')"></label>
    <span class="note" style="margin-left:auto;text-align:right">
      ${r3 ? `ROBOR 3M <b>${num(r3.valoare)}%</b>` : ""}${ircc ? ` · IRCC <b>${num(ircc.valoare)}%</b>` : ""}
      <a href="#/context">→ indici BNR</a></span>
  </div></div>
  <section>
    <p class="note" style="margin:0 0 10px">${banci.length} bănci · cifra e dobânda <b>tipică</b> a băncii (mediana),
      cu termenul și produsul ei dedesubt; ${mare ? "<b>mai mare e mai bine</b>" : "<b>mai mic e mai bine</b>"}.
      Clic pe celulă pentru toate valorile, cu citat și link.
      ${cat === "depozite" && !termen ? `<b>Alege un termen</b> ca să compari aceeași perioadă — altfel 4 luni stă lângă 12 luni.` : ""}
      ${cat === "credite" && !produs ? `<b>Alege un produs</b> — altfel un ipotecar stă lângă rate fără dobândă în magazine.` : ""}</p>
    <div id="t-rate" style="${campuri.length <= 1 ? "max-width:900px" : ""}">${html}</div>
    ${despre(`
      <b>Mediana, nu vârful</b>: ca o singură campanie să nu reprezinte toată oferta băncii; intervalul
      de sub cifră arată extremele.<br>
      <b>Termenul</b> vine din textul sursei; ${num((d.termene.find(t => t.cheie === "necunoscut") || {}).n || 0, 0)}
      valori nu îl precizează și apar doar la „toate termenele" sau „termen nespecificat".<br>
      <b>Produsul</b> la credite e dedus din denumirea dată de bancă (ipotecar, nevoi personale, card,
      rate în magazine).<br>
      ${d.excluse_implauzibile ? `<b>${d.excluse_implauzibile}</b> valori peste ${d.prag}% nu intră — sunt procente de alt fel
        (reduceri, praguri, taxe) etichetate greșit ca dobândă; sunt în <a href="#/coada">Coada de verificare</a>.<br>` : ""}
      ${(d.provenienta || []).length ? `Colectat de: ${d.provenienta.map(p => `<span class="pill">${esc(p.metoda)}: ${p.valori} valori / ${p.banci} bănci</span>`).join(" ")}` : ""}`)}
  </section>`;

/* ---------------- 2.3 Aplicații mobile și recenzii ----------------
   Pagina 2.7 (Sentiment) s-a mutat aici, la cererea lui Robert (25.09): și
   aplicația, și recenziile vin din același loc (pagina publică din store), iar
   întrebările merg împreună („ce notă are aplicația și de ce se plâng
   oamenii"). Un comutator iOS / Android; Android nu e încă colectat. */
R.mobil = async (stare) => {
  const plat = stare.platforma || "ios";
  const bSel = stare.banca || "", nSel = stare.nota || "", sfSel = stare.storefront || "";
  const f = o => `mergi('mobil',${esc(JSON.stringify({platforma: plat, banca: bSel, nota: nSel, storefront: sfSel, ...o}))})`;
  const comutator = `<div class="filtre" style="margin-bottom:16px">
    <div class="taburi">
      <button class="${plat === "ios" ? "activ" : ""}" onclick="mergi('mobil',{platforma:'ios'})">iOS · App Store</button>
      <button class="${plat === "android" ? "activ" : ""}" onclick="mergi('mobil',{platforma:'android'})">Android · Google Play</button>
    </div></div>`;

  if(plat === "android") return `${comutator}
    <section>
      <div class="gol-stare"><b>Android — în lucru</b>
        Aplicațiile din Google Play nu sunt încă colectate.</div>
      <h4>Ce va conține</h4>
      <p class="note">Aceleași informații ca la iOS, pentru aceleași bănci: nota și numărul de note,
        distribuția pe stele, versiunea curentă și ce e nou în ea, capturile din listing și
        recenziile scrise, cu răspunsul băncii. Sursa va fi pagina publică a aplicației din
        Google Play, cu aceleași reguli ca la App Store: doar ce permite robots.txt, fără conturi.</p>
    </section>`;

  const [d, s, m] = await Promise.all([
    ia("/api/mobil"),
    ia(`/api/sentiment?banca=${encodeURIComponent(bSel)}&nota=${encodeURIComponent(nSel)}&storefront=${encodeURIComponent(sfSel)}`),
    meta(),
  ]);
  const capturiPe = {};
  d.screenshoturi.forEach(x => (capturiPe[x.banca] = capturiPe[x.banca] || []).push(x.url));
  CACHE.capturi = capturiPe;
  const rec = Object.fromEntries(s.sumar.map(x => [x.banca, x]));
  const v = d.versiuni.map(r => ({...r, rec: rec[r.banca] || null}));
  const dif = r => (r.rec && r.rec.medie_text && r.rating_agregat) ? r.rec.medie_text - Number(r.rating_agregat) : null;
  const nota = r => r.note_lansare
    ? `<details class="despre" style="margin:0" onclick="event.stopPropagation()"><summary>${esc(r.note_lansare.slice(0, 70).replace(/\s+\S*$/, ""))}…</summary>
         <div class="note" style="white-space:pre-line;max-width:60ch">${esc(r.note_lansare)}</div></details>`
    : '<span class="gri">—</span>';

  const aplicatii = tabel(v, [
    {cap: "Bancă", html: true, s: r => m.nume[r.banca] || r.banca, val: r => etichetaBanca(r.banca, m, {tag: true})},
    {cap: "Nota App Store", cls: "num", html: true, s: r => r.rating_agregat,
     val: r => r.rating_agregat ? `<b>${num(r.rating_agregat)}</b> ★` : "—"},
    {cap: "Nr. note", cls: "num", s: r => r.volum_rating, val: r => num(r.volum_rating, 0),
     titlu: "câți oameni au dat o notă — indică baza de utilizatori"},
    {cap: "Distribuția notelor", html: true, val: r => bareStele(r.distributie_stele, 120),
     titlu: "toate notele din App Store, de la 5★ (verde) la 1★ (portocaliu); treci cu mouse-ul pentru cifre"},
    {cap: "Nota recenziilor scrise", cls: "num", html: true, s: r => r.rec ? r.rec.medie_text : null,
     val: r => r.rec ? `${num(r.rec.medie_text)} ★<span class="sub">din ${r.rec.review_uri} citite</span>` : "—"},
    {cap: "Negative (1–2★)", cls: "num", html: true, s: r => r.rec ? r.rec.negative / r.rec.review_uri : null,
     val: r => r.rec ? `${r.rec.negative} din ${r.rec.review_uri}<span class="sub">${Math.round(100 * r.rec.negative / r.rec.review_uri)}%</span>` : "—"},
    {cap: "Diferență text − store", cls: "num", html: true, s: dif,
     titlu: "cât de mult se abate nota celor care scriu de nota tuturor votanților",
     val: r => { const x = dif(r); return x === null ? "—" : Math.abs(x) < 0.005 ? "0"
       : `<b style="color:${x < 0 ? "var(--warn)" : "var(--ok)"}">${x > 0 ? "+" : "−"}${num(Math.abs(x))}</b>`; }},
    {cap: "Versiune", cls: "mono", s: r => r.versiune, k: "versiune"},
    {cap: "Ce e nou", html: true, val: nota},
    {cap: "Capturi", html: true, s: r => (capturiPe[r.banca] || []).length,
     val: r => (capturiPe[r.banca] || []).length
       ? `<button style="white-space:nowrap" onclick="event.stopPropagation();arataCapturi('${esc(r.banca)}')">${capturiPe[r.banca].length} capturi</button>` : "—"},
  ], {sort: true, lung: true, libra: r => r.banca, implicit: [2, "desc"],
      rand: r => ({cls: r.banca === bSel ? "ales" : "",
                   clic: r.rec ? f({banca: r.banca === bSel ? "" : r.banca, la: "recenzii"}) : ""})});

  const titluRec = bSel ? `Recenziile ${esc(m.nume[bSel] || bSel)}, cele negative întâi` : "Cele mai noi recenzii";
  const selF = (cheie, opt) => `<select onchange="${f({[cheie]: "__v"}).replace("&quot;__v&quot;", "this.value")}">${opt}</select>`;
  return `${comutator}
  <section class="apl-tabel">
    <h2>Aplicațiile</h2>
    <p class="note" style="margin:0 0 10px"><b>${d.versiuni.length} din 30 de bănci</b> au aplicația identificată în App Store.
      <b>Clic pe o bancă</b> pentru recenziile ei (mai jos). Clic pe antet sortează; Libra rămâne prima.</p>
    ${aplicatii}
    ${despre(`${DOUA_NOTE}
      Recenziile sunt reale, de pe pagina publică a aplicației din App Store; autorii sunt pseudonimizați
      la colectare (Apple afișează numele real).<br>
      <b>Data ultimei actualizări</b> a aplicației nu e încă colectată: avem versiunea curentă, nu și ziua în care a apărut.`)}
  </section>
  <div class="bara-fixa" id="recenzii"><div class="filtre">
    <b style="font-family:'Source Serif 4',Georgia,serif;font-size:16px;margin-right:6px">Recenzii</b>
    <label class="f">Bancă ${selF("banca", `<option value="">toate băncile</option>
      ${s.sumar.slice().sort((a, b) => a.nume.localeCompare(b.nume, "ro")).map(x =>
        `<option value="${esc(x.banca)}" ${x.banca === bSel ? "selected" : ""}>${esc(x.nume)} (${x.review_uri})</option>`).join("")}`)}</label>
    <label class="f">Notă ${selF("nota", `<option value="">toate notele</option>
      ${[5,4,3,2,1].map(n => `<option value="${n}" ${String(n) === nSel ? "selected" : ""}>${"★".repeat(n)}</option>`).join("")}`)}</label>
    <label class="f">Magazin ${selF("storefront", `<option value="">toate</option>
      ${s.storefronts.map(x => `<option value="${esc(x.storefront)}" ${x.storefront === sfSel ? "selected" : ""}>${esc(x.storefront)} (${x.n})</option>`).join("")}`)}</label>
    ${(bSel || nSel || sfSel) ? `<button onclick="mergi('mobil',{platforma:'ios',la:'recenzii'})">Șterge filtrele</button>` : ""}
    <span class="note" style="margin-left:auto">${num(s.total_filtrat, 0)} în filtrul curent</span>
  </div></div>
  <section>
    <h2>${titluRec}</h2>
    ${s.recente.length ? s.recente.map((r, i) => `
      <div class="rec" ${i >= 15 ? 'data-ascuns style="display:none"' : ""}>
        <div class="rec-cap">
          <span class="rec-stele ${r.rating >= 4 ? "bun" : r.rating <= 2 ? "rau" : ""}">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>
          ${etichetaBanca(r.banca, m)}
          <span class="pill">${esc(r.storefront)}</span>
          ${r.versiune ? `<span class="pill">v${esc(r.versiune)}</span>` : ""}
          <span class="mono gri" style="font-size:10.5px;margin-left:auto">${esc(String(r.postat_la || "").slice(0, 10))}</span>
        </div>
        <div class="rec-txt">${esc(r.text || "(fără text)")}</div>
        ${r.raspuns_banca ? `<div class="rec-txt" style="margin-top:7px;padding:7px 10px;border-left:3px solid var(--accent);
            background:var(--accent-tint);border-radius:0 7px 7px 0;font-size:12px">
            <b>Răspunsul băncii:</b> ${esc(r.raspuns_banca)}</div>` : ""}
      </div>`).join("") : '<p class="note">Nicio recenzie pentru filtrul curent.</p>'}
    ${s.recente.length > 15 ? `<button onclick="this.closest('section').querySelectorAll('[data-ascuns]').forEach(x=>x.style.display='');this.remove()"
        >Arată toate cele ${s.recente.length} recenzii</button>` : ""}
  </section>`;
};

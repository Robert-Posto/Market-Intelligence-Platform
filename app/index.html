/* scadențele în ordinea lor economică, nu alfabetică (12M, 1M, 1W… nu spunea nimic) */
const ORD_SCADENTA = ["O/N", "T/N", "1W", "1M", "3M", "6M", "9M", "12M"];
const ordScad = s => { const i = ORD_SCADENTA.indexOf(s); return i < 0 ? 99 : i; };

R.context = async (stare) => {
  const ind = stare.indice || "robor";
  const indici = await ia("/api/indici");
  const zi = x => String(x.valabil_din).slice(0, 10);
  const val = (i, sc, z) => { const r = indici.find(x => x.indice === i && x.scadenta === sc && zi(x) === z);
                              return r ? Number(r.valoare) : null; };
  const zileRobor = [...new Set(indici.filter(x => x.indice === "robor").map(zi))].sort().reverse();
  const [azi, ieri] = zileRobor;
  const astazi = new Date().toISOString().slice(0, 10);
  const irccToate = indici.filter(x => x.indice === "ircc").sort((a, b) => zi(b).localeCompare(zi(a)));
  const irccAcum = irccToate.find(x => zi(x) <= astazi && (!x.valabil_pana || String(x.valabil_pana).slice(0, 10) >= astazi));
  const sursa = i => (indici.find(x => x.indice === i && x.sursa) || {}).sursa;

  const card = (sc) => {
    const a = val("robor", sc, azi), b = val("robor", sc, ieri);
    const d = a !== null && b !== null ? a - b : null;
    return `<div><div class="e">ROBOR ${sc}</div><div class="n">${a === null ? "—" : num(a) + "%"}</div>
      <div class="l">${d === null ? "" : Math.abs(d) < 0.005 ? "neschimbat față de " + esc(ieri)
        : `<span class="${d > 0 ? "sus" : "jos"}">${d > 0 ? "↑" : "↓"} ${num(Math.abs(d))} pp</span> față de ${esc(ieri)}`}</div></div>`;
  };

  let tabelInd;
  if(ind === "ircc"){
    tabelInd = tabel(irccToate, [
      {cap: "Trimestru de calcul", k: "scadenta", cls: "mono"},
      {cap: "Valoare", cls: "num", html: true, val: r => `<b>${num(r.valoare)}%</b>`},
      {cap: "Se aplică de la", cls: "mono", val: r => zi(r)},
      {cap: "până la", cls: "mono", val: r => String(r.valabil_pana || "").slice(0, 10) || "—"},
      {cap: "", html: true, val: r => r === irccAcum ? '<span class="pill ok">în vigoare azi</span>' : ""},
    ], {lung: true});
  }else{
    // pivot: un rând pe zi, o coloană pe scadență — curba se citește pe rând
    const zile = [...new Set(indici.filter(x => x.indice === ind).map(zi))].sort().reverse();
    const sc = [...new Set(indici.filter(x => x.indice === ind).map(x => x.scadenta))].sort((a, b) => ordScad(a) - ordScad(b));
    tabelInd = tabel(zile, [
      {cap: "Zi", cls: "mono", val: z => z},
      ...sc.map(s => ({cap: s, cls: "num", html: true, val: z => {
        const a = val(ind, s, z), i = zile.indexOf(z), b = i + 1 < zile.length ? val(ind, s, zile[i + 1]) : null;
        if(a === null) return "—";
        const d = b === null ? 0 : a - b;
        return `${num(a)}${Math.abs(d) >= 0.005 ? `<span class="${d > 0 ? "sus" : "jos"}" style="font-size:10px;margin-left:3px">${d > 0 ? "↑" : "↓"}</span>` : ""}`;
      }})),
    ], {lung: true});
  }

  return `
  <div class="kpi">
    <div><div class="e">IRCC în vigoare</div><div class="n">${irccAcum ? num(irccAcum.valoare) + "%" : "—"}</div>
      <div class="l">${irccAcum ? `calculat pe ${esc(irccAcum.scadenta)}, se aplică ${esc(zi(irccAcum))} – ${esc(String(irccAcum.valabil_pana || "").slice(0, 10))}` : ""}<br>
      indicele creditelor în lei cu dobândă variabilă</div></div>
    ${card("3M")}${card("6M")}${card("12M")}
  </div>
  <section>
    <div class="filtre">
      <div class="taburi">
        ${[["robor","ROBOR"],["robid","ROBID"],["ircc","IRCC"]].map(([v, t]) =>
          `<button class="${v === ind ? "activ" : ""}" onclick="mergi('context',{indice:'${v}'})">${t}</button>`).join("")}
      </div>
      <span class="note" style="margin-left:auto">Sursa: ${sursa(ind)
        ? `<a class="sursa" href="${esc(sursa(ind))}" target="_blank" rel="noopener">↗ bnr.ro — pagina oficială</a>` : "BNR"}</span>
    </div>
    <p class="note" style="margin:0 0 10px">${ind === "ircc"
      ? "IRCC se calculează trimestrial și se aplică din al doilea trimestru următor."
      : `Un rând pe zi, cea mai recentă sus; săgeata arată schimbarea față de ziua precedentă. ${ind === "robor"
          ? "ROBOR e rata la care băncile se împrumută între ele — mișcă creditele cu dobândă variabilă."
          : "ROBID e rata la care băncile atrag depozite de la alte bănci — un plafon informal pentru dobânzile la depozite."}`}</p>
    ${tabelInd}
    ${despre(`<b>Ce nu avem încă în 2.6:</b> EURIBOR, statisticile BNR de sector, cotele de piață ARB,
      rapoartele financiare trimestriale ale băncilor și statisticile de reclamații ANPC / CSALB.<br>
      Cursul de referință BNR lipsește: fluxul oficial stă pe curs.bnr.ro, unde robots.txt interzice colectarea.`, "Ce lipsește")}
  </section>`;
};

/* ---------------- Versus Libra ----------------
   Revamp 25.09: rezumat sus („unde câștigă / pierde Libra"), filtru pe rânduri,
   capul fiecărei secțiuni fix la derulare, selector de bănci cu căutare. */
R.versus = async (stare) => {
  const referinta = "libra";
  const arata = stare.arata || "toate";
  const grupuri = [
    {api:"matrice", cheie:"cont_curent", unitate:"lei"},
    {api:"matrice", cheie:"carduri", unitate:"lei"},
    {api:"matrice", cheie:"transferuri", unitate:"lei"},
    {api:"rate", cheie:"depozite", unitate:"procent"},
    {api:"rate", cheie:"credite", unitate:"procent"},
  ];
  const [date, M, extra] = await Promise.all([
    Promise.all(grupuri.map(g => g.api === "matrice"
      ? ia(`/api/matrice?grup=${g.cheie}&segment=pf&unitate=lei`)
      : ia(`/api/rate?categorie=${g.cheie}`))),
    meta(), ia("/api/versus_extra"),
  ]);

  const toateBanci = [...new Set(date.flatMap(d => d.celule.map(c => c.banca)))]
    .sort((a, b) => (M.nume[a] || a).localeCompare(M.nume[b] || b, "ro"));
  const implicit = ["bcr", "brd", "raiffeisen"].filter(b => toateBanci.includes(b));
  const alese = (stare.banci ? stare.banci.split(",") : implicit).filter(b => toateBanci.includes(b) && b !== referinta);
  const coloane = [referinta, ...alese];
  const NC = coloane.length;
  const grid = `--vsc:minmax(200px,1.3fr) repeat(${NC},minmax(130px,1fr))`;
  const scurt = b => (M.nume[b] || b).replace(/ — .*| N\.V\..*| S\.A\..*| EAD .*/, "");

  const pe = lista => Object.fromEntries((lista || []).map(x => [x.banca, x]));
  const appPe = pe(extra.mobil), locPe = pe(extra.retea);
  const sentPe = pe(extra.sentiment), acopPe = pe(extra.acoperire);

  /* Starea Libra pe un rând: cea mai bună / la mijloc / cea mai slabă /
     fără date. Doar pe rândurile unde cel puțin încă o bancă are valoare. */
  const stareLibra = (vals, sens) => {
    const lib = vals[referinta];
    const alte = Object.entries(vals).filter(([b, v]) => b !== referinta && v !== null && v !== undefined).map(([, v]) => v);
    if(lib === null || lib === undefined) return "fara";
    if(!alte.length) return "singura";
    const bun = sens === "mare_bun" ? lib >= Math.max(...alte) : lib <= Math.min(...alte);
    const slab = sens === "mare_bun" ? lib < Math.min(...alte) : lib > Math.max(...alte);
    return bun ? "castiga" : slab ? "pierde" : "mijloc";
  };
  const bilant = {castiga: 0, pierde: 0, mijloc: 0, fara: 0};
  const vizibil = st => arata === "toate" || (arata === "pierde" && (st === "pierde" || st === "mijloc"))
                     || (arata === "castiga" && st === "castiga");

  const capSectiune = (titlu, sens) => `<div class="vs-sec-cap">
      <div class="t">${esc(titlu)}<span>${sens === "mare_bun" ? "mai mare = mai bun" : "mai mic = mai bun"}</span></div>
      ${coloane.map(b => `<div class="c ${b === referinta ? "ref" : ""}">${esc(scurt(b))}</div>`).join("")}
    </div>`;
  const etichetaRand = (et, desc, cate) => `<div class="vs-lab"><b>${esc(et)}</b>
      ${desc ? `<span>${esc(desc)}</span>` : ""}
      ${cate < NC ? `<em>date doar la ${cate} din ${NC}</em>` : ""}</div>`;

  function sectiuneExtra(titlu, sens, randuri){
    let k = 0;
    const corp = randuri.map(([et, desc, surse, fmt]) => {
      const brute = coloane.map(b => { const v = fmt(surse[b]); return {b, v, n: (v && typeof v.n === "number") ? v.n : null}; });
      const numere = brute.map(x => x.n).filter(x => x !== null && !isNaN(x));
      const best = numere.length > 1 ? (sens === "mare_bun" ? Math.max(...numere) : Math.min(...numere)) : null;
      // rânduri fără cifră comparabilă (versiunea aplicației): doar informative
      const st = numere.length ? stareLibra(Object.fromEntries(brute.map(x => [x.b, x.n])), sens) : "neutru";
      if(st !== "neutru") bilant[st] = (bilant[st] || 0) + 1;
      if(!vizibil(st)) return "";
      return `<div class="vs-rand ${k++ % 2 ? "alt" : ""}">${etichetaRand(et, desc, brute.filter(x => x.v).length)}
        ${brute.map(x => {
          if(!x.v) return `<div class="vs-cel gol" title="nu avem această dată pentru banca respectivă">—</div>`;
          const bun = best !== null && x.n === best;
          const pierde = x.b === referinta && st === "pierde";
          return `<div class="vs-cel ${bun ? "best" : ""} ${pierde ? "pierde" : ""}">
            <span class="v-num">${x.v.t}</span>${x.v.sub ? `<span class="v-ctx">${esc(x.v.sub)}</span>` : ""}
            ${bun ? '<span class="vs-bun">cel mai bun</span>' : ""}</div>`;
        }).join("")}</div>`;
    }).join("");
    return corp ? `<details class="vs-sec" open><summary>${capSectiune(titlu, sens)}</summary>${corp}</details>` : "";
  }

  const secte = date.map((d, i) => {
    const g = grupuri[i];
    const harta = {};
    d.celule.forEach(c => { (harta[c.camp] = harta[c.camp] || {})[c.banca] = c; });
    const campuri = d.campuri.filter(cp => coloane.some(b => (harta[cp] || {})[b]));
    let k = 0;
    const corp = campuri.map(cp => {
      const p = harta[cp] || {};
      const vals = coloane.map(x => p[x]).filter(Boolean).map(x => x.valoare);
      const celMaiBun = vals.length ? (d.sens === "mare_bun" ? Math.max(...vals) : Math.min(...vals)) : null;
      const st = stareLibra(Object.fromEntries(coloane.map(b => [b, p[b] ? p[b].valoare : null])), d.sens);
      bilant[st] = (bilant[st] || 0) + 1;
      if(!vizibil(st)) return "";
      return `<div class="vs-rand ${k++ % 2 ? "alt" : ""}">${etichetaRand(etNume(cp), etDesc(cp), coloane.filter(b => p[b]).length)}
        ${coloane.map(b => {
          const c = p[b];
          if(!c) return `<div class="vs-cel gol" title="banca nu are această valoare colectată">—</div>`;
          const bun = vals.length > 1 && c.valoare === celMaiBun;
          const pierde = b === referinta && st === "pierde";
          return `<div class="vs-cel ${bun ? "best" : ""} ${pierde ? "pierde" : ""}">
            <span class="celula" onclick="deschideSertar('${esc(b)}','${esc(cp)}','${g.unitate}','${g.api === "rate" ? esc(g.cheie) : ""}')"
              >${valoareCelula(c, d.sens, g.unitate)}</span>
            ${bun ? '<span class="vs-bun">cel mai bun</span>' : ""}</div>`;
        }).join("")}</div>`;
    }).join("");
    return corp ? `<details class="vs-sec" open><summary>${capSectiune(d.titlu, d.sens)}</summary>${corp}</details>` : "";
  }).join("");

  const numar = (v, sufix, sub) => (v === null || v === undefined) ? null : {t: num(v) + (sufix || ""), n: Number(v), sub};
  const sectiuni = secte
    + sectiuneExtra("Aplicație mobilă (2.3)", "mare_bun", [
        ["Nota în App Store", "nota reală a aplicației, din store", appPe,
         r => r && r.rating ? numar(r.rating, " ★", `${num(r.volum, 0)} note`) : null],
        ["Nr. de note", "câți oameni au votat — indică baza de utilizatori", appPe,
         r => r && r.volum ? numar(r.volum, "", "note în store") : null],
        ["Versiune publicată", "ce versiune e live acum", appPe,
         r => r && r.versiune ? {t: esc(r.versiune), n: null} : null],
      ])
    + sectiuneExtra("Rețea (2.5)", "mare_bun", [
        ["Sucursale", "unități fizice în România (Overture Maps)", locPe,
         r => r && r.sucursale ? numar(r.sucursale, "", "în România") : null],
        ["ATM-uri proprii", "bancomate proprii (acoperire parțială)", locPe,
         r => r && r.atm ? numar(r.atm, "", "în România") : null],
      ])
    + sectiuneExtra("Recenzii App Store (2.3)", "mare_bun", [
        ["Nota recenziilor scrise", "nota celor care au scris o recenzie — mai critică decât nota din store", sentPe,
         r => r && r.medie_text ? numar(r.medie_text, " ★", `${num(r.review_uri, 0)} recenzii`) : null],
        ["Recenzii negative", "cât la sută sunt de 1–2 stele (mai puțin = mai bine)", sentPe,
         r => (r && r.pct_negative !== null && r.pct_negative !== undefined)
           ? {t: num(r.pct_negative, 0) + "%", n: -Number(r.pct_negative), sub: "din recenziile citite"} : null],
      ]);

  const comparabile = bilant.castiga + bilant.pierde + bilant.mijloc;
  const f = o => `mergi('versus',${esc(JSON.stringify({banci: alese.join(","), arata, ...o}))})`;
  return `
  <div class="bara-fixa"><div class="filtre">
    <div class="vs-alege">
      <span class="gri" style="font-size:11.5px">Libra comparată cu</span>
      ${alese.map(b => `<span class="pill" style="font-size:12px">${esc(scurt(b))}</span>`).join(" ") || '<span class="gri">nicio bancă</span>'}
      <details class="vs-lista"><summary class="buton">Schimbă băncile</summary>
        <div class="vs-pop">
          <input class="cauta" placeholder="Caută bancă…" oninput="document.querySelectorAll('.vs-pop label').forEach(l=>l.style.display=l.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')">
          <div class="vs-opt">${toateBanci.filter(b => b !== referinta).map(b => `
            <label class="bifa"><input type="checkbox" value="${esc(b)}" ${alese.includes(b) ? "checked" : ""}
              onchange="limiteazaVersus()"> ${esc(M.nume[b] || b)}</label>`).join("")}</div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <span id="vs-cate" class="gri" style="font-size:12px">${alese.length} / 3 alese</span>
            <button class="primar" style="margin-left:auto" onclick="aplicaVersus()">Aplică</button>
          </div>
        </div>
      </details>
    </div>
    <div class="taburi" style="margin-left:auto">
      ${[["toate","Toate rândurile"],["pierde","Unde Libra nu e cea mai bună"],["castiga","Unde Libra e cea mai bună"]].map(([v, t]) =>
        `<button class="${v === arata ? "activ" : ""}" onclick="${f({arata: v})}">${t}</button>`).join("")}
    </div>
  </div></div>
  <div class="kpi">
    <div><div class="e">Libra e cea mai bună</div><div class="n" style="color:var(--ok)">${bilant.castiga}<span class="gri" style="font-size:15px"> / ${comparabile}</span></div>
      <div class="l">rânduri unde are cel mai bun preț sau cea mai bună cifră</div></div>
    <div><div class="e">Libra e la mijloc</div><div class="n">${bilant.mijloc}</div><div class="l">nici cea mai bună, nici cea mai slabă</div></div>
    <div><div class="e">Libra e cea mai slabă</div><div class="n" style="color:var(--warn)">${bilant.pierde}</div>
      <div class="l">rânduri unde toate celelalte stau mai bine</div></div>
    <div class="inactiv"><div class="e">Fără date la Libra</div><div class="n gri">${bilant.fara}</div>
      <div class="l">rânduri unde doar celelalte bănci au valoare</div></div>
  </div>
  ${sectiuni ? `<section class="vs" style="${grid}">
      <div class="vs-bara">
        <div class="vs-cap0">Caracteristică</div>
        ${coloane.map(b => cardVersus(b, M, appPe, locPe, acopPe, referinta)).join("")}
      </div>
      ${sectiuni}
      ${despre(`La prețuri și dobânzi, cifra e cât costă <b>de obicei</b> la banca respectivă (mediana,
        persoane fizice), nu oferta promoțională. Clic pe o valoare pentru toate valorile din spate, cu citat
        și link. Un gol nu înseamnă „zero": banca nu are documentul colectat sau serviciul nu există în
        oferta ei. Rețeaua vine din Overture Maps, cu ATM-uri acoperite parțial.`)}
    </section>` : `<section><p class="note">${arata === "toate" ? "Fără date pentru selecția curentă."
        : "Niciun rând pentru filtrul ales."}</p></section>`}`;
};

/* Cardul de sus: identitatea băncii + cifrele care există cu adevărat pentru ea */
function cardVersus(b, M, appPe, locPe, acopPe, referinta){
  const a = appPe[b], l = locPe[b], ac = acopPe[b];
  const cifre = [
    a && a.rating ? [`${num(a.rating, 2)} ★`, `App Store · ${num(a.volum, 0)} note`] : ["—", "fără date App Store"],
    l ? [num((l.sucursale || 0) + (l.atm || 0), 0), "locații proprii"] : ["—", "fără locații"],
    [num(ac ? ac.valori : 0, 0), "valori colectate"],
  ];
  return `<div class="vs-card ${b === referinta ? "ref" : ""}">
    ${b === referinta ? '<span class="vs-tag">referință</span>' : ""}
    <div class="vs-logo">${M.logo[b]
      ? `<img src="${esc(M.logo[b])}" alt="${esc(M.nume[b] || b)}">`
      : `<span class="vs-init">${esc((M.nume[b] || b).slice(0, 2).toUpperCase())}</span>`}</div>
    <div class="vs-nume"><a class="fisa" href="#/banca?b=${encodeURIComponent(b)}" title="fișa băncii"><span class="nm">${esc(M.nume[b] || b)}</span></a></div>
    <div class="vs-cifre">${cifre.map(([v, e]) => `<div><b>${v}</b><span>${esc(e)}</span></div>`).join("")}</div>
  </div>`;
}

/* maximum 3 bănci: după a treia, restul se dezactivează — nu mai tăiem în tăcere */
function limiteazaVersus(){
  const toate = [...document.querySelectorAll(".vs-opt input")];
  const n = toate.filter(x => x.checked).length;
  toate.forEach(x => { x.disabled = !x.checked && n >= 3; });
  const e = document.getElementById("vs-cate"); if(e) e.textContent = `${n} / 3 alese`;
}

/* ---------------- Istoric: ce s-a schimbat ----------------
   Revamp 25.09: erau 986 de carduri una sub alta (~58.000 px). Acum: filtre
   de perioadă, tip și ordine; rezumatul pe bancă se recalculează din ce e
   filtrat; schimbările grupate pe bancă, în tabel compact. */
R.istoric = async (stare) => {
  const bSel = stare.banca || "", dSel = stare.directie || "";
  const per = stare.perioada || "", tip = stare.tip || "", ord = stare.ordine || "recente";
  const [d, m] = await Promise.all([
    ia(`/api/istoric?banca=${encodeURIComponent(bSel)}&directie=${encodeURIComponent(dSel)}`),
    meta(),
  ]);
  const f = o => `mergi('istoric',${esc(JSON.stringify({banca: bSel, directie: dSel, perioada: per, tip, ordine: ord, ...o}))})`;
  const sel = (cheie, opt) => `<select onchange="${f({[cheie]: "__v"}).replace("&quot;__v&quot;", "this.value")}">${opt}</select>`;

  // filtrele de perioadă, tip și ordine se aplică aici: datele vin toate odată
  const prag = per ? new Date(Date.now() - Number(per) * 30.44 * 86400000).toISOString().slice(0, 10) : "";
  let randuri = d.randuri.filter(r => (!prag || String(r.data_noua).slice(0, 10) >= prag)
    && (!tip || (tip === "comisioane" ? r.unitate !== "procent" : r.unitate === "procent")));
  randuri.sort(ord === "mari"
    ? (a, b) => Math.abs(b.delta_pct || 0) - Math.abs(a.delta_pct || 0)
    : (a, b) => String(b.data_noua).localeCompare(String(a.data_noua)) || Math.abs(b.delta_pct || 0) - Math.abs(a.delta_pct || 0));

  // rezumatul pe bancă, din rândurile FILTRATE (înainte arăta totalul, orice filtru ai fi ales)
  const peBanca = {};
  randuri.forEach(r => { const x = peBanca[r.banca] = peBanca[r.banca] || {banca: r.banca, n: 0, sus: 0, jos: 0, rs: []};
                         x.n++; r.delta > 0 ? x.sus++ : x.jos++; x.rs.push(r); });
  const listaB = Object.values(peBanca).sort((a, b) => b.n - a.n);
  const datate = (d.acoperire || []).filter(x => x.stare !== "fără datare").reduce((s, x) => s + x.n, 0);
  const total = (d.acoperire || []).reduce((s, x) => s + x.n, 0);
  const u = r => unitTxt(r.unitate);
  const link = r => { const l = r.url_public || (String(r.sursa || "").startsWith("http") ? r.sursa : null);
                      return l ? `<a class="sursa" href="${esc(l)}" target="_blank" rel="noopener" title="${esc(r.citat || "")}">↗ sursa${r.pagina ? " p." + r.pagina : ""}</a>` : ""; };
  const tabelBanca = rs => tabel(rs, [
    {cap: "Serviciu", html: true, s: r => etNume(r.camp),
     val: r => `<b style="font-weight:500">${esc(etNume(r.camp))}</b><span class="sub">${esc((r.serviciu || "").slice(0, 90))}${(r.serviciu || "").length > 90 ? "…" : ""}</span>`},
    {cap: "Înainte", cls: "num", s: r => r.valoare_ant, val: r => `${num(r.valoare_ant)}${u(r)}`},
    {cap: "Acum", cls: "num", html: true, s: r => r.valoare_noua, val: r => `<b>${num(r.valoare_noua)}${u(r)}</b>`},
    {cap: "Schimbare", cls: "num", html: true, s: r => r.delta_pct,
     val: r => r.delta_pct === null ? `<span class="${r.delta > 0 ? "sus" : "jos"}">${r.delta > 0 ? "↑" : "↓"}</span>`
       : `<span class="${r.delta > 0 ? "sus" : "jos"}">${r.delta > 0 ? "↑" : "↓"} ${num(Math.abs(r.delta_pct), 0)}%</span>`},
    {cap: "De la → la", cls: "mono", s: r => String(r.data_noua),
     val: r => `${String(r.data_ant).slice(0, 10)} → ${String(r.data_noua).slice(0, 10)}`},
    {cap: "Sursă", html: true, val: link},
  ], {sort: true});

  return `
  <div class="bara-fixa"><div class="filtre">
    <label class="f">Bancă ${sel("banca", `<option value="">toate băncile</option>
      ${d.pe_banca.slice().sort((a, b) => (m.nume[a.banca] || a.banca).localeCompare(m.nume[b.banca] || b.banca, "ro"))
        .map(x => `<option value="${esc(x.banca)}" ${x.banca === bSel ? "selected" : ""}>${esc(m.nume[x.banca] || x.banca)} (${x.n})</option>`).join("")}`)}</label>
    <label class="f">Perioadă ${sel("perioada", [["","oricând"],["3","ultimele 3 luni"],["6","ultimele 6 luni"],["12","ultimul an"]]
      .map(([v, t]) => `<option value="${v}" ${v === per ? "selected" : ""}>${t}</option>`).join(""))}</label>
    <label class="f">Direcție ${sel("directie", [["","scumpiri și ieftiniri"],["scumpire","doar scumpiri"],["ieftinire","doar ieftiniri"]]
      .map(([v, t]) => `<option value="${v}" ${v === dSel ? "selected" : ""}>${t}</option>`).join(""))}</label>
    <label class="f">Tip ${sel("tip", [["","comisioane și dobânzi"],["comisioane","doar comisioane"],["dobanzi","doar dobânzi"]]
      .map(([v, t]) => `<option value="${v}" ${v === tip ? "selected" : ""}>${t}</option>`).join(""))}</label>
    <label class="f">Ordine ${sel("ordine", [["recente","cele mai recente"],["mari","cele mai mari schimbări"]]
      .map(([v, t]) => `<option value="${v}" ${v === ord ? "selected" : ""}>${t}</option>`).join(""))}</label>
    ${(bSel || dSel || per || tip || ord !== "recente") ? `<button onclick="mergi('istoric',{})">Șterge filtrele</button>` : ""}
  </div></div>
  <section>
    <h2>${num(randuri.length, 0)} schimbări de preț în filtrul curent</h2>
    ${listaB.length ? `<div class="tiles">${listaB.map(x => `
      <div class="tile" style="cursor:pointer;${x.banca === bSel ? "outline:2px solid var(--accent)" : ""}"
           onclick="${f({banca: x.banca === bSel ? "" : x.banca})}" title="clic: doar ${esc(m.nume[x.banca] || x.banca)}">
        <div style="font-weight:600;font-size:12.5px">${esc(m.nume[x.banca] || x.banca)}</div>
        <div class="n">${x.n}</div>
        <div class="l"><span class="sus">↑ ${x.sus} scumpiri</span> · <span class="jos">↓ ${x.jos} ieftiniri</span></div>
      </div>`).join("")}</div>` : ""}
    ${despre(`O schimbare = <b>același serviciu, la aceeași bancă, cu valoare diferită la două date de
      vigoare</b>. Data de vigoare e citită din textul fiecărui document („se aplică de la…"); se
      recalculează din observații, nimic introdus manual. Se poate calcula doar pe observațiile datate —
      ${num(datate, 0)} din ${num(total, 0)} (${Math.round(100 * datate / Math.max(total, 1))}%); paginile web nu
      declară o dată de vigoare.
      ${d.excluse_implauzibile ? `<br><b>${d.excluse_implauzibile}</b> schimbări cu valori peste pragul de plauzibilitate
        nu apar (ex. capital social citit ca comision); sunt în <a href="#/coada">Coada de verificare</a>.` : ""}`)}
  </section>
  ${listaB.length ? listaB.map((x, i) => `
    <details class="pliat" ${listaB.length <= 3 || i === 0 ? "open" : ""} style="margin-bottom:12px">
      <summary style="background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 16px">
        ${etichetaBanca(x.banca, m, {fisa: true})}
        <span class="mono gri" style="font-size:12px">${x.n} schimbări ·
          <span class="sus">↑ ${x.sus}</span> · <span class="jos">↓ ${x.jos}</span></span></summary>
      <section style="margin-top:6px">${tabelBanca(x.rs)}</section>
    </details>`).join("")
  : `<section><div class="gol-stare"><b>Nicio schimbare pentru filtrul curent</b>
      O schimbare are nevoie de același serviciu extras la două date de vigoare diferite.</div></section>`}`;
};

/* ---------------- Surse: guvernanță ----------------
   Revamp 25.09: tabel pe bancă (acoperire dintr-o privire), căutare după
   fișier, numele fișierului în loc de începutul adresei, paginare reală,
   motivul eșecului vizibil pe fiecare rând. */
R.surse = async (stare) => {
  const bSel = stare.banca || "", stSel = stare.stare || "", rSel = stare.rol || "";
  const qSel = stare.q || "", mSel = stare.motiv || "", off = Number(stare.offset || 0);
  const LIM = 50;
  const [d, m] = await Promise.all([
    ia(`/api/surse?limit=${LIM}&offset=${off}&banca=${encodeURIComponent(bSel)}&stare=${encodeURIComponent(stSel)}`
       + `&rol=${encodeURIComponent(rSel)}&q=${encodeURIComponent(qSel)}&motiv=${encodeURIComponent(mSel)}`),
    meta(),
  ]);
  const baza = {banca: bSel, stare: stSel, rol: rSel, q: qSel, motiv: mSel};
  const f = o => `mergi('surse',${esc(JSON.stringify({...baza, offset: "", ...o}))})`;
  const b = d.bilant;
  const cutie = (et, n, cheie, desc) => `
    <div class="tile" style="cursor:pointer;${stSel === cheie ? "outline:2px solid var(--accent)" : ""}" onclick="${f({stare: cheie})}">
      <div class="n">${num(n, 0)}</div>
      <div style="font-weight:600;font-size:12.5px;margin-top:2px">${esc(et)}</div>
      <div class="l">${esc(desc)}</div></div>`;
  const stareRand = r => r.observatii
    ? `<span class="pill ok">are date</span>`
    : r.status === "blocat" ? `<span class="pill amb" title="${esc(r.nota_extractie || "")}">site blocat</span>`
    : r.nota_extractie ? `<span class="pill amb" title="${esc(r.nota_extractie)}">${esc(r.nota_extractie.split(":")[0].slice(0, 40))}</span>`
    : '<span class="pill">neîncercată</span>';

  const peBanca = tabel(d.pe_banca, [
    {cap: "Bancă", html: true, s: r => r.nume, val: r => etichetaBanca(r.slug, m, {tag: true})},
    {cap: "Surse", cls: "num", s: r => r.total, val: r => num(r.total, 0)},
    {cap: "Cu date", cls: "num", html: true, s: r => r.cu_date, val: r => r.cu_date ? `<b>${num(r.cu_date, 0)}</b>` : '<span class="gri">0</span>'},
    {cap: "Încercate, fără date", cls: "num", s: r => r.incercate, val: r => num(r.incercate, 0)},
    {cap: "Neîncercate", cls: "num", s: r => r.neatinse, val: r => num(r.neatinse, 0)},
    {cap: "Acoperire", html: true, s: r => r.total ? r.cu_date / r.total : -1,
     val: r => r.total ? `<span class="stele-bar" style="width:110px" title="${Math.round(100 * r.cu_date / r.total)}% din surse au dat date">
         <span style="width:${100 * r.cu_date / r.total}%;background:var(--ok)"></span></span>
         <span class="mono gri" style="font-size:10.5px;margin-left:6px">${Math.round(100 * r.cu_date / r.total)}%</span>` : ""},
    {cap: "Stare", html: true, s: r => r.blocate ? 0 : r.cu_date ? 2 : 1,
     val: r => r.blocate ? '<span class="pill amb" title="site-ul refuză colectarea (robots.txt sau WAF); nu se forțează">site blocat</span>'
       : !r.total ? '<span class="pill">nicio sursă</span>' : r.cu_date ? '<span class="pill ok">colectată</span>' : '<span class="pill">fără date</span>'},
  ], {sort: true, lung: true, libra: r => r.slug,
      rand: r => ({cls: r.slug === bSel ? "ales" : "", clic: f({banca: r.slug === bSel ? "" : r.slug})})});

  return `
  <section>
    <div class="tiles">
      ${cutie("cu date", b.cu_date, "cu_date", "au produs cel puțin o valoare")}
      ${cutie("încercate, fără date", b.incercate, "incercate", "s-au rulat și n-au dat nimic — motivul e pe rând")}
      ${cutie("neîncercate", b.neatinse, "neatinse", "descoperite, încă nerulate")}
      ${cutie("toate", b.total, "", "fără filtru de stare")}
    </div>
    ${d.motive.length ? `<p class="note" style="margin-top:12px;max-width:none">De ce n-au dat date (clic = filtrează):
      ${d.motive.map(x => `<span class="pill amb" style="cursor:pointer;${x.motiv === mSel ? "outline:2px solid var(--warn)" : ""}"
        onclick="${f({motiv: x.motiv === mSel ? "" : x.motiv})}">${esc(x.motiv)}: ${num(x.n, 0)}</span>`).join(" ")}</p>` : ""}
  </section>
  <details class="pliat" ${bSel ? "" : "open"} style="margin-bottom:18px">
    <summary style="margin-bottom:10px"><h2>Pe bancă</h2><span class="note">toate cele 30 · clic pe rând = sursele băncii</span></summary>
    <section>${peBanca}</section>
  </details>
  <div class="bara-fixa"><div class="filtre">
    <label class="f">Caută fișier sau adresă
      <input class="cauta" value="${esc(qSel)}" placeholder="ex. T0014, tarife, depozite…"
             onkeydown="if(event.key==='Enter'){${f({q: "__v"}).replace("&quot;__v&quot;", "this.value")}}"></label>
    <label class="f">Bancă
      <select onchange="${f({banca: "__v"}).replace("&quot;__v&quot;", "this.value")}">
        <option value="">toate băncile</option>
        ${d.banci.map(x => `<option value="${esc(x.slug)}" ${x.slug === bSel ? "selected" : ""}>${esc(x.nume)} (${x.surse})</option>`).join("")}
      </select></label>
    <label class="f">Rol
      <select onchange="${f({rol: "__v"}).replace("&quot;__v&quot;", "this.value")}">
        ${[["","toate rolurile"],["produs","pagină de produs"],["conditii","document de tarife"],["hub","pagină de documente"],["locator","locator sucursale"],["context","context"]]
          .map(([v,t]) => `<option value="${v}" ${v === rSel ? "selected" : ""}>${t}</option>`).join("")}
      </select></label>
    ${(bSel || stSel || rSel || qSel || mSel) ? `<button onclick="mergi('surse',{})">Șterge filtrele</button>` : ""}
    <span class="note" style="margin-left:auto">${num(d.total, 0)} surse în filtrul curent</span>
  </div></div>
  <section>
    ${tabel(d.randuri, [
      {cap: "Bancă", html: true, val: r => etichetaBanca(r.banca, m)},
      {cap: "Fișier / pagină", html: true, val: r => {
        const link = r.url_public || (String(r.sursa || "").startsWith("http") ? r.sursa : null);
        const et = (r.fisier || "").length > 70 ? r.fisier.slice(0, 69) + "…" : r.fisier;
        const dom = String(r.sursa || "").replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
        return (link ? `<a class="sursa" href="${esc(link)}" target="_blank" rel="noopener" title="${esc(r.sursa)}">↗ ${esc(et)}</a>`
                     : `<span class="mono" style="font-size:11px" title="${esc(r.sursa)}">${esc(et)}</span>`)
          + `<span class="sub">${esc(dom)}</span>`;
      }},
      {cap: "Tip", cls: "mono", val: r => (r.format || r.tip_sursa || "").toUpperCase()},
      {cap: "Rol", k: "rol", cls: "mono"},
      {cap: "Valori", cls: "num", val: r => r.observatii ? num(r.observatii, 0) : "—"},
      {cap: "Stare", html: true, val: stareRand},
      {cap: "De ce", val: r => r.observatii ? "" : (r.nota_extractie || "").split(":").slice(-1)[0].trim().slice(0, 80) || "—"},
    ], {lung: true})}
    ${paginare(d.total, off, LIM, "surse", baza)}
  </section>`;
};

/* Motivele sunt cele reale din date. Cele două mari sunt pierderi de STRUCTURĂ
   la citirea tabelului din PDF, nu greșeli de citire a cifrei — de-aia
   valoarea se păstrează și așteaptă un om. */
const MOTIVE = {
  "antet de coloana pierdut":
    "Tabelul din PDF avea mai multe coloane — pachet Standard / Gold, sau persoane fizice / firme — și la extracție s-a pierdut cărei coloane aparține cifra. Prețul e citit corect, dar nu se știe pentru care variantă se aplică.",
  "prag de suma pierdut":
    "Comisionul e pe tranșe de sumă («1 leu până la 1.000 lei, 3 lei peste»). Tranșele s-au pierdut, deci avem 1, 3, 5 și 15 lei fără să știm de la ce sumă începe fiecare.",
  "sumă implauzibilă":
    "Peste pragul de preț de retail. De obicei e o limită de retragere sau un capital social, extrase ca și cum ar fi preț.",
  "procent implauzibil":
    "Peste pragul de dobândă reală. De obicei e o reducere procentuală («100% reducere») sau o cotă de garantare.",
  "extras de LLM: tipul și produsul de confirmat":
    "Cifra a fost citită de modelul de limbaj dintr-un rând pe care parserul nu l-a putut încadra. Cifra există literal în text; tipul ei și produsul trebuie confirmate de un om.",
  "încredere scăzută":
    "Parserul nu a fost sigur de citire. Valoarea poate fi corectă, dar nu se publică automat.",
  "validator: SUSPECT":
    "Validatorul de dobânzi a marcat valoarea ca suspectă (în afara intervalului obișnuit pentru produs).",
  "peste pragul de plauzibilitate":
    "Marcată la încărcare fiindcă depășește pragul categoriei ei, deci exclusă din comparații.",
  "ambiguu, motiv nenotat":
    "Sursa a marcat-o ambiguă fără să spună de ce.",
};
const MOTIV_SCURT = {
  "antet de coloana pierdut": "antet pierdut", "prag de suma pierdut": "prag de sumă",
  "sumă implauzibilă": "sumă mare", "procent implauzibil": "procent mare",
  "extras de LLM: tipul și produsul de confirmat": "citit de LLM",
  "încredere scăzută": "încredere mică", "validator: SUSPECT": "suspect",
};

/* ---------------- Coada de verificare ----------------
   Revamp 25.09: tabel bancă × motiv (cât e de verificat, dintr-o privire),
   explicația motivului o singură dată, rânduri pe o linie, paginare reală —
   înainte se vedeau doar primele 150 de rânduri din 5.263. */
R.coada = async (stare) => {
  const mSel = stare.motiv || "", bSel = stare.banca || "", pSel = stare.produs || "";
  const ctx = stare.context || "", off = Number(stare.offset || 0);
  const LIM = 100;
  const [d, m] = await Promise.all([
    ia(`/api/coada?limit=${LIM}&offset=${off}&motiv=${encodeURIComponent(mSel)}&banca=${encodeURIComponent(bSel)}`
       + `&produs=${encodeURIComponent(pSel)}&context=${ctx}`),
    meta(),
  ]);
  const baza = {motiv: mSel, banca: bSel, produs: pSel, context: ctx};
  const f = o => `mergi('coada',${esc(JSON.stringify({...baza, offset: "", ...o}))})`;
  const c = d.context;

  // matricea bancă × motiv
  const motive = d.pe_motiv.map(x => x.motiv);
  const mat = {};
  d.matrice.forEach(x => { const r = mat[x.banca] = mat[x.banca] || {banca: x.banca, nume: x.banca_nume, tot: 0};
                           r[x.motiv] = x.n; r.tot += x.n; });
  const randMat = Object.values(mat);
  const matrice = tabel(randMat, [
    {cap: "Bancă", html: true, s: r => r.nume, val: r => etichetaBanca(r.banca, m, {tag: true})},
    ...motive.map(mo => ({
      capHtml: `<span title="${esc(MOTIVE[mo] || mo)}">${esc(MOTIV_SCURT[mo] || mo)}</span>`, cls: "num", html: true,
      s: r => r[mo] || 0,
      td: r => r[mo] ? {cls: "mc" + (r.banca === bSel && mo === mSel ? " best" : ""),
                        attr: `onclick="${f({banca: r.banca, motiv: mo})}" title="${esc(r.nume)} · ${esc(mo)}"`} : {cls: "gol"},
      val: r => r[mo] ? `<b>${num(r[mo], 0)}</b>` : "·",
    })),
    {cap: "Total", cls: "num", html: true, s: r => r.tot, val: r => `<b>${num(r.tot, 0)}</b>`,
     td: r => ({cls: "mc", attr: `onclick="${f({banca: r.banca, motiv: ""})}"`})},
  ], {sort: true, lung: true, libra: r => r.banca, implicit: [motive.length + 1, "desc"]});

  // rânduri grupate pe (bancă, serviciu), fiecare valoare pe o linie
  const g = new Map();
  d.randuri.forEach(r => { const k = `${r.banca}|${r.camp}|${r.serviciu || ""}`;
                           if(!g.has(k)) g.set(k, []); g.get(k).push(r); });
  const grupe = [...g].map(([, rs]) => {
    const r0 = rs[0];
    const frati = d.fratii[`${r0.banca}|${r0.camp}|${r0.serviciu}`];
    const inCoada = new Set(rs.map(x => x.valoare_num));
    return `<details class="g" ${g.size <= 12 ? "open" : ""}>
      <summary><span class="gn">${esc(r0.serviciu || etNume(r0.camp))}
          <span class="sub">${esc(r0.banca_nume || r0.banca)} · ${esc(etNume(r0.camp))} · ${esc(r0.produs || "")}</span></span>
        <span class="gi"></span><span class="gc">${rs.length} de verificat</span></summary>
      ${frati && frati.n > 1 ? `<div class="serie"><span class="et">Toate valorile băncii la acest serviciu:</span>
        ${frati.valori.map(v => `<span class="v ${inCoada.has(v) ? "aici" : ""}" title="${inCoada.has(v) ? "în coadă" : "trece porțile de calitate"}"
          >${num(v)}${unitTxt(r0.unitate)}</span>`).join("")}
        ${frati.n > frati.valori.length ? `<span class="et">+${frati.n - frati.valori.length}</span>` : ""}</div>` : ""}
      ${rs.map(r => `<div class="r" onclick="if(!event.target.closest('a'))this.classList.toggle('des')">
        <div class="rv">${num(r.valoare_num)}${unitTxt(r.unitate)}</div>
        <div class="rc">${citatUtil(r) ? citatEvidentiat(r) : '<span class="gri" style="font-style:italic">citatul e doar cifra — verifică în document</span>'}
          ${!mSel ? `<span class="pill amb" title="${esc(MOTIVE[r.motiv] || "")}">${esc(MOTIV_SCURT[r.motiv] || r.motiv)}</span>` : ""}
          ${r.confidence !== null && r.confidence < 0.7 ? `<span class="pill">încredere ${num(r.confidence)}</span>` : ""}</div>
        <div class="rs">${linkSursa(r)}</div>
        <div class="rx"><div class="meta"><span class="pill">${esc(r.metoda_extractie || "?")}</span>
          <span class="pill">${esc(r.motiv)}</span></div></div>
      </div>`).join("")}
    </details>`;
  }).join("");

  return `
  <section>
    <div class="callout warn"><b>Nimic de aici nu apare în comparații.</b>
      ${num(c.in_coada, 0)} din ${num(c.observatii_total, 0)} valori
      (${(100 * c.in_coada / Math.max(c.observatii_total, 1)).toFixed(1)}%) sunt extrase din documente reale, dar nu
      trec porțile de calitate; toate au link la documentul sursă. Rămân aici până le vede un om.</div>
  </section>
  <details class="pliat" ${bSel || mSel ? "" : "open"} style="margin-bottom:18px">
    <summary style="margin-bottom:10px"><h2>Cât e de verificat, pe bancă și motiv</h2>
      <span class="note">clic pe o cifră = rândurile respective</span></summary>
    <section>${matrice}
      ${despre(motive.map(mo => `<b>${esc(MOTIV_SCURT[mo] || mo)}</b> — ${esc(MOTIVE[mo] || mo)}`).join("<br>"), "Ce înseamnă fiecare motiv")}</section>
  </details>
  <div class="bara-fixa"><div class="filtre">
    <label class="f">Motiv
      <select onchange="${f({motiv: "__v"}).replace("&quot;__v&quot;", "this.value")}">
        <option value="">toate motivele</option>
        ${d.pe_motiv.map(x => `<option value="${esc(x.motiv)}" ${x.motiv === mSel ? "selected" : ""}>${esc(MOTIV_SCURT[x.motiv] || x.motiv)} (${x.n})</option>`).join("")}
      </select></label>
    <label class="f">Bancă
      <select onchange="${f({banca: "__v"}).replace("&quot;__v&quot;", "this.value")}">
        <option value="">toate băncile</option>
        ${d.pe_banca.slice().sort((a, b) => (a.banca_nume || a.banca).localeCompare(b.banca_nume || b.banca, "ro"))
          .map(x => `<option value="${esc(x.banca)}" ${x.banca === bSel ? "selected" : ""}>${esc(x.banca_nume || x.banca)} (${x.n})</option>`).join("")}
      </select></label>
    <label class="f">Produs
      <select onchange="${f({produs: "__v"}).replace("&quot;__v&quot;", "this.value")}">
        <option value="">toate produsele</option>
        ${d.pe_produs.map(x => `<option value="${esc(x.produs)}" ${x.produs === pSel ? "selected" : ""}>${esc(x.produs)} (${x.n})</option>`).join("")}
      </select></label>
    <label class="bifa"><input type="checkbox" ${ctx ? "checked" : ""} onchange="${f({context: "__v"}).replace("&quot;__v&quot;", "this.checked?'1':''")}">
      doar unde citatul are context</label>
    ${(mSel || bSel || pSel || ctx) ? `<button onclick="mergi('coada',{})">Șterge filtrele</button>` : ""}
    <span class="note" style="margin-left:auto">${num(d.total, 0)} rânduri în filtrul curent</span>
  </div></div>
  ${mSel ? `<div class="callout" style="margin-bottom:14px"><b>${esc(mSel)}.</b> ${esc(MOTIVE[mSel] || "")}</div>` : ""}
  <section>
    ${grupe || '<div class="gol-stare"><b>Coada e goală pentru filtrul curent</b>Nimic de verificat aici.</div>'}
    ${paginare(d.total, off, LIM, "coada", baza)}
  </section>`;
};

/* ---------------- router ---------------- */
function meniu(activ){
  document.getElementById("meniu").innerHTML = PAGINI.map(g => `
    <h3>${esc(g.grup)}</h3>
    ${g.chei.map(p => `<a href="#/${p.id}" class="${p.id === activ ? "activ" : ""}">
        ${esc(p.nume)}${p.pdf ? `<span class="pdf">${p.pdf}</span>` : ""}</a>`).join("")}`).join("");
  // Piciorul barei spune cât e în bază, nu un slogan. Se cere o dată pe sesiune.
  if(!CACHE.picior){
    CACHE.picior = ia("/api/sumar").then(s => {
      const g = c => (s.totaluri.find(x => x.ce === c) || {}).n || 0;
      return `${num(g("bănci"), 0)} bănci · ${num(g("surse"), 0)} surse<br>`
           + `${num(g("observații"), 0)} valori colectate`;
    }).catch(() => "");
  }
  CACHE.picior.then(t => { const e = document.getElementById("picior"); if(e) e.innerHTML = t; });
}
const toatePag = PAGINI.flatMap(g => g.chei);

function mergi(id, stare = {}){
  const q = new URLSearchParams(stare).toString();
  location.hash = `#/${id}${q ? "?" + q : ""}`;
}
function aplicaVersus(){
  const sel = [...document.querySelectorAll(".vs-opt input:checked")].map(o => o.value).slice(0, 3);
  const arata = new URLSearchParams(location.hash.split("?")[1] || "").get("arata") || "toate";
  mergi("versus", {banci: sel.join(","), arata});
}

async function randeaza(){
  const brut = location.hash.replace(/^#\/?/, "") || "overview";
  const [id, qs] = brut.split("?");
  const stare = Object.fromEntries(new URLSearchParams(qs || ""));
  if(id === "sentiment"){                      // pagina 2.7 s-a mutat în 2.3
    const q = new URLSearchParams(qs || ""); q.set("la", "recenzii");
    location.replace(`#/mobil?${q}`); return;
  }
  const p = toatePag.find(x => x.id === id) || toatePag[0];
  meniu(p.id);
  document.getElementById("titlu").textContent = p.t;
  document.getElementById("lede").textContent = p.l;
  const gazda = document.getElementById("pagina");
  /* Aceeași pagină, alt filtru: conținutul vechi rămâne (estompat) până vine
     cel nou și derularea se păstrează. Înainte, orice filtru golea pagina și
     sărea sus — pe Sentiment, după fiecare clic derulai din nou 4 ecrane. */
  const principal = document.querySelector("main");
  const aceeasi = randeaza.ultima === p.id;
  const sus = aceeasi ? principal.scrollTop : 0;
  randeaza.ultima = p.id;
  if(aceeasi) gazda.style.opacity = ".45";
  else gazda.innerHTML = '<section><p class="note">se încarcă…</p></section>';
  try{
    gazda.innerHTML = await R[p.id](stare);
  }catch(e){
    gazda.innerHTML = `<section><p class="note" style="color:var(--warn)">Eroare: ${esc(e.message)}</p></section>`;
  }
  gazda.style.opacity = "";
  const bara = gazda.querySelector(".bara-fixa");
  principal.style.setProperty("--sub-bara", (bara ? Math.max(bara.offsetHeight - 26, 0) : -26) + "px");
  principal.scrollTop = sus;
  const tinta = stare.la && document.getElementById(stare.la);
  if(tinta && !aceeasi) tinta.scrollIntoView();
  else if(tinta && tinta.getBoundingClientRect().top > principal.clientHeight) tinta.scrollIntoView();
}
window.addEventListener("hashchange", randeaza);
randeaza();
</script>

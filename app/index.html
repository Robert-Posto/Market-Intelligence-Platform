<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Command Center · Libra Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    /* paleta: fildeș cald + vișiniu profund, aceeași familie în bară și în pagini */
    --bg:#f5f1ec; --surface:#fffdfa; --ink:#2a1f22; --muted:#6e615d; --line:#e3dad0;
    --line-2:#d6cabd;
    --warn:#98550b; --warn-tint:#f8ead6; --ok:#2b7044; --ok-tint:#e5efe1; --aur:#b58a2c;
    --accent:#7a1e2c; --accent-tint:#f5e8e6; --on-accent:#fffdfa;
    --umbra:0 1px 2px rgba(74,32,36,.05);
    /* bara laterală: vișiniu cu gradient vertical discret, text crem cald;
       pagina activă pe fundalul paginii, ca vârful să intre în conținut;
       piciorul în aceeași familie, puțin mai închis, sub o linie fină.
       Spațierile verticale ale barei sunt în clamp() cu vh, ca tot meniul să
       încapă fără derulare la 720–900px înălțime. */
    --nav:#6e1a28; --nav-2:#561420; --nav-ink:#f6ece6; --nav-slab:#e6c9b5;
    --nav-line:rgba(246,236,230,.14); --nav-hover:rgba(246,236,230,.08);
    --marca:#7a1e2c; --nav-activ-bg:var(--bg); --nav-activ-ink:#5a1622;
    --nav-footer:rgba(28,6,11,.22); --nav-footer-ink:#dcc3bb;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1517; --surface:#251d1f; --ink:#efe6e2; --muted:#b4a5a0; --line:#3a2e30;
          --line-2:#4a3b3d;
          --warn:#e3a95a; --warn-tint:#3a2a16; --ok:#7fcb97; --ok-tint:#1d3024; --aur:#dcb567;
          --accent:#e7a3ab; --accent-tint:#3b2428; --on-accent:#2a1216;
          --umbra:none;
          --nav:#4e1520; --nav-2:#3a0f18; --marca:#e7a3ab; --nav-activ-ink:#f2d7d3;}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:flex}
  a{color:var(--accent)}

  /* ---- navigație ---- */
  /* ---- bara laterală ----
     Direcția F — bloc plin pe roșul Libra, text alb, titlu tipografic mare;
     grupurile au etichete mono, în majuscule; pagina activă se inversează
     (fundal crem, text bleumarin) cu un colț tăiat spre conținut; piciorul
     stă pe o bandă bleumarin, lipit jos. Fiecare spațiere verticală e
     clamp(minim la 720px înălțime, vh, maxim la 900px), ca antetul + cele
     12 linkuri + piciorul să încapă fără derulare pe orice laptop uzual. */
  nav{width:266px;flex:none;background:linear-gradient(180deg,var(--nav) 0%,var(--nav-2) 100%);color:var(--nav-ink);
      padding:0;overflow:auto;height:100%;display:flex;flex-direction:column}
  nav .marca{padding:clamp(16px,2.2vh,20px) 22px clamp(13px,1.8vh,16px);
             border-bottom:1px solid var(--nav-line)}
  nav .marca .t{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(19px,2.6vh,24px);
                line-height:1.1;font-weight:700;color:var(--nav-ink);display:block;letter-spacing:-.01em}
  nav .marca .t i{color:var(--nav-slab);font-style:italic;font-weight:600}
  nav .marca .s{display:block;margin-top:clamp(7px,1vh,9px);font-family:"IBM Plex Mono",monospace;
                font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
                color:var(--nav-slab);opacity:.8}
  nav h3{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
         letter-spacing:.12em;color:var(--nav-ink);font-weight:600;
         margin:clamp(10px,1.4vh,13px) 0 clamp(4px,0.6vh,5px);padding:0 22px;opacity:.62}
  nav a{display:flex;align-items:center;padding:clamp(5px,0.7vh,6px) 42px clamp(5px,0.7vh,6px) 22px;
        color:var(--nav-ink);text-decoration:none;font-size:13px;font-weight:500;position:relative}
  nav a:hover{background:var(--nav-hover);color:var(--nav-ink)}
  nav a:focus-visible{outline:2px solid var(--nav-slab);outline-offset:-2px}
  nav a.activ,nav a.activ:hover{background:var(--nav-activ-bg);color:var(--nav-activ-ink);font-weight:600;
              clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
  nav a .pdf,nav a .gol{position:absolute;right:20px;top:50%;transform:translateY(-50%);
                        font-family:"IBM Plex Mono",monospace;font-size:10px}
  nav a .pdf{color:var(--nav-slab);opacity:.75}
  nav a.activ .pdf{color:var(--marca);opacity:1}
  nav a .gol{color:#f0d3a8}
  nav .picior{margin-top:auto;padding:clamp(10px,1.4vh,13px) 22px clamp(11px,1.5vh,14px);
              background:var(--nav-footer);border-top:1px solid var(--nav-line);font-family:"IBM Plex Mono",monospace;font-size:9.5px;
              line-height:1.6;color:var(--nav-footer-ink)}

  /* ---- conținut ---- */
  main{flex:1;min-width:0;overflow:auto;height:100%;padding:26px 30px 60px}
  .cap{margin-bottom:20px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-size:26px;margin:0 0 5px}
  .lede{color:var(--muted);font-size:13.5px;max-width:78ch;margin:0}
  section{background:var(--surface);border:1px solid var(--line);border-radius:13px;
          padding:18px 20px;margin-bottom:18px;box-shadow:var(--umbra)}
  h2{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:0 0 12px}
  h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
     font-family:"IBM Plex Mono",monospace;font-weight:500;margin:18px 0 8px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;
     letter-spacing:.03em;color:var(--muted);font-weight:500;position:sticky;top:0;
     background:var(--surface);z-index:1}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;
                font-family:"IBM Plex Mono",monospace}
  .mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
  .wrap{overflow:auto;max-height:70vh}

  .filtre{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
  select,input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line-2);
               border-radius:7px;background:var(--bg);color:var(--ink);min-width:140px}
  button{font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;
         border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  button:hover{border-color:var(--muted)}
  button.primar{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button:disabled{opacity:.55;cursor:not-allowed}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
  .tile{border:1px solid var(--line);border-radius:10px;padding:13px}
  .tile .n{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500}
  .tile .l{color:var(--muted);font-size:11.5px;margin-top:2px}

  /* celulă de comparație: valoarea, la ce se aplică, câte variante mai sunt */
  .celula{cursor:pointer;border-radius:6px;display:block;padding:4px 6px;text-align:right;
          position:relative;min-width:104px}
  .celula:hover{background:var(--accent-tint);outline:1px solid var(--accent)}
  .celula.gol{color:var(--muted);cursor:default;text-align:center}
  .celula.gol:hover{background:none;outline:none}
  .v-pref{display:block;color:var(--muted);font-size:9.5px;line-height:1.2}
  .v-gratis{color:var(--ok);opacity:.85}
  .v-num{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500;white-space:nowrap}
  .v-ctx{display:block;color:var(--muted);font-size:10px;line-height:1.3;margin-top:1px;
         font-weight:400;max-width:15ch;margin-left:auto;overflow-wrap:anywhere}
  .v-n{position:absolute;left:5px;top:4px;color:var(--muted);font-size:9.5px;
       font-family:"IBM Plex Mono",monospace;border:1px solid var(--line);
       border-radius:999px;padding:0 4px;line-height:1.45}
  .cap-nume{display:block;font-size:12px}
  .cap-desc{display:block;font-weight:400;font-size:10px;color:var(--muted);
            line-height:1.35;margin-top:2px;max-width:17ch;white-space:normal}
  .cap-slug{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;
            color:var(--muted);opacity:.65;margin-top:3px;font-weight:400}

  /* ---- Versus: carduri fixe sus, apoi caracteristici grupate ---- */
  .vs{overflow-x:auto}
  .vs-bara{display:grid;grid-template-columns:var(--vsc);
           background:var(--bg);border-bottom:1px solid var(--line);align-items:stretch}
  .vs-cap0{padding:12px 10px;display:flex;align-items:flex-end;font-size:11.5px;
           color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
  .vs-card{border-left:1px solid var(--line);padding:12px 11px 11px;position:relative;
           display:flex;flex-direction:column;gap:2px}
  .vs-card.ref{background:var(--accent-tint)}
  .vs-tag{position:absolute;right:9px;top:9px;font-size:9px;text-transform:uppercase;
          letter-spacing:.04em;color:var(--accent);border:1px solid var(--accent);
          border-radius:999px;padding:1px 6px}
  .vs-logo{height:30px;display:flex;align-items:center;margin-bottom:5px}
  .vs-logo img{max-height:30px;max-width:104px;object-fit:contain}
  .vs-init{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;
           color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
  .vs-nume{font-size:13.5px;font-weight:600;line-height:1.25}
  .vs-slug{font-size:10px;color:var(--muted)}
  .vs-cifre{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .vs-cifre b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;display:block}
  .vs-cifre span{display:block;font-size:9.5px;color:var(--muted);line-height:1.3}

  .vs-sec{margin-top:16px}
  .vs-sec-cap{display:grid;grid-template-columns:var(--vsc);align-items:end;
              background:var(--surface);border-radius:8px 8px 0 0;border:1px solid var(--line);
              border-bottom:none}
  .vs-sec-cap .t{font-family:"Source Serif 4",Georgia,serif;font-size:15px;padding:9px 10px}
  .vs-sec-cap .t span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
                      color:var(--muted);margin-top:2px}
  .vs-sec-cap .c{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
                 padding:9px 8px;text-align:right;border-left:1px solid var(--line)}
  .vs-sec-cap .c.ref{color:var(--accent);font-weight:600}
  .vs-rand{display:grid;grid-template-columns:var(--vsc);border:1px solid var(--line);
           border-top:none;align-items:center}
  .vs-rand.alt{background:var(--surface)}
  .vs-rand:last-child{border-radius:0 0 8px 8px}
  .vs-lab{padding:9px 10px;min-width:0}
  .vs-lab b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
  .vs-lab span{display:block;font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:2px}
  .vs-lab em{display:block;font-size:9.5px;color:var(--warn);font-style:normal;margin-top:3px}
  .vs-cel{padding:7px 8px;border-left:1px solid var(--line);text-align:right;min-width:0}
  .vs-cel .celula{min-width:0;padding:2px 3px}
  .vs-cel.gol{color:var(--muted);text-align:center;font-size:12px}
  @media (max-width:760px){ .vs-cifre{display:none} }
  /* revamp: secțiuni pliabile, capul secțiunii fix la derulare, fără derulare orizontală */
  .vs{overflow:visible}
  details.vs-sec > summary{list-style:none;cursor:pointer;position:sticky;top:var(--sub-bara,40px);z-index:4}
  details.vs-sec > summary::-webkit-details-marker{display:none}
  details.vs-sec > summary .t::before{content:"▾ ";color:var(--muted);font-size:11px}
  details.vs-sec:not([open]) > summary .t::before{content:"▸ "}
  details.vs-sec:not([open]) > summary .vs-sec-cap{border-bottom:1px solid var(--line);border-radius:8px}
  .best .v-num, td.mc.best b{font-weight:700;color:var(--ink)}
  .best .v-num::before, td.mc.best b::before{content:"★ ";color:var(--aur);font-size:.9em}
  .vs-bun, .eticheta-best{display:inline-block;margin-top:4px;padding:1px 7px;border-radius:999px;
          background:var(--accent);color:var(--on-accent);font:600 9px "IBM Plex Sans",sans-serif;
          text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  /* Libra e cea mai slabă pe rând: fără fundal, o etichetă cu contur — pereche
     cu „cea mai bună" (plină). Fundalul bej-gălbui de înainte păta tabelul. */
  .vs-cel.pierde::after{content:"cea mai slabă";display:block;width:max-content;margin:4px 0 0 auto;
          padding:0 7px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);
          font:600 9px "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.04em}
  .vs-alege{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative}
  details.vs-lista > summary{list-style:none}
  details.vs-lista > summary::-webkit-details-marker{display:none}
  summary.buton{display:inline-block;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;
                border:1px solid var(--line);background:var(--surface)}
  .vs-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;background:var(--surface);
          border:1px solid var(--line);border-radius:11px;padding:12px;width:340px;
          box-shadow:0 8px 28px rgba(58,22,28,.16)}
  .vs-opt{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}

  .cl-banca{display:flex;align-items:center;gap:8px;min-width:0}
  .cl-banca img{max-height:18px;max-width:54px;object-fit:contain;flex:none}
  .cl-banca .nm{font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;hyphens:auto}
  /* 2.3 Aplicații: multe coloane fac numele băncii să se rupă pe 2-3 rânduri */
  .apl-tabel table.t td:first-child .cl-banca{min-width:190px}

  /* Avertisment care nu se poate sări cu privirea. Folosit acolo unde o cifră
     corect calculată poate fi înțeleasă greșit — media textelor de review, de
     exemplu, care e cu 2,6 stele sub media reală a aplicației. */
  .callout{border:1px solid var(--ok);border-left-width:4px;border-radius:9px;
           padding:11px 14px;font-size:12.5px;line-height:1.6;background:var(--ok-tint)}
  .callout.warn{border-color:var(--warn);background:var(--warn-tint)}
  .callout b{color:var(--ink)}

  /* ---- Sentiment: review-uri filtrabile ---- */
  .rec{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
  .rec-cap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .rec-stele{font-size:13px;letter-spacing:1px}
  .rec-stele.bun{color:var(--ok)} .rec-stele.rau{color:var(--warn)}
  .rec-txt{font-size:12.5px;line-height:1.6}
  .rec-cap .nm, table.t .pill{white-space:nowrap}
  .rec-meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}

  .sus{color:var(--warn);font-weight:600}
  .jos{color:var(--ok);font-weight:600}

  /* sertar: valorile grupate pe serviciul dat de bancă */
  .grup-serv{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
  .grup-serv > .cap{background:var(--surface-2,var(--surface));padding:8px 11px;
                    border-bottom:1px solid var(--line);display:flex;gap:8px;
                    align-items:baseline;justify-content:space-between}
  .grup-serv > .cap b{font-size:12.5px;font-weight:600}
  .obs{display:flex;gap:10px;align-items:baseline;padding:8px 11px;font-size:12px;
       border-top:1px solid var(--line)}
  .obs:first-of-type{border-top:none}
  .obs .val{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
            min-width:88px;text-align:right;flex:none}
  .obs .det{flex:1;min-width:0}
  .obs .cit{color:var(--muted);font-size:11px;line-height:1.5;margin-top:3px;
            border-left:2px solid var(--line);padding-left:7px}
  .obs .cit mark{background:var(--warn-tint);color:var(--ink);font-weight:600;
                 padding:0 2px;border-radius:2px}
  /* Când citatul nu adaugă nimic peste cifră, se arată unde e în document,
     nu se repetă cifra sub ea ca și cum ar fi o dovadă. */
  .obs .cit.fara{border-left-style:dotted;font-style:italic;opacity:.9}
  .obs .val .x{font-family:"IBM Plex Mono",monospace;font-size:10px;
               color:var(--muted);margin-left:4px;font-weight:400}
  /* Ce trebuie să facă omul cu rândul — scris lângă rând, nu într-un tooltip */
  .obs .ce-faci{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px;
                font-style:italic}
  /* Seria de valori a aceluiași serviciu: cele din coadă marcate */
  .serie{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 11px;
         background:var(--bg);border-bottom:1px solid var(--line);font-size:11px}
  .serie .et{color:var(--muted)}
  .serie .v{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 6px;
            border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .serie .v.aici{border-color:var(--warn);background:var(--warn-tint);
                 color:var(--warn);font-weight:600}
  .obs .meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .obs.amb{background:var(--warn-tint)}
  a.sursa{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent);
          text-decoration:none;border-bottom:1px dotted var(--accent)}
  a.sursa:hover{background:var(--accent-tint)}
  /* Pagina băncii nu e documentul: culoare diferită și linie punctată mai
     slabă, ca să nu fie citită ca dovadă directă. */
  a.sursa.pagina{color:var(--muted);border-bottom-style:dashed;border-bottom-color:var(--line)}
  a.sursa.pagina:hover{color:var(--accent);background:var(--accent-tint)}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;
        font-family:"IBM Plex Mono",monospace;border:1px solid var(--line)}
  .pill.amb{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
  .pill.ok{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
  .pill.mock{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
  .note{color:var(--muted);font-size:12px;line-height:1.55;max-width:80ch}
  .gol-stare{border:1px dashed var(--line);border-radius:11px;padding:22px;text-align:center;
             color:var(--muted);font-size:13px}
  .gol-stare b{color:var(--ink);display:block;margin-bottom:5px;font-size:14px}

  /* sertar cu dovezile din spatele unei celule */
  #sertar{position:fixed;inset:0;background:rgba(40,14,20,.40);display:none;z-index:50}
  #sertar.deschis{display:block}
  #sertar .panou{position:absolute;right:0;top:0;bottom:0;width:min(640px,94vw);
                 background:var(--surface);border-left:1px solid var(--line);
                 padding:20px 22px;overflow:auto}
  #sertar h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:0 0 3px}
  #sertar .x{position:absolute;right:16px;top:14px}

  /* ================= revamp 25.09: tipare comune =================
     Aceeași rețetă pe fiecare pagină: rezumat sus, filtre fixe, un tabel
     compact (sortabil, Libra fixată), detaliile pliate. */

  /* bara de filtre rămâne sus la derulare (derulează <main>, nu documentul) */
  .bara-fixa{position:sticky;top:-26px;z-index:8;background:var(--bg);
             margin:-6px -30px 14px;padding:12px 30px 10px;border-bottom:1px solid var(--line)}
  .bara-fixa .filtre{margin:0}
  .taburi{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;
          background:var(--surface)}
  .taburi button{border:0;border-radius:0;border-right:1px solid var(--line-2);background:none;
                 padding:7px 13px;font-size:12.5px}
  .taburi button:last-child{border-right:0}
  .taburi button.activ{background:var(--accent);color:var(--on-accent);font-weight:600}

  /* secțiune pliabilă (Rulări, detalii tehnice, grupe) */
  details.pliat > summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px}
  details.pliat > summary::-webkit-details-marker{display:none}
  details.pliat > summary::before{content:"▸";color:var(--muted);font-size:12px;width:10px}

  /* Rulări manuale (Overview): rularea curentă, bara scurs/estimat, jurnalul live */

  /* tabel sortabil; rândul Libra fixat și evidențiat */

             letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);

  /* matrice bancă × serviciu: celula = câte prețuri, intervalul, gratuite */

  /* distribuția pe stele: o bară stivuită 5★ → 1★ */

  /* cifre-cheie sus */

  .kpi .n{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:500;line-height:1.1}

  /* sertar: rezumat + căutare + grupe pliate + rânduri pe o linie */

  /* 2.4 (revamp 30.09): comutatorul de secțiuni, banda de cifre cu băncile ca „chips”,

  .cm-banda{display:flex;gap:10px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);
            border-radius:12px;padding:9px 16px;margin-bottom:14px;box-shadow:var(--umbra)}
  .cm-cifre{display:flex;gap:20px;flex:none}

  button.cm-chip{padding:2px 9px;font-size:12px;line-height:1.5;border-radius:999px;background:var(--bg);
                 display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}

            text-overflow:ellipsis;vertical-align:bottom;font-size:12.5px}

  @media (max-width:900px){ body{flex-direction:column} nav{width:auto;height:auto;border-bottom:1px solid var(--nav-line)} main{height:auto} }
  /* Produse & prețuri: comparația cu Libra */

                 background:var(--surface);color:var(--ink);white-space:nowrap}

/* ---------------- helpers ---------------- */
/* Tabelul comun. Opțiuni:
     sort: true          antet clicabil = sortare (coloana are `s: r => valoare`)
     libra: r => slug    rândul Libra se evidențiază și rămâne primul la sortare
     rand: r => {cls, clic}  clasă și acțiune pe rând
     lung: true          fără derulare internă (tabelul își ia înălțimea)
     implicit: [i, "desc"]  sortarea de la încărcare */
function tabel(randuri, coloane, opt = {}){
  if(!randuri || !randuri.length) return '<p class="note">Nimic de afișat.</p>';
  const th = coloane.map((c, i) => {
    const sortabil = opt.sort && c.s;
    const cls = [c.cls || "", sortabil ? "sort" : "",
                 opt.implicit && opt.implicit[0] === i ? opt.implicit[1] : ""].join(" ");
    return `<th class="${cls}"${c.titlu ? ` title="${esc(c.titlu)}"` : ""}`
      + (sortabil ? ` onclick="sorteaza(this)"` : "") + `>` + (c.capHtml || esc(c.cap)) + "</th>";
  }).join("");
  let lista = randuri.slice();
  if(opt.implicit && coloane[opt.implicit[0]] && coloane[opt.implicit[0]].s){
    const c = coloane[opt.implicit[0]], sens = opt.implicit[1] === "asc" ? 1 : -1;
    lista.sort((a, b) => compara(c.s(a), c.s(b)) * sens);
  }
  if(opt.libra) lista.sort((a, b) => (opt.libra(b) === "libra") - (opt.libra(a) === "libra"));
  const tr = lista.map(r => {
    const e = opt.rand ? (opt.rand(r) || {}) : {};
    const libra = opt.libra && opt.libra(r) === "libra";
    const cls = [libra ? "libra fix" : "", e.cls || "", e.clic ? "clic" : ""].join(" ").trim();
    return `<tr${cls ? ` class="${cls}"` : ""}${e.clic ? ` onclick="${e.clic}"` : ""}`
      + (e.cauta !== undefined ? ` data-cauta="${esc(String(e.cauta).toLowerCase())}"` : "")
      + (e.attr ? " " + e.attr : "") + ">"
      + coloane.map(c => {
        const v = c.val ? c.val(r) : r[c.k];
        const s = c.s ? c.s(r) : null;
        const ds = s === null || s === undefined || (typeof s === "number" && isNaN(s)) ? "" : ` data-s="${esc(s)}"`;
        const x = c.td ? (c.td(r) || {}) : {};      // clasă și atribute pe celulă (clic, titlu)
        return `<td class="${[c.cls || "", x.cls || ""].join(" ").trim()}"${ds}${x.attr ? " " + x.attr : ""}>`
          + `${c.html ? (v ?? "") : esc(v ?? "—")}</td>`;
      }).join("") + "</tr>";
  }).join("");
  return `<div class="wrap${opt.lung ? " lung" : ""}"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}

/* numerele ca numere, textul alfabetic în română; golurile la coadă */
function compara(a, b){
  const gol = x => x === null || x === undefined || x === "";
  if(gol(a) && gol(b)) return 0;
  if(gol(a)) return 1;
  if(gol(b)) return -1;
  const na = Number(a), nb = Number(b);
  if(!isNaN(na) && !isNaN(nb)) return na - nb;
  return String(a).localeCompare(String(b), "ro");
}

/* Sortare la clic pe antet: primul clic descrescător (cifrele mari sus),
   al doilea crescător. Rândul Libra rămâne primul. Golurile rămân jos. */
function sorteaza(th){
  const tabelEl = th.closest("table"), i = [...th.parentNode.children].indexOf(th);
  const sens = th.classList.contains("desc") ? "asc" : "desc";
  tabelEl.querySelectorAll("th").forEach(x => x.classList.remove("asc", "desc"));
  th.classList.add(sens);
  const tb = tabelEl.tBodies[0];
  const rows = [...tb.rows];
  const val = r => { const c = r.cells[i]; return c && c.dataset.s !== undefined ? c.dataset.s : ""; };
  rows.sort((a, b) => {
    const fa = a.classList.contains("fix"), fb = b.classList.contains("fix");
    if(fa !== fb) return fa ? -1 : 1;
    const va = val(a), vb = val(b);
    if(va === "" || vb === "") return compara(va, vb);
    return compara(va, vb) * (sens === "asc" ? 1 : -1);
  });
  rows.forEach(r => tb.appendChild(r));
}

/* distribuția pe stele [5★, 4★, 3★, 2★, 1★] ca bară stivuită */
function bareStele(dist, latime = 140){
  const d = (dist || []).map(Number), tot = d.reduce((s, x) => s + x, 0);
  if(!tot) return '<span class="gri">—</span>';
  const culori = ["var(--ok)", "#7fb893", "var(--muted)", "#d9a441", "var(--warn)"];
  const titlu = d.map((x, i) => `${5 - i}★: ${num(x, 0)} (${Math.round(100 * x / tot)}%)`).join(" · ");
  return `<span class="stele-bar" style="width:${latime}px" title="${esc(titlu)}">${d.map((x, i) =>
    `<span style="width:${100 * x / tot}%;background:${culori[i]}"></span>`).join("")}</span>`;
}

/* paginare: butoane de pagină care schimbă doar `offset` din starea paginii */
function paginare(total, offset, limit, pagina, stare){
  const n = Math.ceil(total / limit);
  if(n <= 1) return "";
  const cur = Math.floor(offset / limit);
  const mergiLa = k => `mergi('${pagina}',${esc(JSON.stringify({...stare, offset: String(k * limit)}))})`;
  const idx = [...new Set([0, cur - 2, cur - 1, cur, cur + 1, cur + 2, n - 1])].filter(k => k >= 0 && k < n).sort((a, b) => a - b);
  let prev = -1, html = "";
  for(const k of idx){
    if(k - prev > 1) html += "<span>…</span>";
    html += `<button class="${k === cur ? "activ" : ""}" onclick="${mergiLa(k)}">${k + 1}</button>`;
    prev = k;
  }
  return `<div class="pagini"><span>${num(offset + 1, 0)}–${num(Math.min(offset + limit, total), 0)} din ${num(total, 0)}</span>
    ${cur > 0 ? `<button onclick="${mergiLa(cur - 1)}">‹ înapoi</button>` : ""}${html}
    ${cur < n - 1 ? `<button onclick="${mergiLa(cur + 1)}">înainte ›</button>` : ""}</div>`;
}

/* vârsta unei date: verde sub 7 zile, fără culoare până la 30, portocaliu peste */
function varsta(t){
  if(!t) return '<span class="pill">fără dată</span>';
  const z = Math.floor((Date.now() - new Date(t)) / 86400000);
  if(z <= 0) return '<span class="pill ok">azi</span>';
  const txt = `acum ${z} ${z === 1 ? "zi" : "zile"}`;
  return z < 7 ? `<span class="pill ok">${txt}</span>` : z > 30 ? `<span class="pill amb">${txt}</span>` : `<span class="pill">${txt}</span>`;
}

function unitTxt(u){ return UNITATE_TXT[u] !== undefined ? UNITATE_TXT[u] : (u ? " " + u : ""); }

/* Frecvențele din date sunt text liber în română („lunar", „pe operațiune",
   dar și termene de depozit: „5 ani"). Nu le traducem într-un „/lună" care ar
   putea minți la termene — le arătăm cum sunt, după separator. */
function contextScurt(c, maxLen = 26){
  const p = [];
  if(c.frecventa) p.push(c.frecventa);
  if(c.serviciu){
    const s = c.serviciu.length > maxLen ? c.serviciu.slice(0, maxLen - 1) + "…" : c.serviciu;
    p.push(s);
  }
  if(c.conditie) p.push(c.conditie.length > maxLen ? c.conditie.slice(0, maxLen - 1) + "…" : c.conditie);
  return p.join(" · ");
}

/* Cifra afișată e mediana valorilor din bancă, nu minimul: la minim, 80% din
   celule arătau „0 lei", fiindcă fiecare bancă are cel puțin o variantă
   gratuită. Mediana e cât costă de obicei și se poate compara. */
function valoareCelula(c, sens, unitate){
  if(!c) return null;
  const v = c.valoare !== undefined && c.valoare !== null
    ? c.valoare : (sens === "mare_bun" ? c.maxim : c.minim);
  const multe = c.n > 1 && c.minim !== c.maxim;
  const ctx = contextScurt(c);
  const extr = sens === "mare_bun"
    ? `cea mai mare: ${num(c.maxim)}${unitTxt(unitate || c.unitate)}`
    : `cea mai mică: ${num(c.minim)}${unitTxt(unitate || c.unitate)}`;
  return (multe ? `<span class="v-pref">de obicei</span>` : "")
       + `<span class="v-num">${num(v)}${unitTxt(unitate || c.unitate)}</span>`
       + (ctx ? `<span class="v-ctx">${esc(ctx)}</span>` : "")
       + (c.gratuite ? `<span class="v-ctx v-gratis">${c.gratuite} ${c.gratuite === 1 ? "variantă gratuită" : "variante gratuite"}</span>` : "")
       + (c.n > 1 ? `<span class="v-n" title="${c.n} valori sub această etichetă; afișată e mediana. ${extr}">+${c.n - 1}</span>` : "");
}

   Erau denumite „agregat store" și „medie text" — termeni care nu spun nimic
   cuiva care deschide pagina prima dată, iar diferența dintre ele (până la 2,6
   stele) făcea cifrele să pară contradictorii. */
const DOUA_NOTE = `
<div class="callout warn" style="margin-bottom:14px">
  <b>Nota din App Store</b> — nota oficială a aplicației, calculată de Apple din
  <i>toate</i> voturile, inclusiv de la cei care dau doar stele. Vine din API-ul
  Apple, nu e calculată de noi.<br>
  <b>Nota recenziilor scrise</b> — media recenziilor <i>cu text</i> de pe pagina publică

</div>`;

/* ---------------- sertar cu dovezi ----------------
   Grupat pe `serviciu` — numele dat de bancă, nu conceptul canonic. Un tabel
   plat de 40 de rânduri nu răspundea la „7,5 lei pentru ce?"; grupat pe
   serviciu, se vede că aceeași etichetă acoperă mai multe prețuri (pachete,
   praguri, monede) și care e care. */
/* Citatul cu cifra evidențiată în el.
   Evidențierea în PDF depinde de vizualizator (vezi `linkSursa`), deci dovada
   trebuie să fie lizibilă AICI, fără să deschizi documentul. Se marchează
   exact numărul observației, nu o potrivire aproximativă: dacă nu se
   regăsește în citat, citatul rămâne neatins. */
function citatEvidentiat(r){
  const t = r.citat.length > 260 ? r.citat.slice(0, 259) + "…" : r.citat;
  // sertarul trimite `valoare`, coada de verificare trimite `valoare_num`
  const bruta = r.valoare !== undefined && r.valoare !== null ? r.valoare : r.valoare_num;
  if(bruta === null || bruta === undefined) return esc(t);
  // se caută atât „20" cât și „20,00" / „20.00", fără să se lege de zecimale
  const v = Number(bruta);
  const forme = [...new Set([String(v), v.toFixed(2), v.toFixed(2).replace(".", ",")])];
  for(const f of forme){
    const i = t.indexOf(f);
    // marginile trebuie să nu fie cifre, ca „20" să nu se marcheze în „2024"
    if(i < 0) continue;
    const inainte = i > 0 ? t[i-1] : " ", dupa = t[i+f.length] || " ";
    if(/[0-9]/.test(inainte) || /[0-9.,]/.test(dupa)) continue;
    return esc(t.slice(0, i)) + "<mark>" + esc(f) + "</mark>" + esc(t.slice(i + f.length));
  }
  return esc(t);
}

/* Citatul merită arătat doar dacă spune ceva în plus față de cifră.
   Măsurat: la 2.378 de rânduri din PDF, `citat` e literalmente valoarea
   („0 lei"), deci sub cifră apărea aceeași cifră, ca și cum ar fi o dovadă.
   Nu e. Acolo se arată secțiunea din document, care chiar localizează. */
function citatUtil(r){
  const c = (r.citat || "").trim();
  if(!c) return null;
  const doarCifra = /^[0-9][0-9.,\s]*(lei|euro|eur|usd|ron|%)?$/i.test(c);
  return doarCifra ? null : c;
}

/* Trei nivele de dovadă, arătate diferit — fiindcă nu sunt același lucru și nu
   trebuie să pară:

     ↗ document   linkul duce la cifra însăși (PDF-ul exact sau pagina web)
     ⌂ pagină     pagina de pe care banca publică documentul. Afirmația „se
                  publică aici" e verificabilă, dar NU e documentul
     (fără link)  rămâne numele fișierului și pagina din PDF

   De ce nu toate au link direct: pachetul sursă reține calea locală a PDF-ului,
   nu URL-ul de descărcare, iar PDF-urile nu sunt incluse. Din 40 de URL-uri de
   PDF descoperite, 9 s-au potrivit exact. Un link greșit ar trimite la alt
   document decât cifra, adică opusul unei dovezi. */
function linkSursa(r){
  /* Catalogul intern Libra (migrarea 022): un fișier Excel primit, fără URL.
     Fără ramura asta apărea „⌂ pagina băncii" (pagina de comisioane Libra),
     care NU e sursa cifrei — cifra vine din exportul intern. */
  if(r.metoda_extractie === "catalog"){
    return `<span class="pill" title="Din catalogul intern de produse (export Sales Command Center), nu de pe web. Citatul e textul exact din coloana „Caracteristicile produsului”.">catalog intern · ${esc(r.fisier || r.sursa)}</span>`;
  }
  const pg = r.pagina ? ` p.${r.pagina}` : "";
  const scurta = s => { const t = String(s || "").replace(/^https?:\/\/(www\.)?/, "");
                        return t.length > 44 ? t.slice(0, 43) + "…" : t; };
  if(r.link){
    /* La PDF se deschide vizualizatorul PROPRIU, nu fișierul brut.
       Motivul e măsurat, nu preferință: parametrii de deschidere ai Adobe
       (`#page=`, `search=`) sunt implementați de plugin-ul clasic Acrobat, care
       nu mai există în Chrome. Extensia Adobe pentru Chrome încarcă PDF-ul în
       pagina ei și pierde fragmentul, deci nu sare nici la pagină. Chrome cu
       vizualizatorul propriu sare la pagină dar ignoră `search=`. Singurul mod
       în care ruta la locul exact merge la toată lumea e să randăm noi
       documentul. Originalul rămâne la un clic, în capul vizualizatorului.

       La paginile web nu e nevoie: `#:~:text=` (Text Fragments) e suportat de
       Chrome, Edge, Safari 16.1+ și Firefox 131+. */
    if(r.tip_sursa === "document"){
      const u = `/pdf.html?u=${encodeURIComponent(r.link)}`
              + `&p=${r.pagina || 1}&q=${encodeURIComponent(r.citat || "")}`;
      return `<a class="sursa" href="${esc(u)}" target="_blank" rel="noopener"
                title="Deschide documentul la pagina ${r.pagina || 1}, cu citatul evidențiat. Randat de aplicație, deci merge indiferent ce cititor de PDF ai instalat."
                >↗ ${esc(scurta(r.fisier || r.sursa))}${pg} ⤷</a>`;
    }
    return `<a class="sursa" href="${esc(r.link)}${esc(r.ancora || "")}" target="_blank" rel="noopener"
              title="Deschide pagina la fraza exactă și o evidențiază — ${esc(r.link)}"
              >↗ ${esc(scurta(r.sursa))}${r.ancora ? " ⤷" : ""}</a>`;
  }
  const fisier = `<span class="pill" title="Numele documentului din care vine cifra. URL-ul de descărcare nu e înregistrat în pachetul sursă, iar PDF-ul nu e inclus — fișierul și pagina rămân verificabile manual.">${esc(scurta(r.fisier || r.sursa))}${pg}</span>`;
  if(r.link_pagina){
    return fisier + ` <a class="sursa pagina" href="${esc(r.link_pagina)}" target="_blank" rel="noopener"
      title="NU e documentul exact. E pagina de pe care banca publică lista de tarife — de aici se poate descărca versiunea curentă. Aleasă automat: ${esc(r.pagina_documente_motiv || "")}"
      >⌂ pagina băncii</a>`;
  }
  return fisier;
}

/* `scenariu` = categoria (depozite / credite / conturi_carduri). Obligatoriu la
   dobânzi: `nominala` e și dobândă de depozit și dobândă de credit, iar fără
   filtru sertarul deschis din celula de depozit ar arăta și credite. */
/* ---------------- sertarul, refăcut pe 25.09 ----------------
   Era câte un card mare pe fiecare valoare, toate deschise: BCR · Administrare
   cont = 316 valori în 38 de grupe, ~31.000 px de derulat. Acum:
     - rezumat sus (interval, câte variante, câte gratuite), fix la derulare
     - căutare în valori, ascunderea variantelor „retrase din ofertă"
     - grupele pliate, ordonate de la cea mai ieftină
     - o valoare = un rând; citatul și detaliile la clic pe rând
   Dovada nu dispare: fiecare rând are linkul, citatul e la un clic. */
const SERTAR = {date: [], unitate: "", camp: "", cauta: "", ascundeRetrase: true, ordine: "pret"};
const RE_RETRAS = /retras[ăae]? din ofert|nu mai (sunt|este) disponibil/i;

async function deschideSertar(banca, camp, unitate, scenariu, extra = {}){
  const s = document.getElementById("sertar");
  s.classList.add("deschis");
  const m = await meta();
  document.getElementById("sertar-t").textContent = `${m.nume[banca] || banca} · ${etNume(camp)}`;
  document.getElementById("sertar-s").innerHTML = '<p class="note">se încarcă…</p>';
  document.getElementById("sertar-c").innerHTML = "";
  try{
    const d = await ia(`/api/celula?banca=${encodeURIComponent(banca)}&camp=${encodeURIComponent(camp)}`
      + `&unitate=${encodeURIComponent(unitate || "")}&scenariu=${encodeURIComponent(scenariu || "")}`
      + `&termen=${encodeURIComponent(extra.termen || "")}&produs=${encodeURIComponent(extra.produs || "")}`);
    Object.assign(SERTAR, {date: d, unitate, camp, cauta: ""});
    randeazaSertar(true);
  }catch(e){ document.getElementById("sertar-s").textContent = "Eroare: " + e.message; }
}

function randeazaSertar(capNou){
  const {date, camp} = SERTAR;
  const retrase = date.filter(r => RE_RETRAS.test([r.serviciu, r.conditie, r.detaliu, r.sectiune].join(" ")));
  const t = SERTAR.cauta.trim().toLowerCase();
  const vizibile = date.filter(r => !(SERTAR.ascundeRetrase && retrase.includes(r)))
    .filter(r => !t || [r.serviciu, r.conditie, r.frecventa, r.detaliu, r.citat, r.sectiune,
                        r.valoare === null ? r.valoare_text : num(r.valoare)]
                        .join(" ").toLowerCase().includes(t));
  const u = r => unitTxt(r.unitate || SERTAR.unitate);

  if(capNou){
    const vals = date.filter(r => !r.ambiguu && r.valoare !== null).map(r => r.valoare);
    const nServ = new Set(date.map(r => r.serviciu || "")).size;
    const gratuite = date.filter(r => !r.ambiguu && r.valoare === 0).length;
    const amb = date.filter(r => r.ambiguu).length;
    const cuLink = date.filter(r => r.link).length;
    document.getElementById("sertar-s").innerHTML = `
      ${etDesc(camp) ? `<div class="note" style="margin:2px 0 0">${esc(etDesc(camp))}</div>` : ""}
      <div class="s-rez">
        ${vals.length ? `<div><b>${num(Math.min(...vals))} – ${num(Math.max(...vals))}${u(date[0])}</b> <span>de la cel mai mic la cel mai mare</span></div>` : ""}
        <div><b>${nServ}</b> <span>${nServ === 1 ? "variantă" : "variante"} de serviciu</span></div>
        <div><b>${date.length}</b> <span>valori</span></div>
        ${gratuite ? `<div><b style="color:var(--ok)">${gratuite}</b> <span>gratuite</span></div>` : ""}
        ${amb ? `<div><b style="color:var(--warn)">${amb}</b> <span>de verificat (nu intră în comparații)</span></div>` : ""}
        <div><b>${cuLink}</b> <span>cu link la sursă</span></div>
      </div>
      <div class="s-bara">
        <input class="cauta" id="s-cauta" placeholder="Caută: pachet, sumă, condiție…"
               oninput="SERTAR.cauta=this.value;randeazaSertar()">
        ${retrase.length ? `<label class="bifa"><input type="checkbox" ${SERTAR.ascundeRetrase ? "checked" : ""}
            onchange="SERTAR.ascundeRetrase=this.checked;randeazaSertar()">
            ascunde ${retrase.length} ieșite din ofertă</label>` : ""}
        <select onchange="SERTAR.ordine=this.value;randeazaSertar()" style="min-width:0" title="ordinea grupelor">
          <option value="pret" ${SERTAR.ordine === "pret" ? "selected" : ""}>cel mai ieftin întâi</option>
          <option value="nume" ${SERTAR.ordine === "nume" ? "selected" : ""}>după nume</option>
          <option value="multe" ${SERTAR.ordine === "multe" ? "selected" : ""}>cele mai multe valori</option>
        </select>
        <button onclick="const d=[...document.querySelectorAll('#sertar-c details.g')],o=!d.every(x=>x.open);d.forEach(x=>x.open=o)">Deschide / închide tot</button>
      </div>`;
  }

  const grupuri = new Map();
  vizibile.forEach(r => {
    const k = r.serviciu || "(fără nume de serviciu în sursă)";
    if(!grupuri.has(k)) grupuri.set(k, []);
    grupuri.get(k).push(r);
  });
  const minG = rs => { const v = rs.filter(r => r.valoare !== null && !r.ambiguu).map(r => r.valoare);
                       return v.length ? Math.min(...v) : Infinity; };
  const lista = [...grupuri].sort((a, b) =>
    SERTAR.ordine === "nume" ? a[0].localeCompare(b[0], "ro")
    : SERTAR.ordine === "multe" ? b[1].length - a[1].length
    : (minG(a[1]) - minG(b[1])) || a[0].localeCompare(b[0], "ro"));
  // puține grupe, sau o căutare activă: deschise; altfel pliate, cu intervalul la vedere
  const deschise = lista.length <= 3 || !!t;
  document.getElementById("sertar-c").innerHTML = lista.length ? lista.map(([serv, rs]) => {
    rs.sort((a, b) => (a.ambiguu - b.ambiguu) || compara(a.valoare, b.valoare));
    const v = rs.filter(r => r.valoare !== null && !r.ambiguu).map(r => r.valoare);
    const interval = !v.length ? "—" : Math.min(...v) === Math.max(...v)
      ? `${num(v[0])}${u(rs[0])}` : `${num(Math.min(...v))} – ${num(Math.max(...v))}${u(rs[0])}`;
    const sec = rs.find(r => r.sectiune);
    return `<details class="g" ${deschise ? "open" : ""}>
      <summary><span class="gn">${esc(serv)}${sec ? `<span class="sub">${esc(sec.sectiune)}</span>` : ""}</span>
        <span class="gi">${interval}</span>
        <span class="gc">${rs.length} ${rs.length === 1 ? "valoare" : "valori"}</span></summary>
      ${rs.map(randSertar).join("")}
    </details>`;
  }).join("") : '<p class="note">Nicio valoare pentru căutarea curentă.</p>';
}

/* O valoare pe un rând: cifra · la ce se aplică · sursa. Citatul și
   pastilele tehnice apar la clic pe rând (dovada rămâne la un clic). */
function randSertar(r){
  const val = r.valoare !== null && r.valoare !== undefined
    ? `${num(r.valoare)}${unitTxt(r.unitate)}` : esc(r.valoare_text || "—");
  const ctx = [r.frecventa ? `<b>${esc(r.frecventa)}</b>` : "", esc(r.conditie || ""), esc(r.detaliu || "")]
    .filter(Boolean).join(" · ");
  const scen = (r.cod_scenariu || "").split("|").filter(Boolean);
  const cit = citatUtil(r);
  return `<div class="r" onclick="if(!event.target.closest('a'))this.classList.toggle('des')">
    <div class="rv" ${r.ambiguu ? 'style="color:var(--warn)"' : ""}>${val}${r.nr_aparitii > 1
      ? `<span class="mono gri" style="font-size:10px" title="aceeași valoare, în ${r.nr_aparitii} coloane ale tabelului"> ×${r.nr_aparitii}</span>` : ""}</div>
    <div class="rc">${ctx || '<span class="gri">fără condiții în sursă</span>'}
      ${r.ambiguu ? `<span class="pill amb" title="${esc(MOTIVE[r.motiv_ambiguu] || "")}">de verificat</span>` : ""}
      <span class="ind">${cit ? "❝ citat" : "detalii"} ▾</span></div>
    <div class="rs">${linkSursa(r)}</div>
    <div class="rx">
      ${cit ? `<div class="cit">${citatEvidentiat(r)}</div>`
            : `<div class="cit" style="border-left-style:dotted;font-style:italic">${r.sectiune
                ? "În document, la secțiunea <b>" + esc(r.sectiune) + "</b>." : "Documentul nu dă niciun text în jurul cifrei."}</div>`}
      <div class="meta">
        <span class="pill" title="cu ce variantă de colectare a fost extrasă">${esc(r.metoda_extractie || "?")}</span>
        ${scen.map(x => `<span class="pill">${esc(x)}</span>`).join("")}
        ${r.ambiguu ? `<span class="pill amb">${esc(r.motiv_ambiguu || "ambiguu")}</span>` : ""}
        ${r.confidence < 0.7 ? `<span class="pill amb">încredere ${num(r.confidence)}</span>` : ""}
      </div>
    </div>
  </div>`;
}

/* sertar cu conținut oarecare (capturi din store, de exemplu) */
function deschideSertarHtml(titlu, sub, html){
  document.getElementById("sertar").classList.add("deschis");
  document.getElementById("sertar-t").textContent = titlu;
  document.getElementById("sertar-s").innerHTML = sub ? `<p class="note" style="margin:4px 0 0">${sub}</p>` : "";
  document.getElementById("sertar-c").innerHTML = html;
}
function inchideSertar(){ document.getElementById("sertar").classList.remove("deschis"); }
document.getElementById("sertar").onclick = e => { if(e.target.id === "sertar") inchideSertar(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") inchideSertar(); });

  RL.d = rl; RL.m = m;
  // 2.4: campaniile active de pe site-uri (colectorul din 30.09), plus conturile sociale

    ${card("2.4", "Campanii & marketing", num(active.length, 0), `campanii active pe site-urile băncilor, plus ${num(conturi.length, 0)} conturi sociale și reclamele Google și Bing`, new Set(active.map(x => x.banca)).size, (cmp.rulare || {}).campanii || null, "#/campanii")}
    ${card("2.5", "Rețea", num(c.locatii, 0), "sucursale și ATM-uri pe hartă", cate("locatii"), c.locatii_la, "#/retea")}
    ${card("2.6", "Context de piață", num(c.indici, 0), "valori ROBOR, ROBID, IRCC de la BNR", null, c.indici_la, "#/context")}
    ${card("", "Istoric de prețuri", num(c.schimbari, 0), "schimbări de preț între versiunile documentelor", null, null, "#/istoric")}
  </div>
  <details class="pliat" style="margin-bottom:18px">
    <summary style="margin-bottom:10px"><h2>Ce avem pe fiecare bancă <span class="note">toate cele 30 de bănci · clic pentru tabel</span></h2></summary>
    <section>
      <p class="note" style="margin:0 0 10px">Câte valori avem în fiecare categorie. Un gol la o bancă <b>blocată</b>
        nu e o scăpare: site-ul refuză colectarea automată și nu forțăm. Clic pe nume pentru fișa băncii.</p>
      ${tabel(pb, [
        {cap: "Bancă", html: true, s: r => r.nume, val: r => etichetaBanca(r.slug, m, {fisa: true, tag: true})},
        {cap: "Comisioane", cls: "num", html: true, s: r => r.comisioane, val: r => celula(r.comisioane)},
        {cap: "Dobânzi", cls: "num", html: true, s: r => r.dobanzi, val: r => celula(r.dobanzi)},
        {cap: "Aplicație", cls: "num", html: true, s: r => r.rating, val: r => r.rating ? `${num(r.rating)} ★` : '<span class="gri">—</span>'},

        {cap: "Colectare", html: true, s: r => r.blocate ? 0 : r.comisioane + r.dobanzi ? 2 : 1,
         val: r => r.blocate && !(r.comisioane + r.dobanzi) ? '<span class="pill amb" title="robots.txt sau WAF refuză colectarea; nu se forțează">site blocat</span>'
           : r.blocate ? '<span class="pill amb" title="o parte din site refuză colectarea; ce e permis s-a colectat">parțial blocat</span>'
           : r.comisioane + r.dobanzi ? '<span class="pill ok">are date</span>' : '<span class="pill">fără prețuri</span>'},
      ], {sort: true, lung: true, libra: r => r.slug, implicit: [1, "desc"]})}
    </section>
  </details>
  <details class="pliat" style="margin-bottom:18px">
    <summary style="margin-bottom:10px"><h2>Detalii tehnice: tabelele din bază</h2></summary>
    <section>
      ${tabel(st, [
        {cap: "Domeniu", k: "domeniu"},
        {cap: "Rânduri", cls: "num", val: r => num(r.randuri, 0)},
        {cap: "Ultima actualizare", html: true, val: r => r.ultima ? varsta(r.ultima)
          : r.randuri ? '<span class="pill">fără dată în tabel</span>' : '<span class="pill amb">gol</span>'},
        {cap: "Proveniență", k: "provenienta", cls: "mono"},
      ], {lung: true})}
    </section>
  </details>
  <details class="pliat" id="rulari"${rl.curenta ? " open" : ""}>
    <summary style="margin-bottom:10px"><h2>Rulări manuale ${rl.activ
      ? '<span class="pill ok">pornite pe acest laptop</span>' : '<span class="pill">oprite pe acest server</span>'}</h2></summary>
    <section id="rl-corp">${rulariCorp(rl)}</section>
  </details>`;
};

/* ---------------- Rulări manuale (Overview) ----------------
   Scripturile de colectare care ar rula automat, pornite la cerere. Doar pe
   laptopul cu MIP_PERMITE_RULARI=1 în .env; altfel butoanele rămân
   dezactivate. Lista e fixă, pe server (app/rulari.py): din pagină pleacă
   doar id-ul comenzii și, unde se poate, banca. Un singur proces odată. */
const RL = {d: null, m: null, t: null};

function rlDurata(s){
  if(s === null || s === undefined) return "—";
  s = Math.round(s);
  if(s < 60) return `${s} s`;
  if(s < 3600) return `${Math.round(s / 60)} min`;
  const h = Math.floor(s / 3600), mn = Math.round((s % 3600) / 60);
  return `${h} h${mn ? " " + mn + " min" : ""}`;
}
const rlOra = t => t ? new Date(t).toLocaleString("ro-RO", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "—";
const rlNumeBanca = b => (RL.m && RL.m.nume[b]) || b;

/* estimarea pentru banca aleasă: mediana ei din istoric, altfel cea pe orice bancă */
function rlEst(c, banca){
  if(!banca) return c.estimare_s ?? c.estimare_banca_s;
  return (c.estimari_banca || {})[banca] ?? c.estimare_banca_s;
}
function rlEstHtml(c, banca){
  const s = rlEst(c, banca);
  const peBanca = !!banca || c.estimare_s === undefined;
  const masurat = peBanca ? (c.estimari_banca || {})[banca] !== undefined || c.estimare_banca_sursa === "istoric"
                          : c.estimare_sursa === "istoric";
  return `~${rlDurata(s)}${!banca && peBanca ? " / bancă" : ""}<span class="sub">${masurat ? "mediana rulărilor de aici" : "estimare inițială"}</span>`;
}
function rlEstimare(id){
  const c = RL.d.comenzi.find(x => x.id === id), sel = document.getElementById("rl-b-" + id);
  document.getElementById("rl-e-" + id).innerHTML = rlEstHtml(c, sel ? sel.value : "");
}

function rlUltima(u){
  if(!u) return '<span class="gri">niciodată din Overview</span>';
  const rez = u.oprit ? '<span class="pill amb">oprită</span>'
    : u.cod === 0 ? '<span class="pill ok">reușită</span>'
    : u.cod === null ? '<span class="pill" title="serverul a fost repornit în timpul rulării">cod necunoscut</span>'
    : `<span class="pill amb">eroare (cod ${esc(u.cod)})</span>`;
  const coada = (u.ultimele || []).join("\n");
  return `<span title="${esc(coada)}">${rlOra(u.sfarsit)} · ${rlDurata(u.durata_s)}${u.banca ? " · " + esc(rlNumeBanca(u.banca)) : ""}</span> ${rez}`;
}

function rlCurenta(cur){
  const est = cur.estimare_s || 0, p = est ? cur.scurs_s / est : 0;
  const peste = p > 1;
  return `<div class="rl-curenta" id="rl-curenta">
    <div class="rl-cap"><b>Rulează: ${esc(cur.nume)}${cur.banca ? " · " + esc(rlNumeBanca(cur.banca)) : ""}</b>
      <span class="note">pornită la ${rlOra(cur.inceput)}${cur.dupa_repornire ? " (înainte de repornirea serverului)" : ""}</span>
      <span style="margin-left:auto"><button onclick="rlOpreste()"${cur.oprit ? " disabled" : ""}>${cur.oprit ? "Se oprește…" : "Oprește"}</button></span></div>
    <div class="rl-bara${peste ? " peste" : ""}"><i style="width:${Math.min(100, Math.round(p * 100))}%"></i></div>
    <div class="note">${rlDurata(cur.scurs_s)} din ~${rlDurata(est)} estimate${peste ? " · <b>peste estimare</b>: durata depinde de site-uri și de pauzele din robots.txt" : ""}
      · jurnal: <span class="mono">loguri/rulari/${esc(cur.log)}</span></div>
    <pre class="rl-jurnal" id="rl-jurnal">${esc((cur.jurnal || []).join("\n")) || "se pornește…"}</pre>
  </div>`;
}

function rulariCorp(d){
  if(!d || d.eroare) return `<p class="note" style="color:var(--warn)">Starea rulărilor nu s-a putut citi: ${esc(d && d.eroare)}</p>`;
  const blocat = !d.activ || !!d.curenta;
  const banci = (d.banci || []).slice().sort((a, b) => rlNumeBanca(a).localeCompare(rlNumeBanca(b), "ro"));
  const selector = c => !c.banca ? '<span class="gri">—</span>' : `
    <select id="rl-b-${esc(c.id)}" onchange="rlEstimare('${esc(c.id)}')"${d.activ ? "" : " disabled"}>
      <option value="">${c.banca === "obligatoriu" ? "alege banca…" : "toate băncile"}</option>
      ${banci.map(b => `<option value="${esc(b)}">${esc(rlNumeBanca(b))}</option>`).join("")}
    </select>`;
  return `
    ${d.activ ? "" : `<div class="callout warn" style="margin-bottom:14px"><b>Rulările manuale sunt oprite pe acest server (MIP_PERMITE_RULARI).</b>
      Se pot porni doar de pe laptopul pe care <span class="mono">.env</span> are <span class="mono">MIP_PERMITE_RULARI=1</span>;
      aici aplicația rămâne doar-citire.</div>`}
    ${d.curenta ? rlCurenta(d.curenta) : ""}
    <p class="note" style="margin:0 0 10px">Scripturile de colectare care ar rula automat, pornite de mână. Lista e fixă;
      se alege cel mult banca. Rulează un singur script odată, cu aceleași reguli ca din terminal (robots.txt, pauze,
      fără ocolirea blocajelor), iar rezerva LLM a prețurilor folosește doar răspunsurile deja plătite.</p>
    <div class="wrap lung"><table class="t rl"><thead><tr>
      <th>Ce rulează</th><th>Rețea</th><th>Bancă</th><th class="num">Durează</th><th>Ultima rulare</th><th></th>
    </tr></thead><tbody>
    ${d.comenzi.map(c => `<tr>
      <td><b>${esc(c.nume)}</b><span class="sub" style="max-width:62ch">${esc(c.ce)}</span></td>
      <td class="rl-n">${c.internet ? '<span class="pill amb">face cereri pe internet</span>' : '<span class="pill ok">fără internet</span>'}</td>
      <td>${selector(c)}</td>
      <td class="num rl-n" id="rl-e-${esc(c.id)}">${rlEstHtml(c, "")}</td>
      <td class="rl-u">${rlUltima(c.ultima)}</td>
      <td><button class="primar" onclick="rlPorneste('${esc(c.id)}')"${blocat ? " disabled" : ""}>Rulează</button></td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

async function rlPost(u, corp){
  const r = await fetch(u, {method: "POST", body: JSON.stringify(corp),
    headers: {"Content-Type": "application/json", "X-MIP-Token": (RL.d && RL.d.token) || ""}});
  let d = {};
  try{ d = await r.json(); }catch(e){}
  if(!r.ok && !d.eroare) d.eroare = `HTTP ${r.status}`;
  return d;
}

async function rlPorneste(id){
  const c = RL.d.comenzi.find(x => x.id === id), sel = document.getElementById("rl-b-" + id);
  const banca = sel ? sel.value : "";
  if(c.banca === "obligatoriu" && !banca){ alert("Alege întâi banca."); return; }
  const est = rlEst(c, banca);
  if(est > 600 && !confirm(`„${c.nume}”${banca ? " pe " + rlNumeBanca(banca) : ""} durează de obicei ~${rlDurata(est)}`
      + `${c.internet ? " și face cereri pe site-uri" : ""}. Cât rulează, nu se poate porni altceva. Pornești?`)) return;
  const r = await rlPost("/api/rulari/porneste", {id, banca: banca || null});
  if(r.eroare) alert(`Nu a pornit: ${r.eroare}`);
  await rlSondeaza(true);
}

async function rlOpreste(){
  const cur = RL.d && RL.d.curenta;
  if(!cur || !confirm(`Oprești „${cur.nume}”? Se oprește tot arborele de procese; ce a apucat să scrie rămâne.`)) return;
  const r = await rlPost("/api/rulari/opreste", {});
  if(r.eroare) alert(`Nu s-a oprit: ${r.eroare}`);
  await rlSondeaza(true);
}

/* Sondare la 2 s cât rulează ceva și cât Overview e deschis. Se redesenează
   doar panoul rulării; tabelul (cu selectoarele de bancă) doar când pornește
   sau se termină o rulare, cu băncile alese păstrate. */
async function rlSondeaza(tot){
  clearTimeout(RL.t);
  if(!document.getElementById("rl-corp")) return;
  let d;
  try{ d = await ia("/api/rulari"); }catch(e){ d = {eroare: e.message}; }
  const corp = document.getElementById("rl-corp");
  if(!corp) return;
  const inainte = RL.d && RL.d.curenta, acum = d.curenta;
  RL.d = d;
  const panou = document.getElementById("rl-curenta");
  if(tot || d.eroare || !inainte !== !acum || (inainte && acum && inainte.log !== acum.log) || !panou){
    const alese = [...corp.querySelectorAll("select")].map(s => [s.id, s.value]);
    corp.innerHTML = rulariCorp(d);
    alese.forEach(([i, v]) => { const s = document.getElementById(i); if(s){ s.value = v; rlEstimare(i.slice(5)); } });
  } else if(acum){
    panou.outerHTML = rlCurenta(acum);
  }
  const j = document.getElementById("rl-jurnal");
  if(j) j.scrollTop = j.scrollHeight;
  if(acum) RL.t = setTimeout(rlSondeaza, 2000);
}

/* ---------------- Catalogul intern Libra ----------------
   Produsele Libra vin din exportul intern (Sales Command Center), nu de pe web:
   e referința după care se va face colectarea pe produse la celelalte bănci.
   Nu are citat și link ca valorile colectate; proveniența e fișierul exportat. */
const fara_paranteza = t => String(t || "").replace(/\s*\([A-Z_]+\)\s*$/, "");
function sectiuneCatalog(cat){
  const categorii = [...new Map(cat.filter(x => x.categorie_cod).map(x => [x.categorie_cod, fara_paranteza(x.categorie)])).entries()];
  const lei = v => v === null || v === undefined ? null : num(v, 0) + " lei";
  const elig = x => [
    x.cifra_afaceri_min !== null || x.cifra_afaceri_max !== null
      ? `cifră de afaceri ${x.cifra_afaceri_min !== null ? "de la " + lei(x.cifra_afaceri_min) : ""}${x.cifra_afaceri_max !== null ? " până la " + lei(x.cifra_afaceri_max) : ""}` : "",
    x.vechime_min_ani !== null ? `vechime minimă ${num(x.vechime_min_ani)} ani` : "",
    x.vechime_max_ani !== null ? `vechime maximă ${num(x.vechime_max_ani)} ani` : "",
    x.linii_business ? `linii de business: ${x.linii_business}` : "",
    x.caen_prefixe ? `CAEN: ${x.caen_prefixe}` : "",
    x.criterii_eligibilitate || "",
  ].filter(Boolean);
  const detalii = x => (x.cand_recomand || elig(x).length) ? `<details class="despre" style="margin:4px 0 0"><summary>detalii</summary>
      <div class="note" style="max-width:70ch">
        ${x.cand_recomand ? `<b>Când îl recomanzi:</b> ${esc(x.cand_recomand)}<br>` : ""}
        ${elig(x).length ? `<b>Eligibilitate:</b> ${esc(elig(x).join(" · "))}` : ""}</div></details>` : "";
  const d = cat[0].generat_la ? String(cat[0].generat_la).slice(0, 10).split("-").reverse().join(".") : "";
  return `<section>
    <div class="filtre" style="align-items:center">
      <h2 style="margin:0">Catalogul intern de produse <span class="mono gri" style="font-size:12px;font-weight:400">${cat.length} produse</span></h2>
      <select id="cat-filtru" style="margin-left:auto" onchange="filtreazaCatalog()">
        <option value="">toate categoriile</option>
        ${categorii.map(([k, n]) => `<option value="${esc(k)}">${esc(n)} (${cat.filter(x => x.categorie_cod === k).length})</option>`).join("")}
      </select>
      <select id="cat-segment" onchange="filtreazaCatalog()" style="min-width:0">
        <option value="">PF și PJ</option><option value="PF">persoane fizice</option><option value="PJ">firme</option>
      </select>
      <input class="cauta" id="cat-cauta" placeholder="Caută produs…" oninput="filtreazaCatalog()">
    </div>
    <div id="t-catalog">${tabel(cat, [
      {cap: "Produs", html: true, s: x => x.denumire,
       val: x => `<b style="font-weight:600">${esc(x.denumire)}</b>${x.produs_prioritar ? ' <span class="eticheta-best" title="produs prioritar în catalog">prioritar</span>' : ""}
         <span class="sub mono">${esc(x.cod)}</span>`},
      {cap: "Categorie", s: x => fara_paranteza(x.categorie), val: x => fara_paranteza(x.categorie) || "—"},
      {cap: "Pentru cine", s: x => x.segment, val: x => x.segment === "PF+PJ" ? "PF și PJ" : x.segment === "PF" ? "persoane fizice" : x.segment === "PJ" ? "firme" : (x.adresabilitate || "—")},
      {cap: "Ce oferă", html: true, val: x => `${esc(x.caracteristici || "—")}${detalii(x)}`},
    ], {sort: true,   // derulare în tabel (70% din ecran): restul fișei rămâne la îndemână
        rand: x => ({cauta: `${x.denumire} ${x.cod} ${x.caracteristici || ""} ${x.categorie || ""}`,
                     attr: `data-cat="${esc(x.categorie_cod || "")}" data-seg="${esc(x.segment || "")}"`})})}</div>
    ${despre(`Sursa: exportul intern „${esc(cat[0].fisier)}"${d ? `, generat pe ${d}` : ""}, din Sales Command Center
      (LIBRAREPORTING) — <b>uz intern</b>. Produsele Libra nu se mai colectează de pe site: catalogul e referința
      după care se va face colectarea pe produse la celelalte bănci. Prețurile și dobânzile Libra de mai jos
      rămân cele colectate din documentele de tarife.`)}
  </section>`;
}

/* filtrul catalogului: categorie + segment + căutare, fără cerere nouă */
function filtreazaCatalog(){
  const c = document.getElementById("cat-filtru").value, s = document.getElementById("cat-segment").value;
  const q = document.getElementById("cat-cauta").value.trim().toLowerCase();
  const rows = [...document.querySelectorAll("#t-catalog tbody tr")];
  rows.forEach(tr => {
    const ok = (!c || tr.dataset.cat === c) && (!s || (tr.dataset.seg || "").includes(s))
            && (!q || (tr.dataset.cauta || "").includes(q));
    tr.style.display = ok ? "" : "none";
  });
}

R.produseMatrice = async (stare) => {

  const pe = {};

        ${[["toate","Oricine (tot ce avem)"],["pf","Doar persoane fizice"],
           ["pj","Doar firme"],["pfa","Doar PFA"]]
          .map(([v,t]) => `<option value="${v}" ${v === seg ? "selected" : ""}>${t}</option>`).join("")}
      </select></label>

  </div></div>
  <section>
    <p class="note" style="margin:0 0 10px">${banci.length} bănci · în fiecare celulă: <b>câte prețuri</b> avem,
      între ce valori și câte sunt gratuite. <b>Clic pe celulă</b> pentru toate prețurile, cu citatul și

      ${d.segmente.map(s => `<span class="pill">${esc(s.seg)}: ${num(s.n,0)}</span>`).join(" ")}<br>

const plRang = v => { const r = v.scenariu && v.scenariu.referinta; return r ? PL_RANG[r.potrivire] : 2; };
const PL_VALUTA_IC = {EUR: "euro", USD: "dolar", GBP: "lira", RON: "bancnota"};
function plIcEticheta(x){
  if(/asigur/i.test(x)) return "scut";
  if(/salariu/i.test(x)) return "servieta";
  if(/venit/i.test(x)) return "portofel";
  if(/perioad|luni|\ban\b/i.test(x)) return "calendar";
  if(/străin/i.test(x)) return "glob";
  if(/client nou/i.test(x)) return "clientNou";

const plEPromo = (s, v) => /promo/i.test([(s && s.cod) || "", ((s && s.etichete) || []).join(" "), (v && v.conditie) || ""].join(" "));
// etichetele de scenariu: {t: text, ic: iconiță, cls: clasă}; oferta e prima, ca să sară în ochi
function plScenariu(s, v){
  const e = [];
  if(plEPromo(s, v)) e.push({t: "Ofertă", ic: "oferta", cls: "of"});
  if(!s) return e;
  const ref = s.referinta && PL_REF[s.referinta.potrivire];
  if(ref) e.push({t: ref.t, ic: "tinta", cls: ref.cls});
  if(s.varianta) e.push({t: s.varianta, ic: "straturi", cls: "var"});
  const bani = (n, m) => `${num(n, 0)} ${m === "EUR" ? "EUR" : m === "USD" ? "USD" : "lei"}`;
  if(s.valuta){ const c = s.valuta === "LEI" ? "RON" : s.valuta; e.push({t: c, ic: PL_VALUTA_IC[c] || "monede", cls: "val"}); }
  if(s.suma != null) e.push({t: s.suma_max != null ? `${bani(s.suma, s.moneda)} – ${bani(s.suma_max, s.moneda)}` : bani(s.suma, s.moneda), ic: "monede"});
  if(s.perioada_luni != null) e.push({t: `${s.perioada_luni} ${s.perioada_luni === 1 ? "lună" : "luni"}`, ic: "calendar"});
  if(s.perioada_zile != null) e.push({t: `${s.perioada_zile} ${s.perioada_zile === 1 ? "zi" : "zile"}`, ic: "calendar"});
  if(s.fix_ani != null) e.push({t: `fix ${s.fix_ani} ${s.fix_ani === 1 ? "an" : "ani"}`, ic: "lacat"});
  if(s.venit_min != null) e.push({t: `venit ≥ ${num(s.venit_min, 0)} lei`, ic: "portofel"});
  (s.etichete || []).filter(x => x !== s.varianta && !/promo/i.test(x) && (/ /.test(x) || /[^ -~]/.test(x) || PL_ET.has(x)))

function plConditie(v){
  let c = v.conditie || "";

  if(cod && c.startsWith(cod)) c = c.slice(cod.length).replace(/^;\s*/, "");
  return c.replace(/^valuta [A-Z]{3};?\s*/, "");

function plVizibila(v, stare){
  if(stare.amb === "1" && v.ambiguu) return false;
  if(stare.low === "1" && v.incredere != null && v.incredere < 0.85) return false;
  const ref = v.scenariu && v.scenariu.referinta;
  if(stare.ref === "1" && ref && (ref.potrivire === "alt" || ref.potrivire === "nespecificat")) return false;
  return true;

function plCelula(lista, stare){
  // întâi valorile pe scenariul de referință, apoi cele fără scenariu, la urmă alte exemple
  const l = (lista || []).filter(v => plVizibila(v, stare)).sort((a, b) => plRang(a) - plRang(b));

/* Dovada unei valori într-un modal centrat (nu în sertarul lateral al celorlalte

function plModal(titlu, sub, html){
  let m = document.getElementById("pl-modal");
  if(!m){
    m = document.createElement("div");
    m.id = "pl-modal"; m.className = "pl-modal"; m.hidden = true;
    m.innerHTML = `<div class="pl-modal-fundal"></div>
      <div class="pl-modal-cutie" role="dialog" aria-modal="true" aria-labelledby="pl-modal-t">
        <div class="pl-modal-cap"><div><h3 id="pl-modal-t"></h3><p class="note" id="pl-modal-s"></p></div>
          <button class="pl-modal-x" aria-label="Închide">×</button></div>
        <div id="pl-modal-c"></div>
      </div>`;
    document.body.appendChild(m);
    m.querySelector(".pl-modal-fundal").onclick = plInchideModal;
    m.querySelector(".pl-modal-x").onclick = plInchideModal;
  }
  clearTimeout(plModal.t);
  document.getElementById("pl-modal-t").textContent = titlu;
  document.getElementById("pl-modal-s").innerHTML = sub || "";
  document.getElementById("pl-modal-c").innerHTML = html;
  m.hidden = false;
  m.offsetWidth;                       // pornește tranziția din starea inițială
  m.classList.add("deschis");
  m.querySelector(".pl-modal-x").focus({preventScroll: true});
}
function plInchideModal(){
  const m = document.getElementById("pl-modal");
  if(!m || !m.classList.contains("deschis")) return;
  m.classList.remove("deschis");
  plModal.t = setTimeout(() => { m.hidden = true; }, 260);
}

     <blockquote style="margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg)">${esc(v.citat || "")}</blockquote>
     <p><a href="${esc(v.link || v.url)}" target="_blank" rel="noopener">Deschide documentul${v.tip === "html" && v.link !== v.url ? " la paragraf" : ""} ↗</a>
       <span class="gri">· ${esc((v.tip || "").toUpperCase())}</span></p>
     <p class="note">Încredere ${v.incredere != null ? num(v.incredere) : "—"} · colectat ${esc(v.data_colectare || "")} ·
       ${v.stare === "validat" ? "validat de un om" : "propunere, neverificată de un om"}</p>
     ${v.ambiguu ? `<p class="callout warn">${esc(v.motiv_ambiguu || "Aceeași condiție are și alte valori în document.")}</p>` : ""}`);
}
// căutarea filtrează cardurile pe loc, fără să reîncarce pagina
function plFiltreazaLista(inp){
  const t = inp.value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll(".pl-card").forEach(b => { b.hidden = t && !b.dataset.cauta.includes(t); if(!b.hidden) n++; });
  const c = document.getElementById("pl-nr"); if(c) c.textContent = `${n} produse`;
}
function plDeruleaza(dir){
  const t = document.getElementById("pl-track");
  if(t) t.scrollBy({left: dir * t.clientWidth * 0.8, behavior: "smooth"});
}
/* Tabelul se derulează în interiorul lui, nu pagina: capul cu băncile rămâne
   mereu vizibil. Înălțimea se potrivește cu ce a rămas din ecran sub carduri. */
function plPotriveste(){
  const w = document.getElementById("pl-tw");
  if(!w) return;
  const main = document.querySelector("main");
  const ingust = window.innerWidth < 860;
  const sus = w.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop;
  // cu 20% peste spațiul rămas pe ecran: restul se vede derulând puțin pagina
  w.style.maxHeight = Math.round(1.2 * (ingust ? window.innerHeight - 70 : Math.max(380, main.clientHeight - sus - 24))) + "px";
  const t = document.getElementById("pl-track"), a = t && t.querySelector(".pl-card.activ");
  if(!t) return;
  if(a) t.scrollLeft = a.offsetLeft - (t.clientWidth - a.offsetWidth) / 2;
  if(t.dataset.rotita) return;       // la redimensionare, ascultătorul există deja
  t.dataset.rotita = "1";
  /* Rotița verticală deasupra sliderului îl mută pe orizontală (altfel derula
     pagina). La capete o lasă să deruleze pagina, ca să nu „blocheze” mouse-ul. */
  t.addEventListener("wheel", e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    const max = t.scrollWidth - t.clientWidth;
    if((e.deltaY < 0 && t.scrollLeft <= 0) || (e.deltaY > 0 && t.scrollLeft >= max - 1)) return;
    e.preventDefault();
    t.scrollLeft += e.deltaY;
  }, {passive: false});
}
window.addEventListener("resize", () => plPotriveste());

R.produse = async (stare) => {
  const tab = stare.vedere === "matrice" ? "matrice" : "libra";
  const comutator = `<div class="taburi pl-vedere">
      <button class="${tab === "libra" ? "activ" : ""}" onclick="mergi('produse',{})">Comparație cu Libra</button>

    </div>`;
  if(tab === "matrice") return `<div style="margin-bottom:12px">${comutator}</div>` + await R.produseMatrice(stare);

  const [lista, m] = await Promise.all([ia("/api/comparatie_libra"), meta()]);

  (lista.negasite || []).forEach(x => { (nf[x.cod] = nf[x.cod] || {})[x.banca] = x; });
  const banci = (lista.banci || []).map(b => b.slug);

  const st = k => Object.assign({}, stare, k);

  const carduri = produse.map(p => `<button class="pl-card ${ales && p.cod === ales.cod ? "activ" : ""}"

        return `<span class="pl-lg ${sta}" title="${esc(t)}">${logo(b) || esc(nume(b).slice(0, 3))}</span>`;

        : '<span class="gri" title="niciun câmp cu valori și la Libra, și la concurență">—</span>'}</span>
    </button>`).join("");

  // tabelul produsului ales: un rând per câmp, o coloană per bancă
  PL.vals = [];

  if(d){
    const pc = {};
    (d.valori || []).forEach(v => { ((pc[v.camp] = pc[v.camp] || {})[v.banca] = pc[v.camp][v.banca] || []).push(v); });
    const vede = l => (l || []).some(v => plVizibila(v, stare));

      : vede(pc[c].libra) && banci.some(b => b !== "libra" && vede(pc[c][b])));
    campuri.sort((a, b) => (a === "altele") - (b === "altele") || etNume(a).localeCompare(etNume(b), "ro"));

    }).join("");
    const randuri = campuri.map(c => `<tr><th class="camp" scope="row">${esc(etNume(c))}<small>${esc(c)}</small></th>${
      banci.map(b => {
        const html = plCelula(pc[c][b], stare);
        const ascunse = !html && (pc[c][b] || []).length;

    tabelHtml = campuri.length

          <tbody>${randuri}</tbody></table></div>`
      : `<p class="note">${stare.toate === "1" ? "Nicio valoare pentru filtrele alese." :
          "Niciun câmp nu are valori și la Libra, și la o altă bancă. Bifează „Arată și câmpurile necomparabile” ca să vezi tot ce s-a colectat."}</p>`;
  }

  const refProdus = d && (d.valori || []).map(v => v.scenariu && v.scenariu.referinta).find(Boolean);
  return `
  <div class="pl-filtre">
    <div class="taburi">${segTab}</div>
    <input class="cauta" placeholder="Caută produs: depozit, card, credit…" oninput="plFiltreazaLista(this)">
    ${comutator}
  </div>
  <div class="pl-chipuri">${chipuri}</div>
  <div class="pl-slider">
    <button class="pl-sag" onclick="plDeruleaza(-1)" aria-label="Produsele anterioare">‹</button>
    <div class="pl-track" id="pl-track">${carduri || '<p class="note">Niciun produs.</p>'}</div>
    <button class="pl-sag" onclick="plDeruleaza(1)" aria-label="Produsele următoare">›</button>
  </div>
  <section class="pl-sec">
    ${ales ? `<div class="pl-cap">
      <h2>${esc(ales.denumire)}</h2>
      <span class="gri mono" style="font-size:11px">${esc(ales.cod)} · ${esc(ales.segment || "")}${ales.prioritar ? " · prioritar" : ""}</span>
      ${refProdus ? `<span class="pl-ref" title="DAE, dobânzile și ratele se compară doar pe același exemplu de sumă, perioadă și valută">${plIc("tinta")}Scenariu de referință: <b>${esc(refProdus.nume)}</b></span>` : ""}
      <span class="pl-bife">${refProdus ? chk("ref", "Doar scenariul de referință") : ""}${chk("toate", "Și câmpurile necomparabile")}${chk("low", "Ascunde încrederea sub 0,85")}${chk("amb", "Ascunde valorile neclare")}</span>
    </div>` : ""}
    ${tabelHtml}

R.rate = async (stare) => {
  const cat = stare.categorie || "depozite";
  const termen = stare.termen || "", produs = stare.produs || "";
  const [d, indici, m] = await Promise.all([
    ia(`/api/rate?categorie=${cat}&termen=${encodeURIComponent(termen)}&produs=${encodeURIComponent(produs)}`),
    ia("/api/indici"), meta(),
  ]);
  const mare = d.sens === "mare_bun";
  const pe = {};
  d.celule.forEach(c => { (pe[c.banca] = pe[c.banca] || {})[c.camp] = c; });
  const banci = Object.keys(pe);
  const campuri = d.campuri.filter(cp => banci.some(b => pe[b][cp]));

  /* Cea mai bună valoare pe coloană: doar un câștigător UNIC cu cel puțin
     MIN_VALORI valori colectate. Altfel „cel mai bun" ar fi banca despre care
     știm cel mai puțin. */
  const best = {};
  campuri.forEach(cp => {
    const cel = banci.map(b => pe[b][cp]).filter(Boolean);
    if(!cel.length) return;
    const ext = mare ? Math.max(...cel.map(c => c.valoare)) : Math.min(...cel.map(c => c.valoare));
    const egali = cel.filter(c => c.valoare === ext);
    if(egali.length === 1 && egali[0].n >= MIN_VALORI) best[cp] = egali[0].banca;
  });
  const termenTxt = c => c.luni ? (c.luni % 12 === 0 && c.luni >= 12 ? `${c.luni / 12} ${c.luni === 12 ? "an" : "ani"}` : `${c.luni} luni`)
                               : (c.frecventa || "");
  const coloane = [
    {cap: "Bancă", html: true, s: b => m.nume[b] || b, val: b => etichetaBanca(b, m, {fisa: true, tag: true})},
    ...campuri.map(cp => ({
      capHtml: `${esc(etNume(cp))}<span class="cap-d">${esc(etDesc(cp))}</span>`,
      html: true, cls: "", s: b => (pe[b][cp] || {}).valoare,
      td: b => pe[b][cp]
        ? {cls: "mc" + (best[cp] === b ? " best" : ""),
           attr: `onclick="deschideSertar('${esc(b)}','${esc(cp)}','procent','${esc(cat)}',${esc(JSON.stringify({termen, produs}))})"
                  title="toate cele ${pe[b][cp].n} valori, cu citat și link"`}
        : {cls: "gol"},
      val: b => {
        const c = pe[b][cp];
        if(!c) return "—";
        const ctx = [termenTxt(c), c.serviciu ? (c.serviciu.length > 34 ? c.serviciu.slice(0, 33) + "…" : c.serviciu) : ""]
          .filter(Boolean).join(" · ");
        return `<b>${num(c.valoare)}%</b>${best[cp] === b ? '<span class="eticheta-best" style="display:block;width:max-content;margin-left:auto">cea mai bună</span>' : ""}
          ${ctx ? `<span class="sub" style="white-space:normal;max-width:24ch;margin-left:auto">${esc(ctx)}</span>` : ""}
          <span class="sub">${c.n > 1 ? `${num(c.minim)}–${num(c.maxim)}% · ${c.n} valori` : "1 valoare"}</span>`;
      },
    })),
  ];
  const cp0 = campuri[0];
  /* Un singur tip de dobândă (la depozite doar nominala: DAE și marja peste
     IRCC țin de credite): matricea ar avea o singură coloană de cifre, cu tot
     contextul înghesuit sub ea și gol în dreapta. Aici fiecare informație are
     coloana ei — dobânda, termenul, oferta, intervalul — pe toată lățimea. */
  const plat = campuri.length === 1 ? [
    {cap: "Bancă", html: true, s: b => m.nume[b] || b, val: b => etichetaBanca(b, m, {fisa: true, tag: true})},
    {capHtml: `${esc(etNume(cp0))}<span class="cap-d">tipică (mediana)</span>`, cls: "num", html: true,
     s: b => pe[b][cp0].valoare, td: b => ({cls: best[cp0] === b ? "mc best" : "mc"}),
     val: b => `<b>${num(pe[b][cp0].valoare)}%</b>${best[cp0] === b ? '<span class="eticheta-best" style="display:block;width:max-content;margin-left:auto">cea mai bună</span>' : ""}`},
    {cap: "Termen", html: true, s: b => pe[b][cp0].luni,
     val: b => termenTxt(pe[b][cp0]) ? esc(termenTxt(pe[b][cp0])) : '<span class="gri" title="sursa nu spune termenul">nespecificat</span>'},
    {cap: "Oferta", html: true, s: b => pe[b][cp0].serviciu,
     val: b => { const c = pe[b][cp0];
       return `${esc(c.serviciu || "—")}${c.conditie ? `<span class="sub">${esc(c.conditie.slice(0, 110))}</span>` : ""}`; }},
    {cap: "Interval", cls: "num", html: true, s: b => pe[b][cp0].maxim,
     val: b => { const c = pe[b][cp0];
       return `<span style="white-space:nowrap">${c.minim === c.maxim ? `${num(c.minim)}%` : `${num(c.minim)}–${num(c.maxim)}%`}</span>`; }},
    {cap: "Valori", cls: "num", s: b => pe[b][cp0].n, val: b => num(pe[b][cp0].n, 0)},
  ] : null;
  const html = banci.length && plat
    ? tabel(banci, plat, {sort: true, lung: true, libra: b => b, implicit: [1, mare ? "desc" : "asc"],
        rand: b => ({cauta: `${m.nume[b] || ""} ${b}`,
                     clic: `deschideSertar('${esc(b)}','${esc(cp0)}','procent','${esc(cat)}',${esc(JSON.stringify({termen, produs}))})`})})
    : banci.length
    ? tabel(banci, coloane, {sort: true, lung: true, libra: b => b,
        implicit: cp0 ? [1, mare ? "desc" : "asc"] : null, rand: b => ({cauta: `${m.nume[b] || ""} ${b}`})})
    : `<div class="gol-stare"><b>Nicio valoare pentru filtrul curent</b>
         ${termen ? "Termenul ales nu apare în sursele colectate. " : ""}Încearcă „toate".</div>`;

  // Indicii BNR sunt pe pagina 2.6; aici doar reperul pentru credite și depozite.
  const ultimaZi = indici.filter(x => x.indice === "robor").map(x => String(x.valabil_din).slice(0, 10)).sort().pop();
  const r3 = indici.find(x => x.indice === "robor" && x.scadenta === "3M" && String(x.valabil_din).slice(0, 10) === ultimaZi);
  const azi = new Date().toISOString().slice(0, 10);
  const ircc = indici.filter(x => x.indice === "ircc" && String(x.valabil_din).slice(0, 10) <= azi
                                 && (!x.valabil_pana || String(x.valabil_pana).slice(0, 10) >= azi))[0];

  return `
  <div class="bara-fixa"><div class="filtre">
    <div class="taburi">
      ${[["depozite","Depozite"],["credite","Credite"],["conturi_carduri","Conturi & carduri"]]
        .map(([v,t]) => `<button class="${v === cat ? "activ" : ""}" onclick="mergi('rate',{categorie:'${v}'})">${t}</button>`).join("")}
    </div>
    ${cat === "depozite" ? `<label class="f">Termen
      <select onchange="mergi('rate',{categorie:'${cat}',termen:this.value})">
        <option value="">toate termenele</option>
        ${d.termene.map(t => `<option value="${t.cheie}" ${t.cheie === termen ? "selected" : ""} ${t.n ? "" : "disabled"}>${esc(t.eticheta)} (${t.n})</option>`).join("")}
      </select></label>` : ""}
    ${cat === "credite" ? `<label class="f">Produs
      <select onchange="mergi('rate',{categorie:'${cat}',produs:this.value})">
        <option value="">toate produsele</option>
        ${d.produse.map(t => `<option value="${t.cheie}" ${t.cheie === produs ? "selected" : ""} ${t.n ? "" : "disabled"}>${esc(t.eticheta)} (${t.n})</option>`).join("")}
      </select></label>` : ""}
    <label class="f">Caută bancă
      <input class="cauta" placeholder="ex. ING, Salt…" oninput="cautaInTabel(this,'t-rate')"></label>
    <span class="note" style="margin-left:auto;text-align:right">
      ${r3 ? `ROBOR 3M <b>${num(r3.valoare)}%</b>` : ""}${ircc ? ` · IRCC <b>${num(ircc.valoare)}%</b>` : ""}
      <a href="#/context">→ indici BNR</a></span>
  </div></div>

      <button class="${plat === "android" ? "activ" : ""}" onclick="mergi('mobil',{platforma:'android'})">Android · Google Play</button>

/* Numele contului din adresă: fără domeniu, fără `company/` sau `pages/`,
   fără id-ul numeric pe care Facebook îl lipește la paginile vechi. */
function contSocial(url, retea){
  let p = url.replace(/^https?:\/\/[^/]+\/?/, "").replace(/[?#].*$/, "").replace(/\/+$/, "");
  try{ p = decodeURIComponent(p); }catch(e){}
  const seg = p.replace(/^(company|pages|p)\//, "").split("/").filter(Boolean);
  const nume = seg.find(s => !/^\d+$/.test(s));
  if(!nume) return "pagină fără nume · " + (seg[0] || "");
  const h = nume.replace(/-\d{9,}$/, "");
  return (retea === "instagram" || retea === "tiktok") && !h.startsWith("@") ? "@" + h : h;
}

/* răspunsurile API ale paginii, ținute 5 minute: schimbarea secțiunii nu mai cere 1,6 MB din nou
   (numele se termină în „ia(”: app/verifica_pagini.py găsește rutele după acest tipar) */
function cmia(u){
  const c = CP.cache[u];
  if(c && Date.now() - c.t < 3e5) return c.p;
  const p = ia(u);
  CP.cache[u] = {t: Date.now(), p};
  p.catch(() => delete CP.cache[u]);
  return p;
}

# nginx — Marketing Command Center. Interfața React (web/dist) e servită direct;
# API-ul, siglele, PDF-urile și harta merg la app/server.py, care acceptă doar
# conexiuni de pe loopback și cere logare cu contul AD pentru orice dată
# (app/autentificare.py). Interfața se încarcă fără sesiune (pagina de logare);
# datele, nu.
#
# X-Real-IP și X-Forwarded-Proto sunt obligatorii spre :8765: X-Real-IP = adresa
# reală pentru limitarea încercărilor de logare și semnul că cererea vine prin
# nginx (deci niciodată „utilizator local”); X-Forwarded-Proto: https = cookie-ul
# de sesiune primește Secure. proxy_set_header înlocuiește antetul venit de la client.
#
# Certificatul: wildcard-ul *.libra.bank emis de Libra Enterprise Root CA, ca la
# rcc-test, command-center și st-test (valabil până la 10.02.2028). Copie locală
# din /srv/linux-sysprep/certs în /etc/nginx/ssl/, cheia 600 root.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mcc-test.libra.bank 172.16.69.84;
    return 301 https://mcc-test.libra.bank$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mcc-test.libra.bank 172.16.69.84;

    ssl_certificate     /etc/nginx/ssl/wildcard.libra.bank.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.libra.bank.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # pagina de logare nu se poate încadra în alt site (clickjacking pe parola AD)
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /opt/marketing/mcc/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # numele fișierelor din build conțin hash-ul, deci pot sta în cache oricât
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # un add_header în location anulează moștenirea celor din server {}: se repetă aici
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(api|logos|pdf)(/|$) {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # pdf.html și harta.html (UI-ul vechi) nu se mai publică pe server: aplicația
    # React are #/document și #/harta, iar paginile vechi încarcă PDF.js 3.11.174
    # (CVE-2024-4367) și MapLibre 4.7.1 (GHSA-jrc7-96c5-q579) de pe CDN. Rămân
    # doar pe laptopuri, prin serverul Python local.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

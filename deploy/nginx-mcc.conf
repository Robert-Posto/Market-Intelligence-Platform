# nginx — Marketing Command Center. Interfața React (web/dist) e servită direct;
# API-ul, siglele, PDF-urile și harta merg la app/server.py, care acceptă doar
# conexiuni de pe loopback. Fără autentificare deocamdată: serverul e accesibil
# doar din rețeaua internă; LDAP urmează, când se știu rolurile.
#
# Certificatul: wildcard-ul *.libra.bank emis de Libra Enterprise Root CA, ca la
# rcc-test, command-center și st-test (valabil până la 10.02.2028). Copie locală
# din /srv/linux-sysprep/certs în /etc/nginx/ssl/, cheia 600 root.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mcc-test.libra.bank 172.16.69.84;
    return 301 https://mcc-test.libra.bank$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mcc-test.libra.bank 172.16.69.84;

    ssl_certificate     /etc/nginx/ssl/wildcard.libra.bank.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.libra.bank.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/marketing/mcc/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # numele fișierelor din build conțin hash-ul, deci pot sta în cache oricât
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|logos|pdf)(/|$) {
        proxy_pass http://127.0.0.1:8765;
        proxy_read_timeout 120s;
    }

    location ~ ^/(pdf|harta)\.html$ {
        proxy_pass http://127.0.0.1:8765;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
